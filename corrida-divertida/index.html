<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#172544">
<title>Turma do Pistaço — Grande Corrida</title>
<style>
:root{--navy:#172544;--ink:#202c45;--pink:#ff5d8e;--yellow:#ffcf45;--blue:#48c7f4;--mint:#83e6bc}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#405f9a,#172544 68%);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff;display:grid;place-items:center;padding:12px;touch-action:manipulation}.cabinet{width:min(980px,100%);background:#fff8e9;color:var(--ink);border:5px solid #fff;border-radius:28px;box-shadow:0 18px 60px #07132699;overflow:hidden}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px}.brand{font-size:clamp(20px,4vw,28px);font-weight:1000;letter-spacing:-.5px}.brand span{color:#ff578b}.topright{display:flex;gap:7px;align-items:center}.pill{padding:7px 11px;border-radius:999px;background:#edf4ff;font-weight:900;font-size:14px}.sound{border:0;background:#e8f5ff;border-radius:50%;height:42px;width:42px;font-size:20px;cursor:pointer}.arena{position:relative;margin:0 10px;height:clamp(270px,52vh,445px);border-radius:20px;overflow:hidden;background:linear-gradient(#70d7ff 0 43%,#83d66f 43%)}canvas{display:block;width:100%;height:100%}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#10203b82;backdrop-filter:blur(3px);padding:18px}.card{background:#fff8e9;color:var(--ink);border:4px solid #fff;border-radius:24px;padding:18px;max-width:440px;width:100%;text-align:center;box-shadow:0 12px 30px #07132655}.card h2{font-size:clamp(24px,5vw,36px);line-height:1.05;margin:0 0 8px;color:#ec4d80}.card p{margin:5px 0 14px;font-weight:750}.choose{display:flex;justify-content:center;gap:10px;margin:8px 0 14px}.pick{font-size:36px;border:3px solid #dce6f4;border-radius:16px;background:white;width:76px;height:68px;cursor:pointer}.pick.active{border-color:#ff5d8e;background:#fff0f5;transform:translateY(-3px)}.big{border:0;border-radius:18px;padding:13px 20px;font-weight:1000;font-size:clamp(18px,4vw,23px);min-height:58px;cursor:pointer;box-shadow:0 5px 0 #0002;color:#23314a;touch-action:manipulation}.big:active{transform:translateY(4px);box-shadow:0 1px 0 #0002}.start{background:var(--yellow)}.racecontrols{display:flex;align-items:center;justify-content:center;gap:10px;padding:12px;flex-wrap:wrap}.gas{background:#ffcf45;min-width:min(48vw,255px)}.turbo{background:#ff93b5;min-width:140px}.small{background:#dff3ff;min-height:52px;padding:10px 16px}.status{width:100%;text-align:center;font-weight:950;font-size:clamp(17px,3.6vw,22px);min-height:28px}.instructions{text-align:center;color:#52617a;font-size:13px;font-weight:700;margin:0 12px 12px}.hidden{display:none!important}
</style></head><body><main class="cabinet"><div class="top"><div class="brand">🏁 TURMA DO <span>PISTAÇO</span></div><div class="topright"><span class="pill" id="lap">PRONTO?</span><span class="pill" id="stars">⭐ 0</span><button class="sound" id="sound" aria-label="Ativar ou desligar som">🔊</button></div></div><div class="arena"><canvas id="game" aria-label="Corrida animada com carros e personagens"></canvas><div class="overlay" id="intro"><div class="card"><h2>GRANDE<br>CORRIDA! 🏆</h2><p>Escolha seu piloto e prepare o motor!</p><div class="choose"><button class="pick active" data-pilot="🐯" aria-label="Tigre">🐯</button><button class="pick" data-pilot="🐸" aria-label="Sapo">🐸</button><button class="pick" data-pilot="🦖" aria-label="Dinossauro">🦖</button></div><button class="big start" id="start">🚦 COMEÇAR A CORRIDA!</button></div></div><div class="overlay hidden" id="finish"><div class="card"><h2 id="result">VOCÊ CHEGOU! 🏆</h2><p id="resultText">Mandou muito bem, piloto!</p><button class="big start" id="again">🏁 CORRER DE NOVO</button></div></div></div><div class="racecontrols"><button class="big small" id="left">⬅️</button><button class="big gas" id="gas">🟡 SEGURE PARA ACELERAR</button><button class="big turbo" id="turbo">⚡ TURBO!</button><button class="big small" id="right">➡️</button><div class="status" id="status">Escolha seu piloto. A corrida vai começar!</div></div><p class="instructions">Segure o botão amarelo para acelerar · Mude de faixa para pegar estrelas · Use o turbo! ⚡</p></main>
<script>
(()=>{const c=document.querySelector('#game'),x=c.getContext('2d'),intro=document.querySelector('#intro'),finish=document.querySelector('#finish'),status=document.querySelector('#status'),lap=document.querySelector('#lap'),starUI=document.querySelector('#stars'),gas=document.querySelector('#gas'),turbo=document.querySelector('#turbo');let W=800,H=400,d=1,running=false,selected='🐯',lane=1,player=0,rivals=[0,0,0],rivalLanes=[0,1,2],stars=[],items=[],road=0,score=0,boost=0,held=false,last=0,raf=0,soundOn=true,audio=null;
function resize(){const b=c.getBoundingClientRect();d=Math.min(devicePixelRatio||1,2);c.width=b.width*d;c.height=b.height*d;W=b.width;H=b.height;x.setTransform(d,0,0,d,0,0);draw()}
function rr(a,b,w,h,r,col){x.fillStyle=col;x.beginPath();x.roundRect(a,b,w,h,r);x.fill()}
function text(t,a,b,size,align='center'){x.textAlign=align;x.font=`900 ${size}px system-ui`;x.fillStyle='#26334d';x.fillText(t,a,b)}
function path(l,y){let roadW=Math.min(W*.72,600),left=W/2-roadW/2;return left+roadW*(l+.5)/3}
function car(cx,cy,emoji,color,scale=1,playerCar=false){x.save();x.translate(cx,cy);x.scale(scale,scale);x.fillStyle='#0004';x.beginPath();x.ellipse(0,18,31,8,0,0,7);x.fill();rr(-27,-6,54,34,13,color);rr(-19,-19,38,22,10,color);rr(-14,-16,12,13,5,'#c4f4ff');rr(2,-16,12,13,5,'#c4f4ff');rr(-31,1,7,13,3,'#252b3c');rr(24,1,7,13,3,'#252b3c');rr(-23,4,8,10,3,'#292e40');rr(15,4,8,10,3,'#292e40');rr(22,-2,5,6,2,'#fff6b3');x.font='22px system-ui';x.textAlign='center';x.fillText(emoji,0,-15);if(playerCar){x.strokeStyle='#fff';x.lineWidth=3;x.beginPath();x.ellipse(0,3,35,29,0,0,7);x.stroke()}x.restore()}
function draw(){x.clearRect(0,0,W,H);let horizon=H*.43;x.fillStyle='#69d7ff';x.fillRect(0,0,W,horizon); // sun and hills
x.fillStyle='#ffdf6b';x.beginPath();x.arc(W*.84,H*.14,28,0,7);x.fill();x.fillStyle='#70cd71';x.beginPath();x.moveTo(0,horizon);x.quadraticCurveTo(W*.16,H*.27,W*.36,horizon);x.quadraticCurveTo(W*.61,H*.24,W*.83,horizon);x.quadraticCurveTo(W*.94,H*.34,W,horizon);x.lineTo(W,H);x.lineTo(0,H);x.fill();
// road trapezoid
let rw=Math.min(W*.72,600),lx=W/2-rw/2;x.fillStyle='#515c70';x.beginPath();x.moveTo(W/2-rw*.24,horizon);x.lineTo(W/2+rw*.24,horizon);x.lineTo(W/2+rw*.5,H);x.lineTo(W/2-rw*.5,H);x.closePath();x.fill();
// colorful outer edges
for(let side=0;side<2;side++){for(let i=0;i<14;i++){let y=horizon+((i*39+road*1.2)%(H-horizon));let scale=(y-horizon)/(H-horizon);let xx=side?W/2+rw*(.24+.26*scale):W/2-rw*(.24+.26*scale);rr(xx-6*scale,y,12*scale,17*scale,3*scale,i%2?'#fff':'#ff5d8e')}}
// lane dashed lines
for(let l=1;l<3;l++)for(let i=0;i<8;i++){let y=horizon+((i*67+road*1.5)%(H-horizon));let scale=(y-horizon)/(H-horizon);let xx=W/2-rw*(.24-.48*l/3)+rw*.48*l/3;rr(xx-2*scale,y,4*scale,22*scale,3,'#fff6bd')}
// distance finish banner
let fy=horizon+((H-horizon)-player*(H-horizon)*.52);if(player<1){rr(W/2-rw*.25,fy-11,rw*.5,24,6,'#fff');text('CHEGADA 🏁',W/2,fy+7,Math.max(12,15*(.55+(fy-horizon)/(H-horizon))))}
// backdrop cheering trees
for(let i=0;i<8;i++){let yy=horizon+((i*84+road)%(H-horizon));let s=(yy-horizon)/(H-horizon);for(let side of [-1,1]){let tx=W/2+side*(rw*(.27+.26*s)+17*s);x.fillStyle='#8b552f';x.fillRect(tx-3*s,yy-13*s,6*s,17*s);x.fillStyle=i%2?'#40b978':'#35aa79';x.beginPath();x.arc(tx,yy-19*s,11*s,0,7);x.fill()}}
// pickups
for(const it of items){let yy=it.y;if(yy>horizon&&yy<H){let xx=path(it.lane,yy);x.font=`${Math.max(16,28*(yy-horizon)/(H-horizon))}px system-ui`;x.textAlign='center';x.fillText(it.kind,xx,yy)}}
// rivals and player
const colors=['#ff8e45','#9573ff','#32c99a'],faces=['🐵','🐻','🐰'];rivals.forEach((p,i)=>{if(p<1){let yy=H*.88-p*(H*.46);car(path(rivalLanes[i],yy),yy,faces[i],colors[i],.55+.45*(yy/H))}});car(path(lane,H*.82),H*.82,selected,boost>0?'#ffcf45':'#ff5d8e',1.03,true);
// speed sparkles
if(boost>0){for(let i=0;i<6;i++){x.fillStyle=i%2?'#fff':'#ffdf6b';x.beginPath();x.arc(path(lane,H*.75)+(Math.random()-.5)*75,H*.66+Math.random()*90,2+Math.random()*4,0,7);x.fill()}}
}
function beep(freq=480,dur=.08){if(!soundOn)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=freq;o.type='sine';g.gain.setValueAtTime(.06,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch(e){}}
function begin(){intro.classList.add('hidden');finish.classList.add('hidden');running=true;player=0;score=0;lane=1;boost=0;rivals=[0,0,0];stars=[];items=[];road=0;status.textContent='ACELERA, PILOTO! 🏎️';lap.textContent='3... 2... 1... VAI!';beep(700,.2);cancelAnimationFrame(raf);last=performance.now();raf=requestAnimationFrame(tick)}
function tick(now){if(!running)return;let dt=Math.min((now-last)/1000,.05);last=now;let speed=(held?0.22:0.09)+(boost>0?.23:0);player+=speed*dt;road+=dt*(held?290:130)+(boost>0?250*dt:0);boost=Math.max(0,boost-dt);rivals=rivals.map((p,i)=>Math.min(.97,p+(.11+i*.015)*dt));if(Math.random()<dt*.45)items.push({lane:Math.floor(Math.random()*3),y:H*.45,kind:'⭐'});items.forEach(it=>it.y+=dt*(held?290:130)+(boost>0?250*dt:0));items=items.filter(it=>it.y<H+20);for(let i=items.length-1;i>=0;i--){let it=items[i];if(it.y>H*.77&&it.y<H*.9&&it.lane===lane){score++;items.splice(i,1);starUI.textContent='⭐ '+score;status.textContent='PEGOU ESTRELA! ⭐';beep(880,.07)}}draw();let lead=Math.max(...rivals);if(player>=1){running=false;lap.textContent='FIM DA CORRIDA';document.querySelector('#result').textContent=player>lead?'VOCÊ VENCEU! 🏆':'CHEGOU! 🏁';document.querySelector('#resultText').textContent=`Pegou ${score} estrela${score===1?'':'s'}! Vamos correr outra?`;finish.classList.remove('hidden');status.textContent='QUE CORRIDA INCRÍVEL! 🎉';beep(950,.2);setTimeout(()=>beep(1150,.3),180);return}lap.textContent=Math.ceil((1-player)*100)+'% DA PISTA';raf=requestAnimationFrame(tick)}
function changeLane(n){if(!running)return;lane=Math.max(0,Math.min(2,lane+n));beep(350,.04);draw()}document.querySelectorAll('.pick').forEach(b=>b.onclick=()=>{document.querySelectorAll('.pick').forEach(z=>z.classList.remove('active'));b.classList.add('active');selected=b.dataset.pilot;draw()});document.querySelector('#start').onclick=begin;document.querySelector('#again').onclick=begin;document.querySelector('#left').onclick=()=>changeLane(-1);document.querySelector('#right').onclick=()=>changeLane(1);gas.addEventListener('pointerdown',e=>{e.preventDefault();held=true;gas.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>gas.addEventListener(ev,()=>held=false));turbo.onclick=()=>{if(running&&boost<=0){boost=2.2;status.textContent='TURBOOO! ⚡';beep(320,.22);draw()}};document.querySelector('#sound').onclick=e=>{soundOn=!soundOn;e.currentTarget.textContent=soundOn?'🔊':'🔇';if(soundOn)beep()};window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')changeLane(-1);if(e.key==='ArrowRight')changeLane(1);if(e.code==='Space'){held=true}});window.addEventListener('keyup',e=>{if(e.code==='Space')held=false});window.addEventListener('resize',resize);resize();draw();})();
</script></body></html>
