    .modal-bg{position:fixed;inset:0;background:#03070dcc;backdrop-filter:blur(6px);z-index:99;display:flex;align-items:center;justify-content:center;padding:15px}.modal{background:#151b28;border:1px solid #394154;border-radius:20px;width:min(100%,520px);max-height:min(88vh,800px);overflow:auto;box-shadow:0 30px 130px #0009;padding:24px}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:20px}.modal-head h2{font-size:19px;margin:0;letter-spacing:-.6px}.close{border:none;background:#22293a;color:var(--text);width:31px;height:31px;border-radius:8px;font-size:18px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:7px;min-width:0}.field.full{grid-column:1/-1}.field label{font-size:11px;color:#b6c0d0;font-weight:700}.field input,.field select{background:#0f1420;border:1px solid #343c50;border-radius:10px;color:var(--text);padding:12px;font-size:13px;min-height:44px;width:100%}.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.hint{font-size:11px;color:var(--muted);line-height:1.65}.toast{position:fixed;bottom:20px;right:20px;z-index:150;background:#253a34;color:#d5ffed;border:1px solid #4f8b74;border-radius:11px;padding:14px 18px;box-shadow:0 15px 35px #0007;font-size:12px;max-width:360px}.backdrop{display:none}
    .chat{display:flex;flex-direction:column;min-height:410px;max-height:540px;overflow-y:auto;gap:13px;padding:15px;background:#0e131e;border-radius:12px}.bubble{padding:14px 16px;border-radius:13px;max-width:88%;font-size:12px;line-height:1.7;white-space:pre-wrap}.bubble.agent{background:#202a3a;align-self:flex-start;border-bottom-left-radius:3px}.bubble.me{background:#f87b3a;color:#23120c;align-self:flex-end;border-bottom-right-radius:3px;font-weight:650}.chat-form{display:flex;gap:8px;margin-top:12px}.chat-form input{flex:1}.chips{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.chips button{border:1px solid var(--line);color:#cbd4e2;background:#1b2230;border-radius:18px;padding:9px 11px;font-size:11px}.chips button:hover{border-color:var(--orange)}

    @media(max-width:1180px){.stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.items-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:960px){.sidebar{position:fixed;transform:translateX(-100%);transition:transform .25s;box-shadow:15px 0 100px #0008}.sidebar.open{transform:translateX(0)}.sidebar-close{display:block;position:absolute;right:12px;top:15px;border:0;background:#fff3;color:white;border-radius:7px;font-size:18px}.backdrop.open{display:block;position:fixed;inset:0;background:#0009;z-index:40}.menu-btn{display:inline-flex}.main{padding:22px}}@media(max-width:680px){.main{padding:15px 13px 32px}.topbar{align-items:flex-start;margin-bottom:20px}.topbar h1{font-size:22px}.top-actions{width:100%}.top-actions .input-surface{flex:1}.banner{align-items:flex-start;flex-direction:column}.stat-grid{gap:9px}.stat{padding:14px}.stat strong{font-size:18px}.stat-head{font-size:10px}.layout-two{grid-template-columns:1fr}.items-grid{grid-template-columns:1fr}.insights-grid{grid-template-columns:1fr}.panel{padding:15px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.modal{padding:17px}.toolbar .fields{width:100%}.toolbar .fields input,.toolbar .fields select{flex:1}.top-actions>.btn-primary{padding:10px}.chat{min-height:330px}}

<body>
<div class="app">
  <div id="backdrop" class="backdrop" onclick="setMenu(false)"></div>
  <aside id="sidebar" class="sidebar">
    <button class="sidebar-close" onclick="setMenu(false)" aria-label="Fechar menu">×</button>
    <div class="brand"><span class="brand-mark">◈</span><div><strong>Pulso</strong><small>FINANCEIRO</small></div></div>
    <div class="side-label">Organização</div>
    <nav id="nav" class="nav" aria-label="Menu principal"></nav>
    <div class="side-foot"><b>◉ Protótipo interativo</b>Seus dados de demonstração ficam neste navegador. Não há conexão bancária nem servidor.</div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:11px"><button class="btn menu-btn" onclick="setMenu(true)" aria-label="Abrir menu">☰</button><div><h1 id="page-title">Visão geral</h1><p id="page-subtitle">Seu dinheiro, com mais clareza.</p></div></div>
      <div class="top-actions"><select class="input-surface" id="scope" onchange="setScope(this.value)" aria-label="Perfil financeiro"><option value="pessoal">◉ Pessoal</option><option value="empresa">▣ Empresa</option></select><input class="input-surface" type="month" id="month" onchange="setMonth(this.value)" aria-label="Mês de referência"/><button class="btn btn-primary" onclick="openModal('transaction')">＋ Lançamento</button></div>
    </header>
    <div id="content"></div>
    <div class="foot-note">Pulso Financeiro · Demonstração local · Valores fictícios · Não é aconselhamento financeiro</div>
  </main>
</div>
<div id="modal-root"></div><div id="toast-root" role="status" aria-live="polite"></div>
<script>
'use strict';
const ICONS={dashboard:'▤',transactions:'↗',fixed:'▦',accounts:'▣',cards:'▱',goals:'◎',budget:'◫',reports:'▥',assistant:'✧',settings:'⚙'};
const MENU=[['dashboard','Dashboard','Resumo de indicadores'],['transactions','Lançamentos','Receitas e despesas'],['fixed','Gastos fixos','Contas recorrentes'],['accounts','Minhas contas','Saldos e movimentações'],['cards','Cartões de crédito','Controle dos limites'],['goals','Cofrinhos','Metas de economia'],['budget','Orçamento','Planejamento mensal'],['reports','Relatórios','Análises detalhadas'],['assistant','Assistente','Perguntas sobre seus dados'],['settings','Configurações','Backup e privacidade']];
const CATEGORIES=['Moradia','Alimentação','Transporte','Saúde','Educação','Lazer','Assinaturas','Compras','Salário','Vendas','Serviços','Investimentos','Outros'];
const COLORS={'Moradia':'#c7a3ff','Alimentação':'#ff9d5e','Transporte':'#81b1ff','Saúde':'#55d5b0','Educação':'#ffd77d','Lazer':'#ec8abb','Assinaturas':'#a1a9ff','Compras':'#ef8585','Salário':'#57dbaa','Vendas':'#57dbaa','Serviços':'#76bdfd','Investimentos':'#c3abff','Outros':'#a2b0c6'};
const key='pulso_financeiro_demo_v1';
const today=new Date();const currentMonth=localMonth(today);let view='dashboard',scope='pessoal',month=currentMonth,search='',txFilter='all',chat=[];
function localMonth(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function isoDate(day,ym=currentMonth){const max=new Date(Number(ym.slice(0,4)),Number(ym.slice(5,7)),0).getDate();return ym+'-'+String(Math.min(day,max)).padStart(2,'0')}
function uid(){return 'id_'+Math.random().toString(36).slice(2,10)+Date.now().toString(36)}
function seed(){const ym=currentMonth;const mk=(id,title,type,amount,category,day,accountId,cardId)=>({id,title,type,amount,category,date:isoDate(day,ym),accountId:accountId||'',cardId:cardId||'',method:cardId?'credit':'account'});return {version:1,scopes:{pessoal:{accounts:[{id:'acc1',name:'Conta principal',balance:1950},{id:'acc2',name:'Reserva de emergência',balance:6200}],cards:[{id:'card1',name:'Cartão principal',limit:5500,closing:5}],goals:[{id:'g1',name:'Viagem de férias',target:7000,saved:2500},{id:'g2',name:'Notebook novo',target:5000,saved:900}],fixed:[{id:'f1',name:'Aluguel',amount:1250,category:'Moradia',day:10,accountId:'acc1',paid:{}},{id:'f2',name:'Internet',amount:120,category:'Assinaturas',day:20,accountId:'acc1',paid:{}},{id:'f3',name:'Academia',amount:95,category:'Saúde',day:12,accountId:'acc1',paid:{}}],budgets:{Alimentação:1000,Transporte:450,Lazer:450,Compras:700},transactions:[mk('t1','Salário','income',4900,'Salário',2,'acc1'),mk('t2','Supermercado','expense',420,'Alimentação',3,'acc1'),mk('t3','Combustível','expense',185,'Transporte',4,'acc1'),mk('t4','Restaurante','expense',145,'Lazer',8,'','card1'),mk('t5','Consulta médica','expense',180,'Saúde',11,'acc1'),mk('t6','Freelance','income',680,'Serviços',14,'acc1'),mk('t7','Compras online','expense',289,'Compras',15,'','card1')]},empresa:{accounts:[{id:'eacc1',name:'Conta operacional',balance:13700},{id:'eacc2',name:'Caixa',balance:1250}],cards:[{id:'ecard1',name:'Cartão da empresa',limit:12000,closing:18}],goals:[{id:'eg1',name:'Capital de giro',target:30000,saved:12400}],fixed:[{id:'ef1',name:'Aluguel comercial',amount:2400,category:'Moradia',day:8,accountId:'eacc1',paid:{}},{id:'ef2',name:'Sistema de gestão',amount:290,category:'Assinaturas',day:18,accountId:'eacc1',paid:{}}],budgets:{Compras:5000,Transporte:1000,Assinaturas:600},transactions:[mk('et1','Vendas semana 1','income',8200,'Vendas',3,'eacc1'),mk('et2','Reposição de estoque','expense',2900,'Compras',5,'eacc1'),mk('et3','Serviços prestados','income',1450,'Serviços',10,'eacc1'),mk('et4','Publicidade','expense',420,'Outros',12,'eacc1'),mk('et5','Vendas semana 2','income',6900,'Vendas',15,'eacc1')]}}}}
let db,storageReady=true;try{db=JSON.parse(localStorage.getItem(key));if(!db||!db.scopes||!db.scopes.pessoal||!db.scopes.empresa)throw Error('invalid')}catch(e){db=seed();try{localStorage.setItem(key,JSON.stringify(db))}catch(err){storageReady=false}}
function save(){try{localStorage.setItem(key,JSON.stringify(db));storageReady=true;return true}catch(e){storageReady=false;return false}}
function D(){return db.scopes[scope]}
function fmt(n){return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(n)||0)}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function sum(arr,fn){return arr.reduce((a,x)=>a+(fn?fn(x):Number(x)||0),0)}
function inMonth(t,ym=month){return typeof t.date==='string'&&t.date.slice(0,7)===ym}
function monthTx(ym=month){return D().transactions.filter(t=>inMonth(t,ym))}
function isIncome(t){return t.type==='income'}
function monthly(ym=month){let ts=monthTx(ym);let income=sum(ts.filter(isIncome),x=>+x.amount),out=sum(ts.filter(t=>t.type==='expense'),x=>+x.amount);return {income,out,result:income-out,tx:ts}}
function accBalance(a){return Number(a.balance)+sum(D().transactions.filter(t=>t.accountId===a.id && t.method!=='credit'),t=>t.type==='income'?+t.amount:-t.amount)}
function accTotal(){return sum(D().accounts,accBalance)}
function cardSpent(c){return sum(monthTx().filter(t=>t.cardId===c.id&&t.type==='expense'),t=>+t.amount)}
function allGoals(){return sum(D().goals,g=>+g.saved)}
function categoryExpenses(){let m={};for(const t of monthTx().filter(t=>t.type==='expense'))m[t.category]=(m[t.category]||0)+ +t.amount;return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function pct(a,b){return b>0?Math.round(a/b*100):0}
function monthLabel(ym=month){let [y,m]=ym.split('-').map(Number);return new Intl.DateTimeFormat('pt-BR',{month:'long',year:'numeric'}).format(new Date(y,m-1,1))}
function dateBR(s){if(!s)return '—';let [y,m,d]=s.split('-');return `${d}/${m}/${y}`}
function stat(label,value,note,accent,ico){return `<div class="stat" style="--accent:${accent}"><div class="stat-head"><span>${label}</span><span class="stat-icon">${ico}</span></div><strong>${fmt(value)}</strong><small>${note}</small></div>`}
function progress(a,b,col){return `<div class="bar" style="--fill:${col||'var(--orange)'}"><span style="width:${Math.min(100,Math.max(0,pct(a,b)))}%"></span></div>`}
function topSection(title,sub='',action=''){return `<div class="section-top"><h2>${title}</h2>${action||`<span>${sub}</span>`}</div>`}
function empty(title,body){return `<div class="empty"><b>${title}</b>${body}</div>`}
function nav(){document.getElementById('nav').innerHTML=MENU.map(([id,label])=>`<button class="${view===id?'active':''}" onclick="navigate('${id}')"><span style="font-size:17px;width:20px;text-align:center">${ICONS[id]}</span>${label}</button>`).join('')}
function navigate(next){view=next;search='';txFilter='all';render();setMenu(false);window.scrollTo({top:0,behavior:'smooth'})}
function setMenu(open){document.getElementById('sidebar').classList.toggle('open',open);document.getElementById('backdrop').classList.toggle('open',open)}
function setScope(next){scope=next;render()}
function setMonth(next){if(/^\d{4}-\d{2}$/.test(next)){month=next;render()}}
function render(){nav();document.getElementById('scope').value=scope;document.getElementById('month').value=month;let info=MENU.find(x=>x[0]===view);document.getElementById('page-title').textContent=info[1];document.getElementById('page-subtitle').textContent=info[2]+' · '+monthLabel();let html={dashboard:renderDashboard,transactions:renderTransactions,fixed:renderFixed,accounts:renderAccounts,cards:renderCards,goals:renderGoals,budget:renderBudget,reports:renderReports,assistant:renderAssistant,settings:renderSettings}[view]();document.getElementById('content').innerHTML=html}
function demoBanner(){return `<div class="banner"><div><strong>Bem-vindo ao Pulso Financeiro</strong><p>Dados fictícios para experimentar. Troque entre Pessoal e Empresa no topo; ${storageReady?"as alterações ficam neste navegador.":"o navegador bloqueou o salvamento; os registros serão perdidos ao sair."}</p></div><span class="pill">MODO DEMONSTRAÇÃO</span></div>`}
function recentTable(ts,max=7){ts=[...ts].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,max);if(!ts.length)return empty('Nenhum lançamento no período','Use “+ Lançamento” para adicionar sua primeira movimentação.');return `<div class="table-scroll"><table class="data-table"><thead><tr><th>Descrição</th><th>Categoria</th><th>Data</th><th>Origem</th><th style="text-align:right">Valor</th></tr></thead><tbody>${ts.map(t=>`<tr><td><b>${esc(t.title)}</b></td><td><span class="category-tag">${esc(t.category||'Transferência')}</span></td><td class="text-muted">${dateBR(t.date)}</td><td class="text-muted">${t.method==='credit'?'Cartão':t.type==='transfer'?'Cofrinho':'Conta'}</td><td style="text-align:right" class="${t.type==='income'?'type-in':t.type==='transfer'?'type-transfer':'type-out'}">${t.type==='income'?'+':t.type==='transfer'?'↔':'−'} ${fmt(t.amount)}</td></tr>`).join('')}</tbody></table></div>`}
function renderDashboard(){let v=monthly(),cats=categoryExpenses(),fixedDue=D().fixed.filter(f=>!f.paid?.[month]);return `${demoBanner()}<div class="stat-grid">${stat('Receitas do mês',v.income,'Entradas registradas','var(--green)','↗')}${stat('Despesas do mês',v.out,'Saídas e compras no crédito','var(--red)','↘')}${stat('Resultado do mês',v.result,'Receitas menos despesas',v.result>=0?'var(--blue)':'var(--red)','≋')}${stat('Saldo em contas',accTotal(),'Saldo calculado das contas','var(--orange)','▣')}</div>
${topSection('Panorama financeiro',monthLabel())}<div class="layout-two"><div class="panel"><div class="panel-head"><div><h3>Evolução de entradas e saídas</h3><p>Movimentações acumuladas por dia do mês</p></div><div class="mini-legend"><span><i class="dot" style="background:var(--green)"></i>Entradas</span><span><i class="dot" style="background:var(--red)"></i>Saídas</span></div></div>${lineChart(month)}</div><div class="panel"><div class="panel-head"><div><h3>Onde você gastou</h3><p>Despesas agrupadas por categoria</p></div><button class="little-btn" onclick="navigate('reports')">Detalhes</button></div>${cats.length?`<div class="stack-list">${cats.slice(0,6).map(([name,amount])=>`<div><div class="progress-line"><span>${esc(name)}</span><small>${fmt(amount)} · ${pct(amount,v.out)}%</small></div>${progress(amount,v.out,COLORS[name])}</div>`).join('')}</div>`:empty('Sem despesas','Adicione lançamentos para visualizar as categorias.')}</div></div>
${topSection('Movimentações recentes','',`<button class="little-btn" onclick="navigate('transactions')">Ver todos →</button>`)}<div class="panel">${recentTable(v.tx,6)}</div>
${topSection('Acompanhe seu planejamento')}<div class="layout-two"><div class="panel"><div class="panel-head"><div><h3>Cofrinhos</h3><p>${D().goals.length} metas cadastradas</p></div><button class="little-btn" onclick="navigate('goals')">Abrir</button></div><div class="stack-list">${D().goals.length?D().goals.slice(0,3).map(g=>`<div><div class="progress-line"><span>${esc(g.name)}</span><small>${fmt(g.saved)} de ${fmt(g.target)}</small></div>${progress(g.saved,g.target,'var(--green)')}</div>`).join(''):empty('Sem metas','Crie um cofrinho para começar.')}</div></div><div class="panel"><div class="panel-head"><div><h3>Gastos fixos do mês</h3><p>${fixedDue.length} contas ainda não marcadas como pagas</p></div><button class="little-btn" onclick="navigate('fixed')">Gerenciar</button></div><div class="stack-list">${fixedDue.length?fixedDue.slice(0,3).map(f=>`<div class="progress-line"><span>${esc(f.name)} <small>· dia ${f.day}</small></span><b>${fmt(f.amount)}</b></div>`).join(''):empty('Tudo em dia','Não há despesas fixas pendentes neste mês.')}</div></div></div>`}
function lineChart(ym){const [y,m]=ym.split('-').map(Number),days=new Date(y,m,0).getDate(),ts=monthTx(ym),income=[],expense=[];let a=0,b=0;for(let day=1;day<=days;day++){a+=sum(ts.filter(t=>t.type==='income'&&Number(t.date.slice(-2))===day),x=>+x.amount);b+=sum(ts.filter(t=>t.type==='expense'&&Number(t.date.slice(-2))===day),x=>+x.amount);income.push(a);expense.push(b)}const max=Math.max(...income,...expense,1)*1.1;const w=700,h=230,padL=55,padR=10,padT=8,padB=28;const X=i=>padL+(i/(days-1))*(w-padL-padR);const Y=n=>padT+(1-n/max)*(h-padT-padB);const poly=(arr)=>arr.map((n,i)=>`${X(i).toFixed(1)},${Y(n).toFixed(1)}`).join(' ');let grid=[0,.25,.5,.75,1].map((n)=>`<line class="gridline" x1="${padL}" y1="${Y(max*n)}" x2="${w-padR}" y2="${Y(max*n)}"/><text class="axis" x="${padL-7}" y="${Y(max*n)+4}" text-anchor="end">${max*n>=1000?(max*n/1000).toFixed(1)+'k':Math.round(max*n)}</text>`).join('');let xlab=[1,Math.ceil(days*.25),Math.ceil(days*.5),Math.ceil(days*.75),days].map(d=>`<text class="axis" x="${X(d-1)}" y="${h-5}" text-anchor="middle">${d}</text>`).join('');return `<div class="chart-wrap"><svg viewBox="0 0 700 230" preserveAspectRatio="none" role="img" aria-label="Gráfico de receitas e despesas acumuladas"><defs><linearGradient id="gr-income" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#51ddad" stop-opacity=".24"/><stop offset="1" stop-color="#51ddad" stop-opacity="0"/></linearGradient></defs>${grid}${xlab}<polygon points="${padL},${h-padB} ${poly(income)} ${w-padR},${h-padB}" fill="url(#gr-income)"/><polyline points="${poly(income)}" fill="none" stroke="#51ddad" stroke-width="3" stroke-linejoin="round"/><polyline points="${poly(expense)}" fill="none" stroke="#ff777f" stroke-width="3" stroke-linejoin="round"/></svg></div>`}
function renderTransactions(){let ts=[...monthTx()].filter(t=>(txFilter==='all'||t.type===txFilter)&&(!search||t.title.toLowerCase().includes(search.toLowerCase())||String(t.category||'').toLowerCase().includes(search.toLowerCase()))).sort((a,b)=>b.date.localeCompare(a.date)),m=monthly();return `${demoBanner()}<div class="stat-grid">${stat('Entradas',m.income,'No período selecionado','var(--green)','↗')}${stat('Despesas',m.out,'Inclui compras no cartão','var(--red)','↘')}${stat('Resultado',m.result,'Entradas menos despesas','var(--blue)','≋')}${stat('Lançamentos',m.tx.length,'Movimentações do mês','var(--purple)','▤').replace(fmt(m.tx.length),String(m.tx.length))}</div>${topSection('Histórico de transações')}<div class="panel"><div class="toolbar"><div class="fields"><input id="search" class="input-surface" placeholder="Pesquisar descrição ou categoria" value="${esc(search)}" oninput="setSearch(this.value)" style="min-width:240px"/><select class="input-surface" onchange="setFilter(this.value)"><option value="all" ${txFilter==='all'?'selected':''}>Todos os tipos</option><option value="income" ${txFilter==='income'?'selected':''}>Receitas</option><option value="expense" ${txFilter==='expense'?'selected':''}>Despesas</option><option value="transfer" ${txFilter==='transfer'?'selected':''}>Transferências para metas</option></select></div><button class="btn btn-primary" onclick="openModal('transaction')">＋ Novo lançamento</button></div>${ts.length?`<div class="table-scroll"><table class="data-table"><thead><tr><th>Descrição</th><th>Categoria</th><th>Data</th><th>Meio</th><th>Valor</th><th>Ação</th></tr></thead><tbody>${ts.map(t=>`<tr><td><b>${esc(t.title)}</b></td><td>${esc(t.category||'Cofrinho')}</td><td>${dateBR(t.date)}</td><td class="text-muted">${t.method==='credit'?'Cartão':t.type==='transfer'?'Cofrinho':'Conta'}</td><td class="${t.type==='income'?'type-in':t.type==='transfer'?'type-transfer':'type-out'}">${t.type==='income'?'+':'−'} ${fmt(t.amount)}</td><td><button class="little-btn" onclick="deleteTransaction('${t.id}')" aria-label="Excluir ${esc(t.title)}">Excluir</button></td></tr>`).join('')}</tbody></table></div>`:empty('Nenhum lançamento encontrado','Experimente outro filtro ou inclua uma nova movimentação.')}</div><p class="hint">Compras no cartão entram como despesas do mês, mas não são subtraídas da conta bancária. O protótipo não faz conciliação de faturas.</p>`}
function setSearch(v){search=v;renderContentOnly(true)}function setFilter(v){txFilter=v;renderContentOnly(true)}function renderContentOnly(focusSearch=false){const el=document.getElementById('content');let start=focusSearch&&document.activeElement.id==='search'?document.activeElement.selectionStart:null;el.innerHTML={transactions:renderTransactions}[view]();if(start!==null){let t=document.getElementById('search');t.focus();t.setSelectionRange(start,start)}}
function renderFixed(){let fs=[...D().fixed].sort((a,b)=>a.day-b.day);let paid=fs.filter(f=>f.paid?.[month]).length;return `${demoBanner()}<div class="stat-grid">${stat('Previsão de gastos fixos',sum(fs,f=>+f.amount),'Total previsto para o mês','var(--purple)','▦')}${stat('Já pagos',sum(fs.filter(f=>f.paid?.[month]),f=>+f.amount),`${paid} de ${fs.length} contas`,'var(--green)','✓')}${stat('Ainda pendentes',sum(fs.filter(f=>!f.paid?.[month]),f=>+f.amount),'Despesas ainda não marcadas','var(--orange)','◷')}${stat('Contas cadastradas',fs.length,'Repetem a cada mês','var(--blue)','◫').replace(fmt(fs.length),String(fs.length))}</div>${topSection('Despesas recorrentes','',`<button class="btn btn-primary" onclick="openModal('fixed')">＋ Cadastrar despesa</button>`)}<div class="panel">${fs.length?`<div class="table-scroll"><table class="data-table"><thead><tr><th>Descrição</th><th>Categoria</th><th>Vencimento</th><th>Valor</th><th>Situação em ${monthLabel()}</th><th>Ação</th></tr></thead><tbody>${fs.map(f=>`<tr><td><b>${esc(f.name)}</b></td><td>${esc(f.category)}</td><td>Dia ${String(f.day).padStart(2,'0')}</td><td>${fmt(f.amount)}</td><td><span class="category-tag" style="color:${f.paid?.[month]?'var(--green)':'var(--orange)'}">${f.paid?.[month]?'✓ Pago':'◷ Pendente'}</span></td><td>${f.paid?.[month]?`<button class="little-btn" onclick="toggleFixed('${f.id}')">Desfazer</button>`:`<button class="little-btn" onclick="toggleFixed('${f.id}')">Marcar pago</button>`} <button class="little-btn" onclick="deleteFixed('${f.id}')">Excluir</button></td></tr>`).join('')}</tbody></table></div>`:empty('Sem gastos fixos','Cadastre um gasto recorrente para controlar seus vencimentos.')}</div><p class="hint">Ao marcar como pago, o sistema cria uma despesa na data de hoje (ou no último dia do mês escolhido, se estiver em outro mês). Desfazer remove somente o lançamento gerado por esta ação.</p>`}
function renderAccounts(){let as=D().accounts;return `${demoBanner()}${topSection('Saldos por conta','',`<button class="btn btn-primary" onclick="openModal('account')">＋ Nova conta</button>`)}<div class="items-grid">${as.map(a=>`<div class="item-card"><div class="item-top"><span class="symbol">▣</span><span>Conta</span></div><h3>${esc(a.name)}</h3><div class="big">${fmt(accBalance(a))}</div><p>Saldo inicial: ${fmt(a.balance)}<br/>Saldo atualizado conforme seus lançamentos e transferências para cofrinhos.</p><button class="btn" onclick="openModal('transaction', '${a.id}')">＋ Movimentar</button></div>`).join('')}${!as.length?empty('Nenhuma conta','Cadastre uma conta para começar.'):''}</div>${topSection('Resumo da posição financeira')}<div class="stat-grid">${stat('Saldo em contas',accTotal(),'Disponível nas contas','var(--blue)','▣')}${stat('Guardado em cofrinhos',allGoals(),'Alocado nas metas','var(--green)','◎')}${stat('Patrimônio controlado',accTotal()+allGoals(),'Contas + cofrinhos','var(--orange)','≋')}${stat('Cartões cadastrados',D().cards.length,'Controle separado das contas','var(--purple)','▱').replace(fmt(D().cards.length),String(D().cards.length))}</div><p class="hint">O patrimônio aqui considera apenas contas e cofrinhos registrados. Não inclui dívidas de cartão, investimentos externos ou outros bens.</p>`}
function renderCards(){return `${demoBanner()}${topSection('Seus cartões','',`<button class="btn btn-primary" onclick="openModal('card')">＋ Novo cartão</button>`)}<div class="items-grid">${D().cards.map(c=>{let spent=cardSpent(c);return `<div class="item-card"><div class="item-top"><span class="symbol">▱</span><span>Fecha dia ${c.closing}</span></div><h3>${esc(c.name)}</h3><div class="big">${fmt(spent)}</div><p>Gastos no crédito registrados em ${monthLabel()}.</p><div class="progress-line"><span>Uso do limite</span><small>${pct(spent,c.limit)}%</small></div>${progress(spent,c.limit,spent>c.limit?'var(--red)':'var(--purple)')}<p>Limite: ${fmt(c.limit)} · Margem: ${fmt(c.limit-spent)}</p><button class="btn" onclick="openModal('transaction','', '${c.id}')">＋ Registrar compra</button></div>`}).join('')}${!D().cards.length?empty('Sem cartões','Cadastre um cartão para acompanhar suas compras.'):''}</div><div class="alert" style="margin-top:18px">Este módulo é um controle simplificado das compras no crédito. Parcelamento, pagamento de fatura e limite disponível real dependem de um módulo de faturas que pode ser implementado na versão completa.</div>`}
function renderGoals(){return `${demoBanner()}${topSection('Minhas metas financeiras','',`<button class="btn btn-primary" onclick="openModal('goal')">＋ Criar cofrinho</button>`)}<div class="items-grid">${D().goals.map(g=>`<div class="item-card"><div class="item-top"><span class="symbol">◎</span><span>${pct(g.saved,g.target)}% atingido</span></div><h3>${esc(g.name)}</h3><div class="big" style="color:var(--green)">${fmt(g.saved)}</div><p>Objetivo: ${fmt(g.target)}</p>${progress(g.saved,g.target,'var(--green)')}<p>${g.saved>=g.target?'Meta atingida!':'Faltam '+fmt(g.target-g.saved)+' para completar.'}</p><button class="btn btn-primary" onclick="openModal('deposit','${g.id}')">＋ Guardar dinheiro</button></div>`).join('')}${!D().goals.length?empty('Sem cofrinhos','Crie um objetivo para guardar dinheiro de forma organizada.'):''}</div><p class="hint">Um depósito reduz o saldo da conta selecionada e aumenta o valor do cofrinho. É uma transferência, não uma despesa. Não existe conexão com uma conta ou investimento real.</p>`}
function renderBudget(){let entries=Object.entries(D().budgets);return `${demoBanner()}${topSection('Limites de gastos por categoria','',`<button class="btn btn-primary" onclick="openModal('budget')">＋ Definir limite</button>`)}<div class="layout-two"><div class="panel"><div class="panel-head"><div><h3>Planejamento de ${monthLabel()}</h3><p>Compare o limite que definiu com o gasto efetivo</p></div></div><div class="stack-list">${entries.length?entries.map(([cat,limit])=>{let amount=categoryExpenses().find(x=>x[0]===cat)?.[1]||0;return `<div><div class="progress-line"><span><b>${esc(cat)}</b> ${amount>limit?'<span style="color:var(--red)">· acima do limite</span>':''}</span><small>${fmt(amount)} / ${fmt(limit)}</small></div>${progress(amount,limit,amount>limit?'var(--red)':COLORS[cat])}<button class="little-btn" style="margin-top:8px" onclick="openModal('budget','${esc(cat)}')">Editar limite</button></div>`}).join(''):empty('Nenhum limite definido','Crie seu orçamento mensal por categoria.')}</div></div><div class="panel"><div class="panel-head"><div><h3>Visão geral do orçamento</h3><p>Somente categorias que possuem limite cadastrado</p></div></div><div class="stack-list">${[['Limites planejados',fmt(sum(entries,x=>+x[1]))],['Gastos nessas categorias',fmt(sum(entries,x=>categoryExpenses().find(y=>y[0]===x[0])?.[1]||0))],['Categorias acima do limite',String(entries.filter(([cat,lim])=>(categoryExpenses().find(x=>x[0]===cat)?.[1]||0)>lim).length)]].map(([label,v])=>`<div class="progress-line"><span>${label}</span><b>${v}</b></div>`).join('')}</div><div class="insight" style="margin-top:26px"><h4>Boa prática</h4><p>Defina limites realistas e revise uma vez por semana. Planejamento útil é aquele que orienta decisões reais de compra.</p></div></div></div>`}
function renderReports(){let v=monthly(),cats=categoryExpenses(),months=[];for(let i=3;i>=0;i--){let [y,m]=month.split('-').map(Number);let dt=new Date(y,m-1-i,1),ym=localMonth(dt),a=monthly(ym);months.push([ym,a])}return `${demoBanner()}<div class="stat-grid">${stat('Receita do período',v.income,'Total recebido','var(--green)','↗')}${stat('Despesa do período',v.out,'Total consumido','var(--red)','↘')}${stat('Economia do mês',v.result,'Saldo entre entradas e saídas',v.result>=0?'var(--blue)':'var(--red)','≋')}${stat('Taxa de economia',v.income>0?v.result/v.income*100:0,'Percentual da receita','var(--purple)','%').replace(fmt(v.income>0?v.result/v.income*100:0),`${v.income>0?(v.result/v.income*100).toFixed(1).replace('.',','):'0'}%`)}</div>${topSection('Análise de gastos')}<div class="layout-two"><div class="panel"><div class="panel-head"><div><h3>Ranking de categorias</h3><p>Priorize as maiores despesas</p></div></div>${cats.length?`<div class="stack-list">${cats.map(([name,amount],idx)=>`<div><div class="progress-line"><span>${idx+1}. ${esc(name)}</span><b>${fmt(amount)} · ${pct(amount,v.out)}%</b></div>${progress(amount,v.out,COLORS[name])}</div>`).join('')}</div>`:empty('Sem dados','Registre gastos para gerar o ranking.')}</div><div class="panel"><div class="panel-head"><div><h3>Últimos quatro meses</h3><p>Comparativo das movimentações cadastradas</p></div></div><div class="stack-list">${months.map(([ym,m])=>`<div><div class="progress-line"><span>${monthLabel(ym)}</span><small>${fmt(m.income)} entradas</small></div>${progress(m.income,Math.max(...months.map(x=>x[1].income),1),'var(--green)')}<div style="height:5px"></div>${progress(m.out,Math.max(...months.map(x=>x[1].out),1),'var(--red)')}<div class="progress-line" style="margin:7px 0 0"><small>Despesas: ${fmt(m.out)}</small><b style="color:${m.result>=0?'var(--green)':'var(--red)'}">${fmt(m.result)}</b></div></div>`).join('')}</div></div></div>${topSection('Exportar dados')}<div class="panel"><p class="hint">Baixe seus lançamentos do perfil atual em formato CSV, que pode ser aberto em planilhas.</p><button class="btn btn-primary" onclick="exportCSV()">↓ Exportar lançamentos (CSV)</button></div>`}
function insights(){let v=monthly(),cats=categoryExpenses(),b=D().budgets,over=Object.entries(b).filter(([cat,lim])=>(cats.find(x=>x[0]===cat)?.[1]||0)>lim),fixedDue=D().fixed.filter(f=>!f.paid?.[month]);let msgs=[];if(v.income>0)msgs.push(`Você comprometeu ${Math.round(v.out/v.income*100)}% da receita do mês com despesas registradas.`);if(v.result<0)msgs.push(`O resultado de ${monthLabel()} está negativo em ${fmt(Math.abs(v.result))}. Reveja os maiores gastos antes de criar novas despesas.`);else msgs.push(`Seu resultado mensal é ${fmt(v.result)}. Atenção: é um cálculo dos lançamentos cadastrados, não uma previsão bancária.`);if(cats.length)msgs.push(`Maior categoria de despesa: ${cats[0][0]}, totalizando ${fmt(cats[0][1])}.`);if(over.length)msgs.push(`${over.length} categoria(s) ultrapassaram o orçamento: ${over.map(x=>x[0]).join(', ')}.`);if(fixedDue.length)msgs.push(`Você possui ${fixedDue.length} gasto(s) fixo(s) não marcados como pagos no mês.`);return msgs}
function answerQuestion(question){const q=question.toLowerCase(),v=monthly(),cats=categoryExpenses(),f=D().fixed.filter(x=>!x.paid?.[month]);if(/gast|despes|consum|saíd/.test(q)){return `Suas despesas registradas em ${monthLabel()} somam ${fmt(v.out)}. ${cats.length?'As principais categorias são '+cats.slice(0,3).map(([n,val])=>n+' ('+fmt(val)+')').join(', ')+'.':'Ainda não há categorias com gastos registrados.'}`;}if(/receit|entrad|ganh|fatur/.test(q))return `As entradas registradas neste mês totalizam ${fmt(v.income)}. O resultado após as despesas é ${fmt(v.result)}.`;if(/saldo|conta|dinheiro/.test(q))return `O saldo calculado de suas contas é ${fmt(accTotal())}. Além disso, ${fmt(allGoals())} estão registrados em cofrinhos. Valores baseados apenas nos dados desta demonstração.`;if(/orçament|limite|planej/.test(q)){let o=Object.entries(D().budgets).filter(([c,l])=>(cats.find(x=>x[0]===c)?.[1]||0)>l);return o.length?`Você excedeu o orçamento em: ${o.map(x=>x[0]).join(', ')}. Recomendo investigar os lançamentos antes de elevar os limites.`:'Nenhuma categoria cadastrada ultrapassou o limite neste mês. Confira se todas as categorias relevantes possuem orçamento.';}if(/fix|venc|pagar|penden/.test(q))return f.length?`Há ${f.length} gastos fixos pendentes no valor total de ${fmt(sum(f,x=>+x.amount))}: ${f.map(x=>x.name).join(', ')}.`:'Todos os gastos fixos cadastrados estão marcados como pagos para este mês.';if(/meta|cofrinh|economiz|guardar/.test(q))return `Você possui ${D().goals.length} metas e ${fmt(allGoals())} acumulados. ${D().goals.map(g=>g.name+': '+pct(g.saved,g.target)+'%').join('; ')}.`;return insights().join('\n\n')+'\n\nDica: pergunte sobre gastos, entradas, saldos, gastos fixos, orçamento ou metas.'}
function renderAssistant(){if(!chat.length)chat=[{from:'agent',msg:'Olá! Posso explicar seus números de demonstração e indicar pontos de atenção. Não sou uma IA conectada: este protótipo responde por regras locais, sem enviar seus dados a servidores.'}];return `${demoBanner()}<div class="layout-two"><div class="panel"><div class="panel-head"><div><h3>Seu assistente de finanças</h3><p>Respostas automáticas baseadas nos registros do perfil ${scope}</p></div><span class="pill">REGRAS LOCAIS · SEM IA</span></div><div id="chat" class="chat">${chat.map(c=>`<div class="bubble ${c.from==='agent'?'agent':'me'}">${esc(c.msg)}</div>`).join('')}</div><div class="chips">${['Onde mais gastei?','Como está meu saldo?','Tenho gastos fixos pendentes?','Como estão minhas metas?'].map(q=>`<button onclick="ask('${q}')">${q}</button>`).join('')}</div><form class="chat-form" onsubmit="event.preventDefault();ask(document.getElementById('chat-input').value)"><input id="chat-input" class="input-surface" maxlength="240" placeholder="Pergunte sobre seus números" aria-label="Sua pergunta"/><button class="btn btn-primary" type="submit">Enviar</button></form></div><div class="panel"><div class="panel-head"><div><h3>Leitura rápida</h3><p>Alertas extraídos dos seus dados</p></div></div><div class="stack-list">${insights().map(s=>`<div class="insight"><h4>◉ Observação</h4><p>${esc(s)}</p></div>`).join('')}</div></div></div>`}
function ask(q){q=String(q||'').trim();if(!q)return;chat.push({from:'me',msg:q},{from:'agent',msg:answerQuestion(q)});render();let el=document.getElementById('chat');el.scrollTop=el.scrollHeight}
function renderSettings(){return `${demoBanner()}${topSection('Seus dados e privacidade')}<div class="layout-two"><div class="panel"><div class="panel-head"><div><h3>Backup e restauração</h3><p>Dados salvos em armazenamento local do navegador</p></div></div><p class="hint">Para não perder dados ao limpar o navegador ou mudar de aparelho, exporte o backup. O arquivo JSON preserva todas as áreas de demonstração.</p><div class="settings-actions"><button class="btn btn-primary" onclick="exportJSON()">↓ Baixar backup</button><button class="btn" onclick="document.getElementById('import-file').click()">↑ Importar backup</button><input type="file" id="import-file" style="display:none" accept="application/json,.json" onchange="importJSON(this.files[0])"/></div><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"/><h3 style="font-size:14px">Redefinir demonstração</h3><p class="hint">Apaga os dados locais e carrega novamente os exemplos fictícios. Não pode ser desfeito sem um backup.</p><button class="btn btn-danger" onclick="resetDemo()">Redefinir dados locais</button></div><div class="panel"><div class="panel-head"><div><h3>Limitações desta versão</h3><p>O que a demonstração não faz</p></div></div><div class="stack-list"><div class="insight"><h4>Sem login ou sincronização</h4><p>Os dados não acompanham você entre aparelhos e não são apropriados para uso financeiro sensível em um dispositivo compartilhado.</p></div><div class="insight"><h4>Sem integração bancária</h4><p>Não conecta bancos, não movimenta dinheiro real e não processa pagamentos.</p></div><div class="insight"><h4>Sem conciliação de cartão</h4><p>Não calcula parcelas, fechamento de faturas ou pagamento de cartão. Compras são apenas registradas no mês.</p></div></div></div></div>`}
function modalHTML(title,fields,extra=''){return `<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title">${title}</h2><button class="close" onclick="closeModal()" aria-label="Fechar">×</button></div><form id="entry-form" onsubmit="submitModal(event)"><div class="form-grid">${fields}</div>${extra}<div class="form-actions"><button class="btn" type="button" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" type="submit">Salvar</button></div></form></div></div>`}
const field=(id,label,type='text',value='',opt='')=>`<div class="field ${opt==='full'?'full':''}"><label for="f-${id}">${label}</label><input id="f-${id}" name="${id}" type="${type}" value="${esc(value)}" ${type==='number'?'min="0.01" step="0.01"':''} ${id==='date'?'required':''} required/></div>`;
const selectField=(id,label,options,val='',extra='')=>`<div class="field"><label for="f-${id}">${label}</label><select id="f-${id}" name="${id}" ${extra} required>${options.map(([v,t])=>`<option value="${esc(v)}" ${val===v?'selected':''}>${esc(t)}</option>`).join('')}</select></div>`;
function accountOpts(){return D().accounts.map(a=>[a.id,a.name])}function cardOpts(){return D().cards.map(c=>[c.id,c.name])}
let modalType='',modalId='';
function openModal(type,id='',card=''){modalType=type;modalId=id;let html='',x=D(),f=field,s=selectField;let cat=CATEGORIES.map(a=>[a,a]);if(type==='transaction'){let chosen=card?'credit':'account';let ca=x.accounts.length?accountOpts():[['','Cadastre uma conta antes']];let cc=x.cards.length?cardOpts():[['','Cadastre um cartão antes']];html=modalHTML('Novo lançamento',`${f('title','Descrição da movimentação','text','','full')}${s('type','Tipo de lançamento',[['expense','Despesa'],['income','Receita']])}${f('amount','Valor (R$)','number')}${f('date','Data','date',isoDate(Math.min(today.getDate(),new Date(Number(month.slice(0,4)),Number(month.slice(5,7)),0).getDate()),month))}${s('category','Categoria',cat,'Outros')}${s('method','Forma de registro',[['account','Conta bancária / caixa'],['credit','Cartão de crédito']],chosen,'onchange="updateMethodFields()"')}${s('accountId','Conta',ca,id||ca[0]?.[0]||'')}${s('cardId','Cartão',cc,card||cc[0]?.[0]||'')}`,`<p class="hint">Lançamentos são registrados no perfil <b>${scope}</b>. Para transferência a um cofrinho, use o botão do próprio cofrinho.</p>`)}
else if(type==='fixed')html=modalHTML('Cadastrar gasto fixo',`${f('name','Descrição','text','','full')}${f('amount','Valor mensal (R$)','number')}${f('day','Dia do vencimento (1 a 28)','number',10)}${s('category','Categoria',cat,'Moradia')}${s('accountId','Conta para pagamento',accountOpts())}`);
else if(type==='account')html=modalHTML('Cadastrar conta',`${f('name','Nome da conta','text','','full')}${f('balance','Saldo inicial (R$)','number')}`,`<p class="hint">O saldo inicial é uma referência. As movimentações posteriores atualizam o saldo calculado.</p>`);
else if(type==='card')html=modalHTML('Cadastrar cartão',`${f('name','Nome do cartão','text','','full')}${f('limit','Limite contratado (R$)','number')}${f('closing','Dia de fechamento (1 a 28)','number',5)}`);
else if(type==='goal')html=modalHTML('Novo cofrinho',`${f('name','Nome do objetivo','text','','full')}${f('target','Meta em R$','number')}`);
else if(type==='deposit'){let g=x.goals.find(z=>z.id===id);if(!g)return;html=modalHTML('Guardar dinheiro',`<div class="field full"><label>Cofrinho</label><input value="${esc(g.name)}" disabled/></div>${f('amount','Valor do depósito (R$)','number')}${s('accountId','Retirar da conta',accountOpts())}`,`<p class="hint">O depósito transfere recursos da conta escolhida para o cofrinho. Não representa despesa.</p>`)}
else if(type==='budget'){let cats=CATEGORIES.map(c=>[c,c]);html=modalHTML(id?'Editar orçamento':'Definir orçamento',`${s('category','Categoria',cats,id||'Alimentação')}${f('amount','Limite mensal (R$)','number',id?(x.budgets[id]||''):'')}`,`<p class="hint">O limite é aplicado a todos os meses da demonstração; limites históricos por mês podem ser incluídos na versão completa.</p>`)}
if(!html)return;document.getElementById('modal-root').innerHTML=html;if(type==='transaction'){updateMethodFields();document.getElementById('f-type').onchange=updateMethodFields}document.querySelector('.modal input:not([disabled])')?.focus()}
function updateMethodFields(){let method=document.getElementById('f-method')?.value;let rowAcc=document.getElementById('f-accountId')?.parentNode,rowCard=document.getElementById('f-cardId')?.parentNode;if(rowAcc){rowAcc.style.display=method==='credit'?'none':'flex';rowAcc.querySelector('select').disabled=method==='credit'}if(rowCard){rowCard.style.display=method==='credit'?'flex':'none';rowCard.querySelector('select').disabled=method!=='credit'}if(method==='credit'){let type=document.getElementById('f-type');if(type){type.value='expense';type.querySelector('option[value="income"]').disabled=true}}else{let type=document.getElementById('f-type');if(type)type.querySelector('option[value="income"]').disabled=false}}
function closeModal(){document.getElementById('modal-root').innerHTML=''}
function getform(form){return Object.fromEntries(new FormData(form).entries())}
function submitModal(e){e.preventDefault();let t=modalType,obj=getform(e.target),d=D(),n=Number(obj.amount);if('amount' in obj&&(!Number.isFinite(n)||n<=0)){notify('Informe um valor maior que zero.');return}if(modalType==='transaction'){if(!obj.title.trim()){notify('Informe a descrição.');return}if(obj.method==='account'&&!obj.accountId||obj.method==='credit'&&!obj.cardId){notify('Cadastre primeiro uma conta ou cartão.');return}d.transactions.push({id:uid(),title:obj.title.trim().slice(0,100),type:obj.type,amount:n,date:obj.date,category:obj.category,method:obj.method,accountId:obj.method==='account'?obj.accountId:'',cardId:obj.method==='credit'?obj.cardId:''})}
else if(modalType==='fixed'){let day=Number(obj.day);if(day<1||day>28){notify('Use dia de vencimento entre 1 e 28.');return}if(!obj.accountId){notify('Cadastre uma conta primeiro.');return}d.fixed.push({id:uid(),name:obj.name.trim(),amount:n,day,category:obj.category,accountId:obj.accountId,paid:{}})}
else if(modalType==='account'){if(Number(obj.balance)<0){notify('O saldo inicial da demonstração deve ser zero ou positivo.');return}d.accounts.push({id:uid(),name:obj.name.trim(),balance:Number(obj.balance)})}
else if(modalType==='card'){let day=Number(obj.closing);if(day<1||day>28){notify('Use dia de fechamento de 1 a 28.');return}d.cards.push({id:uid(),name:obj.name.trim(),limit:n,closing:day})}
else if(modalType==='goal'){d.goals.push({id:uid(),name:obj.name.trim(),target:n,saved:0})}
else if(modalType==='deposit'){let g=d.goals.find(x=>x.id===modalId);if(!g||!obj.accountId){notify('Selecione uma conta.');return}let a=d.accounts.find(x=>x.id===obj.accountId);if(!a||accBalance(a)<n){notify('Saldo insuficiente na conta selecionada para esta transferência.');return}g.saved+=n;d.transactions.push({id:uid(),title:'Depósito: '+g.name,type:'transfer',amount:n,date:isoDate(Math.min(today.getDate(),new Date(Number(month.slice(0,4)),Number(month.slice(5,7)),0).getDate()),month),category:'Cofrinho',method:'account',accountId:a.id,goalId:g.id})}
else if(modalType==='budget'){d.budgets[obj.category]=n}
let persisted=save();closeModal();render();notify(persisted?'Registro salvo com sucesso.':'Registro criado nesta sessão, mas o salvamento local está bloqueado.')}
function deleteTransaction(id){let t=D().transactions.find(x=>x.id===id);if(!t)return;if(!confirm('Excluir o lançamento “'+t.title+'”?'))return;if(t.type==='transfer'&&t.goalId){let g=D().goals.find(x=>x.id===t.goalId);if(g)g.saved=Math.max(0,g.saved-t.amount)}for(let f of D().fixed){if(f.paid)for(let [ym,tid] of Object.entries(f.paid)){if(tid===id)delete f.paid[ym]}}D().transactions=D().transactions.filter(x=>x.id!==id);let persisted=save();render();notify(persisted?'Lançamento excluído.':'Lançamento excluído nesta sessão; salvamento local bloqueado.')}
function deleteFixed(id){let f=D().fixed.find(x=>x.id===id);if(!f)return;if(!confirm('Excluir este gasto fixo? Os pagamentos já registrados serão mantidos.'))return;D().fixed=D().fixed.filter(x=>x.id!==id);let persisted=save();render();notify(persisted?'Gasto fixo excluído.':'Gasto fixo excluído nesta sessão; salvamento local bloqueado.')}
function toggleFixed(id){let f=D().fixed.find(x=>x.id===id);if(!f)return;f.paid=f.paid||{};if(f.paid[month]){let tid=f.paid[month];D().transactions=D().transactions.filter(t=>t.id!==tid);delete f.paid[month];notify('Pagamento desfeito.')}else{let idTx=uid();let dt=month===currentMonth?Math.min(today.getDate(),new Date(Number(month.slice(0,4)),Number(month.slice(5,7)),0).getDate()):Math.min(f.day,new Date(Number(month.slice(0,4)),Number(month.slice(5,7)),0).getDate());D().transactions.push({id:idTx,title:f.name,type:'expense',amount:f.amount,category:f.category,date:isoDate(dt,month),method:'account',accountId:f.accountId,fixedId:f.id});f.paid[month]=idTx;notify('Gasto fixo marcado como pago e lançado.')}let persisted=save();render();if(!persisted)notify('Alteração não salva: armazenamento local bloqueado.')}
function notify(msg){document.getElementById('toast-root').innerHTML=`<div class="toast">✓ ${esc(msg)}</div>`;clearTimeout(notify.timer);notify.timer=setTimeout(()=>document.getElementById('toast-root').innerHTML='',3500)}
function download(name,text,type){let blob=new Blob([text],{type}),link=document.createElement('a'),url=URL.createObjectURL(blob);link.href=url;link.download=name;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportJSON(){download('pulso-financeiro-backup.json',JSON.stringify(db,null,2),'application/json;charset=utf-8');notify('Backup criado.')}
function exportCSV(){let rows=[['Data','Descrição','Tipo','Categoria','Valor','Forma'],...D().transactions.map(t=>[t.date,t.title,t.type,t.category,t.amount,t.method])];let csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');download('pulso-lancamentos-'+scope+'.csv',csv,'text/csv;charset=utf-8');notify('Arquivo CSV exportado.')}
function validateBackup(x){return !!(x&&x.version===1&&x.scopes&&['pessoal','empresa'].every(s=>{let v=x.scopes[s];return v&&['accounts','cards','goals','fixed','transactions'].every(k=>Array.isArray(v[k])&&v[k].length<50000)&&v.budgets&&typeof v.budgets==='object'}))}
async function importJSON(file){if(!file)return;if(file.size>5000000){notify('Arquivo muito grande.');return}try{let data=JSON.parse(await file.text());if(!validateBackup(data))throw Error('invalid');if(!confirm('Substituir todos os dados locais pelos dados deste backup?'))return;db=data;let persisted=save();render();notify(persisted?'Backup restaurado.':'Backup carregado, mas o salvamento local está bloqueado.')}catch(e){notify('Arquivo inválido. Escolha um backup do Pulso Financeiro.')}}
function resetDemo(){if(!confirm('Redefinir TODOS os dados locais? Você perderá qualquer lançamento próprio sem backup.'))return;db=seed();chat=[];let persisted=save();render();notify(persisted?'Demonstração redefinida.':'Demonstração redefinida nesta sessão; salvamento local bloqueado.')}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();setMenu(false)}});render();
</script>
