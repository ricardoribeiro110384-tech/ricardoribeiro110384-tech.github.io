  <script defer>
'use strict';
/* Ritmo+ — MVP local, sem dependências externas. */
const STORE_KEY='ritmo:app:v1';
const CATS=['Trabalho','Estudos','Saúde','Pessoal','Finanças','Outros'];
const PRIORITIES=['Alta','Média','Baixa'];
const LABELS={dashboard:'Painel de desempenho',semana:'Planejamento semanal',metas:'Minhas metas',agenda:'Agenda pessoal',analise:'Análise de desempenho',ajustes:'Configurações'};
const EMPTY=()=>({version:1,tasks:[],goals:[],events:[]});
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
const uid=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(16).slice(2);
const pad=n=>String(n).padStart(2,'0');
const dateKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>dateKey(new Date());
function parseDate(k){const [y,m,d]=String(k).split('-').map(Number);return new Date(y,m-1,d,12)}
function isDate(k){return /^\d{4}-\d\d-\d\d$/.test(String(k))&&dateKey(parseDate(k))===k}
function addDays(k,n){let d=parseDate(k);d.setDate(d.getDate()+n);return dateKey(d)}
function monday(k){return addDays(k,-(parseDate(k).getDay()+6)%7)}
function weekDays(k){let m=monday(k);return Array.from({length:7},(_,i)=>addDays(m,i))}
function fmt(k,opt={day:'2-digit',month:'short'}){return new Intl.DateTimeFormat('pt-BR',opt).format(parseDate(k))}
function fmtDate(k){return fmt(k,{day:'2-digit',month:'2-digit',year:'numeric'})}
function fmtWeekDay(k){return fmt(k,{weekday:'long'})}
function pct(n,d){return d?Math.round(n/d*100):null}
function pctLabel(x){return x==null?'—':x+'%'}
function taskRatio(ts){let done=ts.filter(t=>t.done).length;return {done,total:ts.length,pct:pct(done,ts.length)}}
function completionThisWeek(){return taskRatio(state.data.tasks.filter(t=>t.date>=monday(today())&&t.date<=today()))}
function consistency(){let good=0,eligible=0;for(let i=6;i>=0;i--){const r=taskRatio(state.data.tasks.filter(t=>t.date===addDays(today(),-i)));if(!r.total)continue;eligible++;if(r.pct>=80)good++}return {good,eligible,pct:pct(good,eligible)}}
function weeklyTrend(n=6){const start=monday(today());return Array.from({length:n},(_,i)=>{const wk=addDays(start,-7*(n-1-i)),end=addDays(wk,6)<today()?addDays(wk,6):today();const r=taskRatio(state.data.tasks.filter(t=>t.date>=wk&&t.date<=end));return {wk,...r}})}
function monthRef(offset=0){const d=parseDate(today());d.setDate(1);d.setMonth(d.getMonth()+offset);return dateKey(d)}
function validateData(x){if(!x||typeof x!=='object'||x.version!==1||!Array.isArray(x.tasks)||!Array.isArray(x.goals)||!Array.isArray(x.events))return false;if(x.tasks.length+x.goals.length+x.events.length>25000)return false;
 return x.tasks.every(t=>t&&typeof t.id==='string'&&typeof t.title==='string'&&isDate(t.date)&&CATS.includes(t.category)&&PRIORITIES.includes(t.priority)&&typeof t.done==='boolean')&&x.goals.every(g=>g&&typeof g.id==='string'&&typeof g.title==='string'&&CATS.includes(g.category)&&Number.isFinite(g.target)&&g.target>0&&Number.isFinite(g.current)&&['ativa','concluída','pausada'].includes(g.status))&&x.events.every(e=>e&&typeof e.id==='string'&&typeof e.title==='string'&&isDate(e.date));}
function loadData(){try{const raw=localStorage.getItem(STORE_KEY);if(!raw)return EMPTY();const parsed=JSON.parse(raw);return validateData(parsed)?parsed:EMPTY()}catch{return EMPTY()}}
const state={data:loadData(),weekOffset:0,monthOffset:0,selectedDate:today(),analysisPeriod:'6',lastView:''};
function save(){localStorage.setItem(STORE_KEY,JSON.stringify(state.data));render()}
function notify(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;$('#toast-root').appendChild(t);setTimeout(()=>t.remove(),3500)}
function view(){let key=location.hash.slice(1).split('?')[0]||'dashboard';return LABELS[key]?key:'dashboard'}
function top(eyebrow,title,subtitle,actions=''){return `<div class="page-head"><div><div class="eyebrow">${esc(eyebrow)}</div><h1>${esc(title)}</h1><p class="subtitle">${subtitle}</p></div>${actions?`<div class="page-actions">${actions}</div>`:''}</div>`}
function btn(action,text,cls='',attrs=''){return `<button type="button" class="button ${cls}" data-action="${action}" ${attrs}>${text}</button>`}
function panel(title,body,action=''){return `<section class="panel"><div class="panel-head"><h2>${title}</h2>${action}</div>${body}</section>`}
function empty(title,body,button=''){return `<div class="empty"><span class="empty-icon">◌</span><strong>${title}</strong>${body}${button?`<div>${button}</div>`:''}</div>`}
function progress(percent){return `<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${percent||0}"><span style="width:${Math.min(100,Math.max(0,percent||0))}%"></span></div>`}
function stat(icon,label,value,foot,tone=''){return `<div class="stat ${tone}"><div class="stat-icon">${icon}</div><div class="stat-label">${label}</div><strong class="accent">${value}</strong><div class="stat-foot">${foot}</div></div>`}
function taskSort(a,b){return Number(a.done)-Number(b.done)||PRIORITIES.indexOf(a.priority)-PRIORITIES.indexOf(b.priority)||(a.time||'99:99').localeCompare(b.time||'99:99')}
function taskItem(t){return `<div class="task-row ${t.done?'checked':''}"><input class="task-check" aria-label="Concluir ${esc(t.title)}" type="checkbox" data-toggle="${esc(t.id)}" ${t.done?'checked':''}/><div class="task-body"><div class="task-title">${esc(t.title)}</div><div class="task-meta">${t.time?`<span>◷ ${esc(t.time)}</span>`:''}<span class="tag ${t.priority==='Alta'?'high':t.priority==='Média'?'medium':'low'}">${esc(t.priority)}</span><span>${esc(t.category)}</span>${t.duration?`<span>· ${Number(t.duration)} min</span>`:''}</div></div><div class="row-actions"><button title="Editar tarefa" aria-label="Editar ${esc(t.title)}" class="icon-btn" data-action="edit-task" data-id="${esc(t.id)}">✎</button><button title="Excluir tarefa" aria-label="Excluir ${esc(t.title)}" class="icon-btn" data-action="delete-task" data-id="${esc(t.id)}">×</button></div></div>`}
function dayBar(){const days=weekDays(today()),items=days.map(d=>{const r=taskRatio(state.data.tasks.filter(t=>t.date===d));return {day:d,done:r.done,total:r.total}}),max=Math.max(...items.map(x=>x.total),1);
 return `<div class="chart-wrap"><div class="bar-chart">${items.map(x=>`<div class="bar-group"><div class="bar-pair"><div class="bar planned" title="${x.total} planejadas" style="height:${x.total?Math.max(3,Math.round(x.total/max*95)):0}%"></div><div class="bar done" title="${x.done} concluídas" style="height:${x.done?Math.max(3,Math.round(x.done/max*95)):0}%"></div></div><label>${esc(fmt(x.day,{weekday:'short'}).replace('.',''))}</label></div>`).join('')}</div></div>`}
function trendChart(){const items=weeklyTrend(),max=Math.max(...items.map(x=>x.total),1);return `<div class="trends">${items.map(x=>`<div class="trend-col"><div class="mini">${pctLabel(x.pct)}</div><div class="bars"><span title="${x.total} previstas" style="height:${x.total?Math.round(x.total/max*100):0}%"></span><span title="${x.done} concluídas" style="height:${x.done?Math.round(x.done/max*100):0}%"></span></div><small>${fmt(x.wk,{day:'2-digit',month:'2-digit'})}</small></div>`).join('')}</div>`}
function renderDashboard(){const comp=completionThisWeek(),cons=consistency(),active=state.data.goals.filter(g=>g.status==='ativa'),week=state.data.tasks.filter(t=>t.date>=monday(today())&&t.date<=addDays(monday(today()),6)),minutes=week.reduce((s,t)=>s+Math.max(0,Number(t.duration)||0),0),doneMin=week.filter(t=>t.done).reduce((s,t)=>s+Math.max(0,Number(t.duration)||0),0),todays=state.data.tasks.filter(t=>t.date===today()).sort(taskSort),total=state.data.tasks.length+state.data.goals.length+state.data.events.length;
 let html=top('Seu progresso','Painel de desempenho','Acompanhe resultados de verdade, com base nas atividades que você registrou.');
 if(!total)html+=`<section class="empty-dash"><div><div class="eyebrow">COMECE AQUI</div><strong>Sua evolução começa com uma tarefa.</strong><p>Crie sua primeira atividade ou use exemplos de demonstração para explorar o aplicativo.</p></div><div style="display:flex;gap:8px;flex-wrap:wrap">${btn('new-task','+ Criar tarefa','primary')}${btn('load-demo','Ver exemplo','light')}</div></section>`;
 html+=`<div class="grid-stats">${stat('◉','Conclusão da semana',pctLabel(comp.pct),comp.total?`${comp.done} de ${comp.total} tarefas até hoje`:'Sem tarefas até hoje')}${stat('✦','Consistência · 7 dias',pctLabel(cons.pct),cons.eligible?`${cons.good} de ${cons.eligible} dias com ≥80%`:'Sem dias com tarefas','amber')}${stat('◎','Metas ativas',active.length,`${state.data.goals.filter(g=>g.status==='concluída').length} metas concluídas`,'green')}${stat('◷','Minutos previstos concluídos',doneMin?`${doneMin} min`:'—',`${minutes} min previstos na semana`,'purple')}</div>`;
 let todaylist=todays.length?`<div class="task-list">${todays.map(taskItem).join('')}</div>`:empty('Nenhuma tarefa para hoje','Sua agenda de hoje está livre.',btn('new-task','+ Agendar tarefa','light small',`data-date="${today()}"`));
 let goalscats=CATS.map(c=>{const g=active.filter(g=>g.category===c);return {c,n:g.length,avg:g.length?Math.round(g.reduce((s,v)=>s+Math.min(100,v.current/v.target*100),0)/g.length):0}}).filter(v=>v.n);
 html+=`<div class="twocol bigleft">${panel('Atividades desta semana',dayBar(),`<div class="legend"><span>Planejadas</span><span>Concluídas</span></div>`)}${panel('Hoje · '+esc(fmt(today(),{day:'2-digit',month:'long'})),todaylist,`<span class="mini">${todays.filter(t=>t.done).length}/${todays.length} concluídas</span>`)}</div>`;
 html+=`<div class="twocol bigleft">${panel('Evolução nas últimas 6 semanas',trendChart(),`<span class="mini">Tarefas realizadas</span>`)}${panel('Metas por área',goalscats.length?`<div class="goals-mini">${goalscats.map(g=>`<div><div class="goal-mini-row"><span>${esc(g.c)} <small class="muted">(${g.n})</small></span><b>${g.avg}%</b></div>${progress(g.avg)}</div>`).join('')}</div>`:empty('Ainda sem metas ativas','Suas metas aparecerão aqui.'),`<a class="mini" style="color:var(--cyan)" href="#metas">Ver metas →</a>`)}</div>`;
 return html}
function renderWeek(){const base=addDays(today(),state.weekOffset*7),days=weekDays(base),actions=`<div class="week-controls">${btn('week-prev','‹','square')}${btn('week-today','Hoje','small')}${btn('week-next','›','square')}</div>`;
 return top('Seu planejamento','Minha semana',`${fmtDate(days[0])} a ${fmtDate(days[6])} · Organize o que realmente importa.`,actions)+`<div class="week-grid">${days.map(d=>{const list=state.data.tasks.filter(t=>t.date===d).sort(taskSort),r=taskRatio(list);return `<section class="panel day-card ${d===today()?'today':''}"><div class="day-head"><div><strong>${esc(fmtWeekDay(d))}${d===today()?'<span style="color:var(--cyan)"> · hoje</span>':''}</strong><small>${fmtDate(d)} · ${r.done}/${r.total} realizadas</small></div><span class="day-rate">${pctLabel(r.pct)}</span></div>${progress(r.pct)}<div class="task-list">${list.map(taskItem).join('')}</div>${btn('new-task','+ Adicionar tarefa','ghost small',`data-date="${d}"`)}</section>`}).join('')}</div>`}
function goalProgress(g){return Math.min(100,Math.round(g.current/g.target*100))}
function goalCard(g){const per=goalProgress(g),linked=state.data.tasks.filter(t=>t.goalId===g.id),status=g.status==='ativa'?'status-ok':g.status==='concluída'?'status-ok':'status-paused';return `<section class="panel goal-card"><div class="goal-top"><span class="tag">${esc(g.category)}</span><span class="mini ${status}">${esc(g.status)}</span></div><h3>${esc(g.title)}</h3><div class="flex-between"><div class="goal-pct">${per}%</div><div class="mini">${esc(g.current)} / ${esc(g.target)} ${esc(g.unit||'')}</div></div>${progress(per)}<p class="description">${g.deadline?`Prazo: ${fmtDate(g.deadline)} · `:''}${linked.length} tarefas vinculadas (${linked.filter(t=>t.done).length} feitas)</p><div class="goal-foot">${btn('progress-goal','+ Atualizar','light small',`data-id="${esc(g.id)}"`)}<div>${btn('edit-goal','Editar','ghost small',`data-id="${esc(g.id)}"`)}${btn('delete-goal','Excluir','ghost small',`data-id="${esc(g.id)}"`)}</div></div></section>`}
function renderGoals(){let goals=state.data.goals.sort((a,b)=>({ativa:0,pausada:1,'concluída':2}[a.status])-({ativa:0,pausada:1,'concluída':2}[b.status]));return top('Objetivos com direção','Minhas metas','Transforme planos em resultados mensuráveis.',btn('new-goal','+ Nova meta','primary'))+(goals.length?`<div class="grid-stats">${stat('◎','Metas cadastradas',goals.length,'Total de objetivos')}${stat('◈','Em andamento',goals.filter(g=>g.status==='ativa').length,'Metas ativas','green')}${stat('✓','Concluídas',goals.filter(g=>g.status==='concluída').length,'Alvo atingido','amber')}${stat('◷','Pausadas',goals.filter(g=>g.status==='pausada').length,'Temporariamente inativas','purple')}</div><div class="goal-grid">${goals.map(goalCard).join('')}</div>`:panel('Suas metas',empty('Qual será sua próxima conquista?','Cadastre uma meta com prazo e progresso numérico.',btn('new-goal','+ Cadastrar meta','primary'))))}
function eventsForDate(d){return state.data.events.filter(e=>e.date===d).sort((a,b)=>(a.start||'').localeCompare(b.start||''))}
function eventCard(ev){return `<div class="event-row"><small>${ev.start?esc(ev.start):'Sem horário'}${ev.end?' – '+esc(ev.end):''}</small><strong>${esc(ev.title)}</strong>${ev.location?`<small>⌖ ${esc(ev.location)}</small>`:''}${ev.notes?`<p class="soft-text">${esc(ev.notes)}</p>`:''}<div class="row-actions" style="margin-top:7px">${btn('edit-event','Editar','ghost small',`data-id="${esc(ev.id)}"`)}${btn('delete-event','Excluir','ghost small',`data-id="${esc(ev.id)}"`)}</div></div>`}
function renderAgenda(){const mk=monthRef(state.monthOffset),monthDate=parseDate(mk),numberDays=new Date(monthDate.getFullYear(),monthDate.getMonth()+1,0).getDate(),start=(monthDate.getDay()+6)%7,cells=Math.ceil((start+numberDays)/7)*7;
 const grid=Array.from({length:cells},(_,i)=>{const d=addDays(mk,i-start),isCur=d.slice(0,7)===mk.slice(0,7),events=eventsForDate(d);return `<button type="button" class="cal-day ${isCur?'':'outside'} ${d===today()?'today':''} ${d===state.selectedDate?'selected':''}" data-action="select-date" data-date="${d}" aria-label="${fmtDate(d)}: ${events.length} compromissos"><span>${parseDate(d).getDate()}</span>${events.length?`<span class="event-dot" title="${events.length} compromissos"></span>`:''}</button>`}).join('');
 return top('Organize seus horários','Agenda','Seus compromissos ficam armazenados neste navegador.',btn('new-event','+ Compromisso','primary'))+`<div class="calendar-layout">${panel(`<div class="flex-between"><span style="text-transform:capitalize">${esc(fmt(mk,{month:'long',year:'numeric'}))}</span><span class="week-controls">${btn('month-prev','‹','square small')}${btn('month-today','Hoje','small')}${btn('month-next','›','square small')}</span></div>`,`<div class="calendar-month">${['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(n=>`<div class="cal-weekday">${n}</div>`).join('')}${grid}</div>`)}${panel(esc(fmt(state.selectedDate,{weekday:'long',day:'numeric',month:'long'})),eventsForDate(state.selectedDate).length?eventsForDate(state.selectedDate).map(eventCard).join(''):empty('Nenhum compromisso','Agende um evento para esta data.',btn('new-event','+ Novo compromisso','light small',`data-date="${state.selectedDate}"`)))}</div>`}
function renderAnalysis(){const trends=weeklyTrend(),eligible=trends.filter(w=>w.total),all=state.data.tasks.filter(t=>t.date<=today());const r=taskRatio(all);const cats=CATS.map(c=>({c,n:all.filter(t=>t.category===c&&t.done).length,tot:all.filter(t=>t.category===c).length})).filter(x=>x.tot).sort((a,b)=>b.n-a.n),max=Math.max(...cats.map(x=>x.n),1),lastWeek=trends.at(-1);
 return top('Aprenda com seus dados','Análise de desempenho','Identifique tendências reais e evolua com consistência.')+`<div class="grid-stats">${stat('◉','Conclusão histórica',pctLabel(r.pct),`${r.done} de ${r.total} tarefas até hoje`)}${stat('▥','Semanas com atividades',eligible.length,'Nas últimas 6 semanas','amber')}${stat('✓','Feitas nesta semana',lastWeek.done,`${lastWeek.total} planejadas até hoje`,'green')}${stat('◷','Atividades registradas',state.data.tasks.length,'Inclui tarefas futuras','purple')}</div><div class="twocol bigleft">${panel('Histórico de 6 semanas',trendChart(),'<div class="legend"><span>Planejadas</span><span>Concluídas</span></div>')}${panel('Áreas mais trabalhadas',cats.length?cats.map(c=>`<div class="analysis-row"><span>${esc(c.c)}</span>${progress(Math.round(c.n/max*100))}<strong>${c.n}/${c.tot}</strong></div>`).join(''):empty('Sem histórico','Marque tarefas para visualizar seu desempenho.'))}</div>${panel('Resumo por semana',`<div class="wide-table"><table><thead><tr><th>Semana de</th><th>Planejadas até o período</th><th>Concluídas</th><th>Taxa</th></tr></thead><tbody>${trends.map(x=>`<tr><td>${fmtDate(x.wk)}</td><td>${x.total}</td><td>${x.done}</td><td>${pctLabel(x.pct)}</td></tr>`).join('')}</tbody></table></div>`)}<div class="spacer16"></div><div class="notice">As taxas usam apenas tarefas agendadas até hoje. Dias sem tarefas não entram no indicador de consistência. Isso evita distorções causadas por atividades futuras.</div>`}
function renderSettings(){let count=state.data.tasks.length+state.data.goals.length+state.data.events.length;return top('Seus dados, suas regras','Configurações','Gerencie backups, exemplos e informações do aplicativo.')+`<div class="twocol bigleft">${panel('Dados e segurança',`<div class="settings-list"><div class="settings-row"><div><strong>Exportar backup</strong><p>Salve um arquivo JSON contendo tarefas, metas e compromissos.</p></div>${btn('export','↓ Exportar','light small')}</div><div class="settings-row"><div><strong>Importar backup</strong><p>Recupere seus dados de outro navegador. A importação substitui os dados atuais após confirmação.</p></div>${btn('import','↑ Importar','light small')}</div><div class="settings-row"><div><strong>Explorar com exemplos</strong><p>Inclua atividades fictícias marcadas como demonstração e remova-as quando quiser.</p></div><div style="display:grid;gap:7px">${btn('load-demo','Inserir exemplos','small')}${btn('remove-demo','Remover exemplos','ghost small')}</div></div><div class="settings-row"><div><strong>Apagar todos os dados</strong><p>Remove seus ${count} registros neste navegador. A ação exige duas confirmações.</p></div>${btn('clear-all','Apagar tudo','danger small')}</div></div>`)}${panel('Como funciona',`<div class="notice"><strong>Salvamento local</strong><div>Os dados ficam somente neste navegador e dispositivo. O aplicativo não sincroniza dados entre celular e computador.</div><div>Faça backup antes de limpar o navegador ou trocar de aparelho.</div></div><div class="spacer16"></div><div class="soft-text"><strong style="color:white">Indicadores</strong><p><b>Conclusão semanal:</b> tarefas concluídas ÷ tarefas agendadas de segunda-feira até hoje.</p><p><b>Consistência:</b> dias com ≥80% de conclusão entre os dias que possuem tarefas, nos últimos sete dias.</p><p><b>Minutos previstos concluídos:</b> soma das durações previstas de tarefas marcadas como feitas; não é um cronômetro.</p><p><b>Google Agenda:</b> a sincronização automática ainda não está disponível. Eventos desta agenda são locais.</p></div>`)}</div><div class="soft-text" style="margin-top:17px">Ritmo+ v1.0 · MVP independente · Não requer mensalidade, servidor ou cadastro.</div><input type="file" id="backup-file" accept=".json,application/json" hidden />`}
function render(){const v=view();$('#breadcrumbs').textContent=LABELS[v];$('#header-date').textContent=fmt(today(),{weekday:'short',day:'numeric',month:'short',year:'numeric'});document.querySelectorAll('[data-nav]').forEach(a=>{let active=a.getAttribute('data-nav')===v;a.classList.toggle('active',active);active?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current')});const content={dashboard:renderDashboard,semana:renderWeek,metas:renderGoals,agenda:renderAgenda,analise:renderAnalysis,ajustes:renderSettings}[v]();$('#app-content').innerHTML=content;state.lastView=v;}
function showModal(title,intro,form){$('#modal-root').innerHTML=`<div class="overlay" data-overlay="1"><div class="dialog" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h2>${title}</h2><p class="intro">${intro}</p>${form}</div></div>`;const first=$('.dialog input:not([type=hidden]),.dialog select');if(first)first.focus()}
function closeModal(){$('#modal-root').innerHTML=''}
function field(label,name,type='text',value='',other=''){return `<div class="field"><label for="f_${name}">${label}</label><input id="f_${name}" name="${name}" type="${type}" value="${esc(value)}" ${other}/></div>`}

 const form=`<form id="task-form"><input type="hidden" name="id" value="${esc(t?.id||'')}"><div class="form-grid">${field('Título da atividade *','title','text',t?.title||'','maxlength="120" required placeholder="Ex.: Estudar inglês" class="full"')}${field('Data *','date','date',t?.date||defaultDate,'required')}${field('Horário','time','time',t?.time||'')}${selectField('Área','category',CATS,t?.category||'Trabalho')}${selectField('Prioridade','priority',PRIORITIES,t?.priority||'Média')}${field('Duração prevista (min)','duration','number',t?.duration||'','min="0" max="1440"')}${selectField('Vincular a uma meta','goalId',goals,t?.goalId||'')}<div class="field full"><label for="f_description">Descrição</label><textarea name="description" id="f_description" maxlength="600" placeholder="Detalhes opcionais">${esc(t?.description||'')}</textarea></div></div>${!t?'<label class="checkline"><input type="checkbox" name="repeat"> Repetir semanalmente por 4 semanas adicionais</label>':''}${actions(t?'Salvar alterações':'Adicionar tarefa')}</form>`;
 showModal(t?'Editar tarefa':'Nova tarefa',t?'Atualize os dados da atividade.':'Planeje uma atividade e acompanhe sua realização.',form)}
function openGoal(id=null){const g=id?state.data.goals.find(x=>x.id===id):null;if(id&&!g)return;const form=`<form id="goal-form"><input type="hidden" name="id" value="${esc(g?.id||'')}"><div class="form-grid">${field('Nome da meta *','title','text',g?.title||'','maxlength="120" required')}${selectField('Área','category',CATS,g?.category||'Pessoal')}${field('Prazo','deadline','date',g?.deadline||'')}${selectField('Situação','status',['ativa','pausada','concluída'],g?.status||'ativa')}${field('Valor-alvo *','target','number',g?.target??100,'step="any" min="0.01" required')}${field('Progresso atual *','current','number',g?.current??0,'step="any" min="0" required')}${field('Unidade (opcional)','unit','text',g?.unit||'','maxlength="24" placeholder="Ex.: aulas, livros, R$"')}</div>${actions(g?'Salvar meta':'Criar meta')}</form>`;showModal(g?'Editar meta':'Nova meta','Uma boa meta tem um número-alvo e uma maneira objetiva de medir o progresso.',form)}

function ask(title,text,onYes,label='Confirmar',danger=false){window.pendingConfirm=onYes;showModal(title,text,`<div class="dialog-actions">${btn('close-modal','Cancelar','ghost')}${btn('confirm-yes',label,danger?'danger':'primary')}</div>`)}
function demoData(){const tasks=[],goals=[],events=[];const g1={id:uid(),title:'Estudar inglês por 20 horas',category:'Estudos',deadline:addDays(today(),55),status:'ativa',current:8,target:20,unit:'horas',demo:true};const g2={id:uid(),title:'Praticar exercícios 12 vezes',category:'Saúde',deadline:addDays(today(),28),status:'ativa',current:4,target:12,unit:'sessões',demo:true};const g3={id:uid(),title:'Ler 3 livros',category:'Pessoal',deadline:addDays(today(),90),status:'ativa',current:1,target:3,unit:'livros',demo:true};goals.push(g1,g2,g3);
 for(let w=5;w>=0;w--)for(let i=0;i<5;i++){const day=addDays(monday(today()),-7*w+i);if(day>today())continue;const done=w>0?((w+i)%5!==0):i%3!==0;tasks.push({id:uid(),title:['Leitura por 30 minutos','Praticar inglês','Planejar compromissos','Atividade física','Revisar prioridades'][i],date:day,time:['07:00','19:00','08:30','17:30','08:00'][i],category:['Pessoal','Estudos','Trabalho','Saúde','Trabalho'][i],priority:i===2?'Alta':'Média',duration:[30,45,20,40,25][i],goalId:i===1?g1.id:i===3?g2.id:'',done,createdAt:new Date().toISOString(),demo:true})}
 events.push({id:uid(),title:'Reunião semanal de planejamento',date:today(),start:'09:00',end:'09:40',location:'Online',notes:'Exemplo de compromisso.',createdAt:new Date().toISOString(),demo:true});return {tasks,goals,events}}
function handleAction(el){const act=el.dataset.action,id=el.dataset.id,date=el.dataset.date;
 if(act==='close-modal'){closeModal();return}if(act==='new-task'){openTask(null,date||today());return}if(act==='edit-task'){openTask(id);return}if(act==='new-goal'){openGoal();return}if(act==='edit-goal'){openGoal(id);return}if(act==='progress-goal'){openProgress(id);return}if(act==='new-event'){openEvent(null,date||state.selectedDate);return}if(act==='edit-event'){openEvent(id);return}
 if(act==='delete-task'||act==='delete-goal'||act==='delete-event'){const kind=act.split('-')[1],label={task:'tarefa',goal:'meta',event:'compromisso'}[kind];ask('Excluir '+label+'?',`Esta ação não pode ser desfeita.`,()=>{state.data[{task:'tasks',goal:'goals',event:'events'}[kind]]=state.data[{task:'tasks',goal:'goals',event:'events'}[kind]].filter(x=>x.id!==id);if(kind==='goal')state.data.tasks.forEach(t=>{if(t.goalId===id)t.goalId=''});save();notify('Registro excluído.');},'Excluir',true);return}
 if(act==='confirm-yes'){const f=window.pendingConfirm;window.pendingConfirm=null;closeModal();if(f)f();return}
 if(act==='week-prev'){state.weekOffset--;render();return}if(act==='week-next'){state.weekOffset++;render();return}if(act==='week-today'){state.weekOffset=0;render();return}
 if(act==='month-prev'){state.monthOffset--;state.selectedDate=monthRef(state.monthOffset);render();return}if(act==='month-next'){state.monthOffset++;state.selectedDate=monthRef(state.monthOffset);render();return}if(act==='month-today'){state.monthOffset=0;state.selectedDate=today();render();return}if(act==='select-date'){state.selectedDate=date;render();return}
 if(act==='load-demo'){const fn=()=>{const d=demoData();state.data.tasks.push(...d.tasks);state.data.goals.push(...d.goals);state.data.events.push(...d.events);save();notify('Exemplos inseridos. Você pode removê-los nos ajustes.')};if(state.data.tasks.length+state.data.goals.length+state.data.events.length){ask('Adicionar exemplos?','Os registros fictícios serão incluídos junto aos seus dados reais e identificados para remoção posterior.',fn,'Adicionar');}else fn();return}
 if(act==='remove-demo'){const counts=[state.data.tasks,state.data.goals,state.data.events].reduce((n,l)=>n+l.filter(x=>x.demo).length,0);if(!counts){notify('Não há dados de demonstração.');return}ask('Remover exemplos?',`Serão excluídos ${counts} registros de demonstração. Seus registros reais permanecerão.`,()=>{let demoIds=new Set(state.data.goals.filter(g=>g.demo).map(g=>g.id));state.data.tasks=state.data.tasks.filter(t=>!t.demo);state.data.tasks.forEach(t=>{if(demoIds.has(t.goalId))t.goalId=''});state.data.goals=state.data.goals.filter(g=>!g.demo);state.data.events=state.data.events.filter(e=>!e.demo);save();notify('Demonstrações removidas.')},'Remover',true);return}
 if(act==='export'){const a=document.createElement('a'),blob=new Blob([JSON.stringify(state.data,null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='ritmo-backup-'+today()+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);notify('Backup exportado.');return}
 if(act==='import'){$('#backup-file')?.click();return}
 if(act==='clear-all'){ask('Apagar todos os dados?','Todos os seus registros locais serão removidos. Certifique-se de ter exportado um backup.',()=>{ask('Confirmação final','Esta é a última confirmação. A exclusão é permanente e não pode ser desfeita sem backup.',()=>{state.data=EMPTY();save();notify('Todos os dados foram apagados.')},'Sim, apagar tudo',true)},'Continuar',true);return}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el){e.preventDefault();handleAction(el)}else if(e.target.matches('[data-overlay]'))closeModal()});
document.addEventListener('change',e=>{if(e.target.matches('[data-toggle]')){const t=state.data.tasks.find(x=>x.id===e.target.dataset.toggle);if(t){t.done=e.target.checked;t.completedAt=t.done?new Date().toISOString():null;save()}}if(e.target.id==='backup-file'){const file=e.target.files?.[0];if(!file)return;if(file.size>5_000_000){notify('Backup muito grande.');return}file.text().then(txt=>{let d;try{d=JSON.parse(txt)}catch{notify('Arquivo JSON inválido.');return}if(!validateData(d)){notify('Backup incompatível ou incompleto.');return}ask('Substituir dados atuais?',`O arquivo contém ${d.tasks.length} tarefas, ${d.goals.length} metas e ${d.events.length} eventos. Seus dados atuais serão substituídos.`,()=>{state.data=d;save();notify('Backup importado com sucesso.')},'Importar e substituir',true)}).catch(()=>notify('Falha ao ler o arquivo.'));e.target.value=''}});
document.addEventListener('submit',e=>{const f=e.target;if(!['task-form','goal-form','progress-form','event-form'].includes(f.id))return;e.preventDefault();const d=Object.fromEntries(new FormData(f).entries()),id=String(d.id||''),title=String(d.title||'').trim();
 if(f.id==='task-form'){if(!title||!isDate(d.date)){notify('Informe título e data válidos.');return}const base={title:title.slice(0,120),date:d.date,time:d.time||'',category:CATS.includes(d.category)?d.category:'Outros',priority:PRIORITIES.includes(d.priority)?d.priority:'Média',duration:Math.max(0,Math.min(1440,Number(d.duration)||0)),description:String(d.description||'').trim().slice(0,600),goalId:d.goalId||'',demo:false};if(id){const i=state.data.tasks.findIndex(t=>t.id===id);if(i<0)return;state.data.tasks[i]={...state.data.tasks[i],...base}}else{const dates=d.repeat==='on'?Array.from({length:5},(_,i)=>addDays(d.date,i*7)):[d.date];for(const dt of dates){if(dt!==d.date&&state.data.tasks.some(t=>t.date===dt&&t.title.toLowerCase()===title.toLowerCase()))continue;state.data.tasks.push({...base,date:dt,id:uid(),done:false,createdAt:new Date().toISOString()})}}closeModal();save();notify(id?'Tarefa atualizada.':'Tarefa criada.');return}
 if(f.id==='goal-form'||f.id==='progress-form'){const target=Number(d.target),current=Number(d.current);if(!(target>0)||!(current>=0)||!Number.isFinite(target)||!Number.isFinite(current)){notify('Preencha valores numéricos válidos.');return}if(f.id==='progress-form'){let g=state.data.goals.find(x=>x.id===id);if(!g)return;g.target=target;g.current=current;if(current>=target&&g.status==='ativa')g.status='concluída';else if(current<target&&g.status==='concluída')g.status='ativa';closeModal();save();notify('Progresso atualizado.');return}if(!title){notify('Informe um título.');return}const base={title:title.slice(0,120),category:CATS.includes(d.category)?d.category:'Outros',deadline:isDate(d.deadline)?d.deadline:'',status:['ativa','pausada','concluída'].includes(d.status)?d.status:'ativa',target,current,unit:String(d.unit||'').slice(0,24),demo:false};if(current>=target&&base.status==='ativa')base.status='concluída';if(id){const i=state.data.goals.findIndex(x=>x.id===id);if(i<0)return;state.data.goals[i]={...state.data.goals[i],...base}}else state.data.goals.push({...base,id:uid(),createdAt:new Date().toISOString()});closeModal();save();notify(id?'Meta atualizada.':'Meta criada.');return}
 if(f.id==='event-form'){if(!title||!isDate(d.date)){notify('Informe título e data válidos.');return}if(d.start&&d.end&&d.end<=d.start){notify('O horário final deve ser depois do inicial.');return}const base={title:title.slice(0,120),date:d.date,start:d.start||'',end:d.end||'',location:String(d.location||'').trim().slice(0,120),notes:String(d.notes||'').trim().slice(0,1000),demo:false};if(id){let i=state.data.events.findIndex(x=>x.id===id);if(i<0)return;state.data.events[i]={...state.data.events[i],...base}}else state.data.events.push({...base,id:uid(),createdAt:new Date().toISOString()});state.selectedDate=d.date;const dt=parseDate(d.date),cur=parseDate(today());state.monthOffset=(dt.getFullYear()-cur.getFullYear())*12+(dt.getMonth()-cur.getMonth());closeModal();save();notify(id?'Compromisso atualizado.':'Compromisso criado.')}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
window.addEventListener('hashchange',()=>{window.scrollTo(0,0);render()});
render();

  </script>
