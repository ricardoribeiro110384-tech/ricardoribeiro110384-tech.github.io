<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#72d9f1">
<title>O Mar dos Amiguinhos</title>
<style>
:root{--ink:#123d62;--blue:#16a9db;--sun:#ffd95a;--coral:#ff816d;--foam:#e6fbff}
*{box-sizing:border-box}body{margin:0;min-height:100svh;font-family:"Trebuchet MS",system-ui,sans-serif;color:var(--ink);background:linear-gradient(#8be4f3 0 31%,#38c4e7 31% 100%);overflow-x:hidden;touch-action:manipulation}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 15% 20%,#ffffff70 0 5%,transparent 5.5%),radial-gradient(ellipse at 80% 12%,#ffffff80 0 4%,transparent 4.5%);}
.wrap{max-width:750px;margin:auto;padding:clamp(12px,3vw,26px);position:relative}.header{text-align:center}.eyebrow{font-weight:900;font-size:clamp(12px,3vw,16px);letter-spacing:2px;text-transform:uppercase;color:#12668a}.title{font-size:clamp(32px,8vw,58px);line-height:.98;margin:4px 0;color:#064b70;text-shadow:0 3px white,0 6px #ffffff66}.subtitle{font-size:clamp(16px,4vw,22px);font-weight:800;margin:10px auto 15px;max-width:560px}
.board-shell{position:relative;background:#fff5d7;border:6px solid white;border-radius:30px;padding:clamp(10px,3vw,18px);box-shadow:0 9px 0 #1698bb,0 16px 28px #07587938;max-width:560px;margin:auto}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,2.5vw,14px)}.cell{aspect-ratio:1;border:0;border-radius:24px;background:linear-gradient(145deg,#8cf1fb,#36c3e4);box-shadow:inset 0 -7px #1a9dc5,0 3px 0 #fff;cursor:pointer;display:grid;place-items:center;font-size:clamp(43px,12vw,76px);transition:transform .13s,filter .13s;position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent}.cell:active{transform:scale(.94)}.cell:disabled{cursor:default}.cell.found{background:linear-gradient(145deg,#ffe783,#ffbd49);box-shadow:inset 0 -7px #e89135,0 3px 0 #fff;animation:pop .35s ease-out}.cell.splash{background:linear-gradient(145deg,#b8f4ff,#6dd7ed);box-shadow:inset 0 -7px #37b4d2,0 3px 0 #fff;animation:pop .25s ease-out}.mark{font-size:clamp(38px,10vw,65px);filter:drop-shadow(0 3px 0 #ffffff80)}
@keyframes pop{50%{transform:scale(1.09) rotate(-3deg)}}.status{min-height:66px;text-align:center;font-weight:1000;font-size:clamp(21px,5.6vw,31px);margin:17px 0 8px;color:#064b70}.count{display:flex;justify-content:center;gap:10px;margin:4px auto 14px}.bubble{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#fff;border:3px solid #70d9eb;font-size:25px;box-shadow:0 3px 0 #26a9c9}.bubble.got{background:#ffe67c;border-color:#ffad35;animation:pop .35s}.buttons{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:18px;padding:13px 20px;font:900 18px inherit;font-size:18px;font-weight:1000;color:#17496a;background:#fff;box-shadow:0 5px 0 #b7dfe5;cursor:pointer}.btn.primary{background:var(--sun);box-shadow:0 5px 0 #e6a331}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b7dfe5}.hint{text-align:center;font-weight:800;color:#075879;font-size:15px;margin:14px 0 3px}.seabed{position:fixed;bottom:-20px;left:0;right:0;height:80px;pointer-events:none;background:linear-gradient(0deg,#f4d48d 0 28%,transparent 29%)}.shell{position:absolute;bottom:15px;font-size:28px;animation:float 3s ease-in-out infinite}.shell:nth-child(1){left:7%}.shell:nth-child(2){right:11%;animation-delay:1s}.shell:nth-child(3){left:70%;bottom:28px;animation-delay:1.8s}@keyframes float{50%{transform:translateY(-7px) rotate(6deg)}}.finish{position:fixed;inset:0;background:#064b70bb;display:none;place-items:center;padding:20px;z-index:5}.finish.show{display:grid}.card{background:#fff7d9;border:7px solid white;border-radius:32px;padding:26px;text-align:center;max-width:430px;box-shadow:0 10px 0 #198fb0}.card .big{font-size:76px}.card h2{font-size:36px;margin:6px}.card p{font-size:21px;font-weight:800}.confetti{font-size:28px;letter-spacing:8px}
@media(max-height:730px){.wrap{padding-top:9px;padding-bottom:8px}.subtitle{margin:6px auto 9px}.status{margin:10px 0 4px}.cell{border-radius:18px}.hint{margin-top:9px}}
</style>
</head>
<body>
<main class="wrap">
 <header class="header"><div class="eyebrow">Uma aventura para brincar juntinhos</div><h1 class="title">O Mar dos<br>Amiguinhos</h1><p class="subtitle">Toque nas ondas para encontrar os 3 bichinhos do mar!</p></header>
 <section class="board-shell" aria-label="Tabuleiro do mar"><div class="board" id="board"></div></section>
 <div class="status" id="status" aria-live="polite">Vamos procurar? 🌊</div>
 <div class="count" aria-label="Amiguinhos encontrados"><span class="bubble" id="b0">🐠</span><span class="bubble" id="b1">🐢</span><span class="bubble" id="b2">🐙</span></div>
 <div class="buttons"><button class="btn primary" id="again">🔀 Embaralhar</button><button class="btn" id="sound" aria-label="Ativar som">🔊 Som</button></div>
 <p class="hint">Adulto: “Onde será que o peixinho está?”</p>
</main>
<div class="seabed"><span class="shell">🐚</span><span class="shell">🪸</span><span class="shell">🪼</span></div>
<div class="finish" id="finish"><div class="card"><div class="confetti">✨ 🐚 ✨</div><div class="big">🐠 🐢 🐙</div><h2>Encontramos!</h2><p>Todos os amiguinhos apareceram. Viva!</p><button class="btn primary" id="playAgain">🌊 Brincar de novo</button></div></div>
<script>
const animals=['🐠','🐢','🐙'];let places=[],opened=new Set(),soundOn=true;
const board=document.querySelector('#board'),statusEl=document.querySelector('#status');
function speak(text){if(!soundOn||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='pt-BR';u.rate=.88;u.pitch=1.15;speechSynthesis.speak(u)}
function cheer(){if(!soundOn)return;try{const ctx=new(window.AudioContext||window.webkitAudioContext)();[523,659,784].forEach((f,i)=>{let o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=f;g.gain.setValueAtTime(.08,ctx.currentTime+i*.09);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+i*.09+.2);o.start(ctx.currentTime+i*.09);o.stop(ctx.currentTime+i*.09+.22)})}catch(e){}}
function newGame(){places=[];opened.clear();while(places.length<3){let n=Math.floor(Math.random()*9);if(!places.includes(n))places.push(n)}board.innerHTML='';for(let i=0;i<9;i++){const b=document.createElement('button');b.className='cell';b.setAttribute('aria-label','Onda do mar');b.innerHTML='<span>🌊</span>';b.onclick=()=>reveal(i,b);board.appendChild(b)}animals.forEach((_,i)=>document.querySelector('#b'+i).classList.remove('got'));statusEl.textContent='Vamos procurar? 🌊';document.querySelector('#finish').classList.remove('show')}
function reveal(i,b){if(opened.has(i))return;opened.add(i);if(places.includes(i)){let a=places.indexOf(i);b.classList.add('found');b.innerHTML='<span class="mark">'+animals[a]+'</span>';document.querySelector('#b'+a).classList.add('got');const left=3-document.querySelectorAll('.bubble.got').length;let msg=left?['Achou! Um amiguinho!','Muito bem! Olha quem apareceu!','Que legal!'][Math.floor(Math.random()*3)]:'Encontramos todos! Viva!';statusEl.textContent=left?msg:'Encontramos todos! Viva! 🎉';speak(left?'Achou! Muito bem!':'Encontramos todos! Viva!');if(!left){cheer();setTimeout(()=>document.querySelector('#finish').classList.add('show'),700)}}else{b.classList.add('splash');b.innerHTML='<span class="mark">🫧</span>';statusEl.textContent=['Só bolhinhas! Tente outra onda!','Ploc, ploc! Cadê o peixinho?','Vamos procurar em outro lugar!'][Math.floor(Math.random()*3)];speak('Ploc! Tente outra onda!')}b.disabled=true}
document.querySelector('#again').onclick=newGame;document.querySelector('#playAgain').onclick=newGame;document.querySelector('#sound').onclick=e=>{soundOn=!soundOn;e.currentTarget.textContent=soundOn?'🔊 Som':'🔇 Som';if(!soundOn)speechSynthesis?.cancel()};newGame();
</script>
</body></html>
