<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#17284e">
<title>Pula, Sapinho! — Caça aos Vaga-lumes</title>
<style>
:root{--cream:#fff8d9;--lime:#c5ff79;--deep:#0d5570}
*{box-sizing:border-box}body{margin:0;height:100svh;overflow:hidden;touch-action:manipulation;font-family:"Trebuchet MS",system-ui,sans-serif;color:#fff;background:linear-gradient(180deg,#17264d 0%,#354878 39%,#16788b 40%,#07506c 100%)}
.sky{position:absolute;inset:0 0 48%;pointer-events:none;background:radial-gradient(ellipse at 54% 100%,#849dc366,transparent 56%)}.moon{position:absolute;right:8%;top:2%;font-size:clamp(43px,10vw,72px);filter:drop-shadow(0 0 25px #fff3a9aa);animation:moonGlow 3s ease-in-out infinite}@keyframes moonGlow{50%{filter:drop-shadow(0 0 34px #fff5b5)}}.star{position:absolute;font-size:15px;animation:twinkle 1.5s ease-in-out infinite alternate}.s1{top:12%;left:13%}.s2{top:28%;left:33%;animation-delay:.4s}.s3{top:9%;left:60%;animation-delay:.9s}.s4{top:34%;left:80%;animation-delay:.2s}.s5{top:24%;left:6%;animation-delay:.7s}@keyframes twinkle{to{opacity:.3;transform:scale(.65)}}
.app{position:relative;z-index:1;height:100svh;max-width:720px;margin:auto;padding:clamp(9px,2vh,18px) clamp(12px,3vw,22px);display:flex;flex-direction:column;align-items:center}.head{text-align:center;flex:none}.badge{display:inline-block;padding:4px 12px;border:2px solid #ffffff80;background:#ffffff17;border-radius:99px;color:#e6ffed;font-weight:1000;font-size:11px;letter-spacing:1.5px}.title{margin:7px 0 3px;font-size:clamp(34px,8vw,54px);line-height:.93;color:#fff4a0;text-shadow:0 3px #e6a03c,0 6px #10264e;letter-spacing:-1px}.prompt{margin:5px auto 0;font-size:clamp(15px,3.8vw,20px);font-weight:1000;text-shadow:0 2px #12375d}.hud{width:min(100%,540px);display:flex;align-items:center;gap:8px;margin:9px auto 7px;flex:none}.jar{flex:1;display:flex;align-items:center;gap:8px;min-width:0;background:#ffffff20;border:2px solid #fff8d9;border-radius:17px;padding:6px 11px}.jarEmoji{font-size:26px}.counter{white-space:nowrap;font-weight:1000;font-size:clamp(14px,3.6vw,18px)}.lights{display:flex;gap:2px;margin-left:auto}.light{font-size:16px;opacity:.2;filter:grayscale(1);transition:transform .2s,opacity .2s}.light.on{opacity:1;filter:none;transform:scale(1.2);animation:lightUp .35s}@keyframes lightUp{50%{transform:scale(1.7) rotate(15deg)}}.mini{width:44px;height:44px;border:2px solid white;border-radius:14px;color:white;background:#ffffff20;font-size:20px;cursor:pointer}
.stage{position:relative;width:min(100%,560px);flex:1;min-height:220px;max-height:390px;margin:auto 0 0;border:5px solid #a5f2c7;border-bottom-width:9px;border-radius:48% 48% 22px 22px/18% 18% 14px 14px;background:linear-gradient(180deg,#42c6c3,#138ca1 56%,#0b607d);box-shadow:inset 0 12px 30px #d5fff233,0 8px #083c58;overflow:hidden;isolation:isolate}.stage:before,.stage:after{content:"";position:absolute;z-index:-1;left:-20%;width:140%;height:38px;border-top:4px solid #c6fff765;border-radius:50%;animation:ripple 4.6s ease-in-out infinite}.stage:before{top:30%}.stage:after{top:70%;animation-delay:-2.3s}@keyframes ripple{50%{transform:translateX(15px) scaleY(.7)}}.reed{position:absolute;bottom:0;font-size:clamp(38px,9vw,62px);z-index:2;filter:drop-shadow(0 3px #084758)}.reed.left{left:0}.reed.right{right:0;transform:scaleX(-1)}.lily{position:absolute;z-index:1;bottom:5%;left:50%;transform:translateX(-50%);font-size:clamp(55px,12vw,79px);filter:drop-shadow(0 6px 2px #06445488)}
.fly{position:absolute;z-index:4;width:78px;height:78px;border:0;border-radius:50%;background:radial-gradient(circle,#fffbd6 0 12%,#eaff7a90 25%,#ffe35500 70%);display:grid;place-items:center;font-size:clamp(42px,11vw,58px);cursor:pointer;animation:float 2.7s ease-in-out infinite alternate,glow 1.2s ease-in-out infinite alternate;-webkit-tap-highlight-color:transparent;touch-action:manipulation}.fly:active{transform:scale(.82)}.fly:nth-of-type(2n){animation-duration:3.2s,1.3s;animation-delay:-1s,-.6s}.fly:nth-of-type(3n){animation-duration:2.9s,1.1s;animation-delay:-1.7s,-.2s}@keyframes float{to{margin-top:13px;margin-left:10px}}@keyframes glow{to{filter:brightness(1.35) drop-shadow(0 0 13px #fff681)}}.fly.caught{pointer-events:none;animation:catch .32s ease-in forwards}@keyframes catch{to{transform:scale(1.8) rotate(30deg);opacity:0}}
.frog{position:absolute;z-index:5;left:50%;top:79%;transform:translate(-50%,-50%);font-size:clamp(53px,13vw,76px);filter:drop-shadow(0 4px #064451);transition:left .28s ease,top .28s ease;pointer-events:none}.frog.jump{animation:jump .4s cubic-bezier(.3,.9,.3,1.4)}@keyframes jump{0%{translate:0 0}45%{translate:0 -55px;scale:1.15}100%{translate:0 0;scale:1}}
.popword{position:absolute;z-index:7;pointer-events:none;font-size:23px;font-weight:1000;color:#fff69a;text-shadow:0 3px #a75934;animation:popword .7s ease-out forwards}@keyframes popword{0%{opacity:0;transform:translateY(10px) scale(.6)}25%{opacity:1;transform:translateY(-22px) scale(1.2)}100%{opacity:0;transform:translateY(-42px) scale(.95)}}.foot{flex:none;text-align:center;font-size:clamp(13px,3.4vw,16px);font-weight:900;color:#e3ffef;text-shadow:0 2px #06445f;margin:7px 0 0;min-height:25px}
.finish{position:fixed;inset:0;z-index:10;background:#10234ddf;display:none;place-items:center;padding:16px}.finish.show{display:grid}.card{width:min(100%,420px);text-align:center;color:#194667;background:linear-gradient(#fff8d9,#b6f2d5);border:7px solid white;border-radius:32px;padding:22px;box-shadow:0 9px #1c858b;animation:card .45s cubic-bezier(.2,1.5,.5,1)}@keyframes card{from{transform:scale(.65);opacity:0}to{transform:scale(1);opacity:1}}.card .big{font-size:64px}.card h2{font-size:clamp(29px,8vw,40px);margin:2px}.card p{font-size:19px;font-weight:900}.card button{border:0;border-radius:18px;background:#ffd752;color:#194667;font:1000 19px "Trebuchet MS",system-ui,sans-serif;padding:13px 18px;box-shadow:0 5px #d99a2e;cursor:pointer}.confetti{position:fixed;top:-24px;z-index:9;pointer-events:none;font-size:24px;animation:fall 2s linear forwards}@keyframes fall{to{transform:translateY(110svh) rotate(500deg);opacity:0}}
@media(max-height:650px){.app{padding-top:5px;padding-bottom:6px}.title{font-size:33px;margin:5px 0 2px}.prompt{font-size:14px}.hud{margin:5px auto}.stage{min-height:200px;max-height:270px}.foot{margin-top:4px}}
</style></head>
<body>
<div class="sky" aria-hidden="true"><span class="moon">🌙</span><span class="star s1">✨</span><span class="star s2">⭐</span><span class="star s3">✨</span><span class="star s4">⭐</span><span class="star s5">✨</span></div>
<main class="app">
<header class="head"><div class="badge">CAÇA AOS VAGA-LUMES</div><h1 class="title">Pula, Sapinho!</h1><p class="prompt">Toque nos vaga-lumes que piscam! ✨</p></header>
<div class="hud"><div class="jar"><span class="jarEmoji">🫙</span><span class="counter" id="counter">0 de 8</span><div class="lights" id="lights"></div></div><button class="mini" id="sound" aria-label="Desligar efeitos sonoros">🔊</button><button class="mini" id="reset" aria-label="Recomeçar">↻</button></div>
<section class="stage" id="stage" aria-label="Lago com vaga-lumes para tocar"><span class="reed left">🌿</span><span class="reed right">🌿</span><span class="lily">🪷</span><div class="frog" id="frog">🐸</div></section>
<p class="foot" id="foot">Pegue os vaga-lumes para encher o potinho!</p>
</main>
<div class="finish" id="finish"><div class="card"><div class="big">🐸 🫙 ✨</div><h2>Potinho brilhando!</h2><p>O sapinho pegou todos os vaga-lumes. Viva!</p><button id="again">🌟 Brincar outra vez</button></div></div>
<script>
const GOAL=8;let caught=0,soundOn=true,audioCtx;const stage=document.querySelector('#stage'),frog=document.querySelector('#frog');
function sound(freq=650){if(!soundOn)return;try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(freq,audioCtx.currentTime);o.frequency.exponentialRampToValueAtTime(freq*1.45,audioCtx.currentTime+.18);o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(.001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.1,audioCtx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.2);o.start();o.stop(audioCtx.currentTime+.22)}catch(e){}}
function makeFly(){if(caught>=GOAL)return;const f=document.createElement('button');f.type='button';f.className='fly';f.setAttribute('aria-label','Vaga-lume brilhante, toque para pegar');f.textContent='✨';const rect=stage.getBoundingClientRect(),size=78;const x=8+Math.random()*Math.max(1,rect.width-size-16),y=8+Math.random()*Math.max(1,rect.height*.62-size-8);f.style.left=x+'px';f.style.top=y+'px';f.onclick=()=>catchFly(f);stage.appendChild(f)}
function catchFly(f){if(f.classList.contains('caught')||caught>=GOAL)return;const r=f.getBoundingClientRect(),s=stage.getBoundingClientRect();frog.style.left=(r.left+r.width/2-s.left)+'px';frog.style.top=(r.top+r.height/2-s.top)+'px';frog.classList.remove('jump');void frog.offsetWidth;frog.classList.add('jump');const word=document.createElement('span');word.className='popword';word.textContent=['PLOFT!','PEGOU!','BRILHOU!','BOING!'][Math.floor(Math.random()*4)];word.style.left=(r.left-s.left+8)+'px';word.style.top=(r.top-s.top-2)+'px';stage.appendChild(word);setTimeout(()=>word.remove(),750);f.classList.add('caught');caught++;document.querySelector('#counter').textContent=caught+' de '+GOAL;document.querySelector('#light'+(caught-1)).classList.add('on');sound(530+caught*48);setTimeout(()=>{f.remove();if(caught<GOAL){makeFly()}else finish()},310)}
function finish(){document.querySelector('#foot').textContent='Que dedo rápido! O sapinho está feliz!';for(let i=0;i<24;i++){const c=document.createElement('span');c.className='confetti';c.textContent=['✨','⭐','💚','🎉'][i%4];c.style.left=Math.random()*100+'%';c.style.animationDelay=(Math.random()*.65)+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),2500)}setTimeout(()=>document.querySelector('#finish').classList.add('show'),500)}
function restart(){caught=0;document.querySelector('#counter').textContent='0 de '+GOAL;document.querySelectorAll('.light').forEach(x=>x.classList.remove('on'));stage.querySelectorAll('.fly,.popword').forEach(x=>x.remove());frog.style.left='50%';frog.style.top='79%';frog.classList.remove('jump');document.querySelector('#foot').textContent='Pegue os vaga-lumes para encher o potinho!';document.querySelector('#finish').classList.remove('show');for(let i=0;i<3;i++)makeFly()}
const lights=document.querySelector('#lights');for(let i=0;i<GOAL;i++){const s=document.createElement('span');s.className='light';s.id='light'+i;s.textContent='✨';lights.appendChild(s)}document.querySelector('#sound').onclick=e=>{soundOn=!soundOn;e.currentTarget.textContent=soundOn?'🔊':'🔇';e.currentTarget.setAttribute('aria-label',soundOn?'Desligar efeitos sonoros':'Ligar efeitos sonoros')};document.querySelector('#reset').onclick=restart;document.querySelector('#again').onclick=restart;restart();
</script></body></html>
