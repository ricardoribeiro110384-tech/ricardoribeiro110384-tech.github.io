<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#63d7ef">
<title>Pescaria dos Peixinhos</title>
<style>
:root{--ink:#104b68;--cream:#fff7d8;--sun:#ffd95a;--aqua:#54d4e8;--green:#79cf79}
*{box-sizing:border-box}body{margin:0;min-height:100svh;overflow-x:hidden;touch-action:manipulation;font-family:"Trebuchet MS",system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,#8be8f4 0%,#ddfbfa 38%,#43c7e4 38%,#0e91b4 100%)}
.sky{position:fixed;inset:0 0 62%;pointer-events:none;overflow:hidden}.cloud{position:absolute;font-size:clamp(45px,11vw,80px);opacity:.78;animation:drift 18s ease-in-out infinite alternate}.cloud.c1{left:4%;top:3%}.cloud.c2{right:4%;top:22%;animation-delay:-8s}@keyframes drift{to{transform:translateX(22px)}}
.wrap{position:relative;z-index:1;max-width:700px;margin:auto;min-height:100svh;padding:clamp(10px,2.5vh,20px) clamp(12px,3.5vw,24px);display:flex;flex-direction:column;align-items:center}.head{text-align:center}.badge{display:inline-block;background:#fff8e4;border:2px solid white;border-radius:99px;padding:5px 13px;color:#147093;font-size:11px;font-weight:1000;letter-spacing:1.7px;box-shadow:0 3px #6bbfd0}.title{margin:8px 0 2px;font-size:clamp(35px,9vw,58px);line-height:.92;color:#075376;letter-spacing:-1px;text-shadow:0 3px #fff,0 6px #fff9}.instruction{margin:7px auto 0;max-width:500px;font-size:clamp(16px,4.1vw,21px);font-weight:1000;color:#104e69}.hud{width:min(100%,540px);display:flex;align-items:center;gap:8px;margin:12px auto 7px}.basket{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:#fff8e4;border:3px solid white;border-radius:18px;padding:6px 10px;box-shadow:0 4px #59b5c7}.basketIcon{font-size:28px}.score{font-size:clamp(14px,3.7vw,18px);font-weight:1000;white-space:nowrap}.fishCount{display:flex;gap:2px;margin-left:auto;align-items:center}.tinyfish{font-size:16px;opacity:.2;filter:grayscale(1);transition:.2s}.tinyfish.got{opacity:1;filter:none;animation:pop .35s}.sound,.reset{height:44px;width:44px;border:2px solid white;border-radius:15px;background:#ffffffbc;color:#12506e;font-size:20px;font-weight:1000;cursor:pointer;box-shadow:0 3px #61bdce}.pond{position:relative;width:min(100%,550px);height:clamp(310px,48vh,410px);min-height:290px;flex:none;display:flex;align-items:center;justify-content:center;border:9px solid #71d38a;border-bottom-width:15px;border-radius:35px;background:linear-gradient(155deg,#48cde2,#10a4c7 56%,#087ca8);box-shadow:inset 0 10px 20px #ffffff4c,0 8px #277b72,0 16px 23px #124f6935;overflow:hidden}.pond:before{content:"";position:absolute;inset:9px;border:3px dashed #d5fff488;border-radius:27px;pointer-events:none}.pond:after{content:"";position:absolute;left:-10%;top:18%;width:120%;height:22px;border-top:4px solid #d8ffff7a;border-radius:50%;animation:water 4s ease-in-out infinite;pointer-events:none}@keyframes water{50%{transform:translateX(14px) scaleY(.7)}}.holes{position:relative;z-index:1;width:100%;height:100%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:4px 2px;padding:clamp(16px,5vw,28px) clamp(8px,3vw,18px);align-items:center;justify-items:center}.hole{position:relative;width:clamp(83px,25vw,125px);height:clamp(88px,26vw,130px);max-width:100%;display:grid;place-items:center}.waterhole{position:absolute;inset:27% 5% 12%;border-radius:50%;background:radial-gradient(ellipse at 38% 28%,#85f1ed,#1485a6 67%,#086485 70%);box-shadow:inset 0 6px 8px #06496566,0 4px 0 #d2fff459;transition:filter .2s}.hole.active .waterhole{filter:brightness(1.2);animation:ripple .5s ease-out 2}@keyframes ripple{50%{transform:scale(1.1);box-shadow:0 0 0 9px #d4fff54c,0 0 0 18px #d4fff522}}
.fish{position:absolute;z-index:3;left:50%;bottom:9%;width:clamp(72px,21vw,104px);height:clamp(72px,21vw,104px);padding:0;border:0;border-radius:50%;background:radial-gradient(circle,#fff5a9 0 26%,#ffe46c99 44%,#ffe46c00 73%);display:grid;place-items:center;font-size:clamp(55px,15vw,82px);line-height:1;cursor:pointer;opacity:0;visibility:hidden;transform:translate(-50%,85%) scale(.55);filter:drop-shadow(0 5px 2px #07506b66);touch-action:manipulation;-webkit-tap-highlight-color:transparent}.hole.active .fish{visibility:visible;animation:peek .28s cubic-bezier(.18,.85,.28,1.35) forwards,fishBob 1.2s .28s ease-in-out infinite alternate}@keyframes peek{to{opacity:1;transform:translate(-50%,0) scale(1)}}@keyframes fishBob{to{translate:0 -5px;rotate:3deg}}.fish:active{scale:.88}.fish.caught{visibility:visible!important;opacity:1!important;animation:caught .35s ease-in forwards!important}@keyframes caught{from{transform:translate(-50%,0) scale(1);opacity:1}to{transform:translate(-50%,-45%) scale(1.4) rotate(-14deg);opacity:0}}
.reed{position:absolute;bottom:-5px;z-index:2;font-size:clamp(43px,11vw,72px);filter:drop-shadow(0 3px #237961)}.reed.l{left:0}.reed.r{right:0;transform:scaleX(-1)}.message{position:absolute;z-index:4;left:50%;top:14px;transform:translate(-50%,-12px) scale(.6);opacity:0;white-space:nowrap;font-size:clamp(20px,5vw,27px);font-weight:1000;color:#fff7a8;text-shadow:0 3px #a15036;pointer-events:none}.message.show{animation:shout .8s ease-out}@keyframes shout{20%{opacity:1;transform:translate(-50%,0) scale(1.12)}70%{opacity:1;transform:translate(-50%,-8px) scale(1)}100%{opacity:0;transform:translate(-50%,-18px) scale(.9)}}.hint{text-align:center;margin:9px auto 0;color:#fff;font-weight:1000;font-size:clamp(14px,3.5vw,17px);text-shadow:0 2px #075c80;min-height:23px}
.finish{position:fixed;inset:0;z-index:10;background:#075071c9;display:none;place-items:center;padding:16px}.finish.show{display:grid}.card{width:min(100%,420px);text-align:center;background:linear-gradient(#fff8dd,#c9f4d6);border:7px solid white;border-radius:32px;padding:20px;color:#15516e;box-shadow:0 9px #268c89;animation:card .45s cubic-bezier(.2,1.5,.5,1)}@keyframes card{from{transform:scale(.65);opacity:0}to{transform:scale(1);opacity:1}}.card .big{font-size:clamp(53px,15vw,75px)}.card h2{font-size:clamp(29px,8vw,40px);margin:1px}.card p{font-size:19px;font-weight:900}.card button{border:0;border-radius:17px;background:#ffd95a;padding:13px 18px;font:1000 19px "Trebuchet MS",system-ui,sans-serif;color:#15516e;box-shadow:0 5px #d5a02e;cursor:pointer}.confetti{position:fixed;top:-25px;z-index:9;font-size:24px;pointer-events:none;animation:fall 2.2s linear forwards}@keyframes fall{to{transform:translateY(110svh) rotate(550deg);opacity:0}}
@media(max-height:700px){.wrap{padding-top:6px;padding-bottom:6px}.title{font-size:36px;margin:5px 0}.instruction{font-size:15px;margin-top:4px}.hud{margin:7px auto 5px}.pond{height:clamp(285px,46vh,340px);min-height:270px}.hint{margin-top:5px}}
</style></head>
<body>
<div class="sky" aria-hidden="true"><span class="cloud c1">☁️</span><span class="cloud c2">☁️</span></div>
<main class="wrap">
<header class="head"><div class="badge">🎣 PESCARIA RELÂMPAGO! 🎣</div><h1 class="title">Peixinho, apareceu!</h1><p class="instruction">Pegue rápido! Cada peixinho fica menos tempo!</p></header>
<div class="hud"><div class="basket"><span class="basketIcon">🧺</span><span class="score" id="score">0 de 8 peixinhos</span><div class="fishCount" id="fishCount"></div></div><button class="sound" id="sound" aria-label="Desligar efeitos sonoros">🔊</button><button class="reset" id="reset" aria-label="Recomeçar pescaria">↻</button></div>
<section class="pond" id="pond" aria-label="Lago com seis lugares onde os peixinhos podem aparecer"><span class="reed l">🌿</span><span class="reed r">🌿</span><div class="holes" id="holes"></div><div class="message" id="message">PESCADO!</div></section>
<p class="hint" id="hint">Espere... cadê o peixinho? 👀</p>
</main>
<div class="finish" id="finish"><div class="card"><div class="big">🐟 🐠 🐡</div><h2>Que pescaria boa!</h2><p>Você pescou todos os peixinhos. Viva!</p><button id="again">🎣 Pescar de novo!</button></div></div>
<script>
const GOAL=8,FISH=['🐠','🐟','🐡','🐬'];let caught=0,active=-1,fishTimer=null,nextTimer=null,soundOn=true,audio;
const holes=document.querySelector('#holes');
function initHoles(){holes.innerHTML='';for(let i=0;i<6;i++){const h=document.createElement('div');h.className='hole';h.id='hole'+i;h.innerHTML='<div class="waterhole"></div><button class="fish" aria-label="Peixinho, toque para pescar"></button>';h.querySelector('.fish').onclick=()=>catchFish(i);holes.appendChild(h)}}
function blip(freq,dur=.15){if(!soundOn)return;try{if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.exponentialRampToValueAtTime(freq*1.55,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);g.gain.setValueAtTime(.001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.11,audio.currentTime+.02);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.start();o.stop(audio.currentTime+dur+.02)}catch(e){}}
function scheduleFish(delay=250+Math.random()*250){if(caught>=GOAL)return;clearTimeout(nextTimer);nextTimer=setTimeout(showFish,delay)}
function showFish(){if(caught>=GOAL)return;let n=Math.floor(Math.random()*6);if(n===active)n=(n+1+Math.floor(Math.random()*5))%6;active=n;const h=document.querySelector('#hole'+n),f=h.querySelector('.fish');f.textContent=FISH[Math.floor(Math.random()*FISH.length)];f.classList.remove('caught');h.classList.add('active');document.querySelector('#hint').textContent='Olha! O peixinho pulou! Toque nele!';blip(430,.12);fishTimer=setTimeout(()=>{h.classList.remove('active');f.textContent='';active=-1;document.querySelector('#hint').textContent='Ele mergulhou! Espere o próximo...';scheduleFish(250+Math.random()*250)},Math.max(1000,1700-caught*100))}
function catchFish(i){if(i!==active||caught>=GOAL)return;clearTimeout(fishTimer);const h=document.querySelector('#hole'+i),f=h.querySelector('.fish');h.classList.remove('active');f.classList.add('caught');caught++;document.querySelector('#score').textContent=caught+' de '+GOAL+' peixinhos';document.querySelector('#fish'+(caught-1)).classList.add('got');const m=document.querySelector('#message');m.classList.remove('show');void m.offsetWidth;m.classList.add('show');document.querySelector('#hint').textContent=['Boa! Pescou um peixinho!','Splash! Mais um na cestinha!','Muito bem! Lá vem outro!'][Math.floor(Math.random()*3)];blip(680+caught*35,.2);active=-1;if(caught===GOAL){setTimeout(finish,550);return}scheduleFish(250+Math.random()*250)}
function finish(){document.querySelector('#finish').classList.add('show');document.querySelector('#hint').textContent='Pescaria completa!';for(let i=0;i<24;i++){const c=document.createElement('span');c.className='confetti';c.textContent=['✨','🐟','⭐','🫧'][i%4];c.style.left=Math.random()*100+'%';c.style.animationDelay=Math.random()*.7+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),2600)}}
function restart(){clearTimeout(fishTimer);clearTimeout(nextTimer);caught=0;active=-1;document.querySelector('#score').textContent='0 de '+GOAL+' peixinhos';document.querySelectorAll('.tinyfish').forEach(x=>x.classList.remove('got'));document.querySelector('#finish').classList.remove('show');document.querySelector('#hint').textContent='Espere... cadê o peixinho? 👀';initHoles();scheduleFish(900)}
const fishCount=document.querySelector('#fishCount');for(let i=0;i<GOAL;i++){const x=document.createElement('span');x.className='tinyfish';x.id='fish'+i;x.textContent='🐟';fishCount.appendChild(x)}document.querySelector('#sound').onclick=e=>{soundOn=!soundOn;e.currentTarget.textContent=soundOn?'🔊':'🔇';e.currentTarget.setAttribute('aria-label',soundOn?'Desligar efeitos sonoros':'Ligar efeitos sonoros')};document.querySelector('#reset').onclick=restart;document.querySelector('#again').onclick=restart;restart();
</script></body></html>
