<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#18385f">
<title>Pula, Sapinho!</title>
<style>
:root{--night:#152a55;--deep:#12466c;--leaf:#8df17b;--lime:#c2ff7a;--gold:#ffdf67;--cream:#fff8d9}
*{box-sizing:border-box}body{margin:0;min-height:100svh;overflow:hidden;touch-action:manipulation;font-family:"Trebuchet MS",system-ui,sans-serif;color:#fff;background:linear-gradient(180deg,#18264f 0%,#354b83 46%,#167b91 47%,#075168 100%)}
.sky{position:fixed;inset:0 0 44%;overflow:hidden;pointer-events:none;background:radial-gradient(ellipse at 50% 95%,#758ec2aa,transparent 55%)}.moon{position:absolute;right:9%;top:6%;font-size:clamp(46px,12vw,78px);filter:drop-shadow(0 0 24px #fff2a899);animation:moonGlow 3s ease-in-out infinite}@keyframes moonGlow{50%{filter:drop-shadow(0 0 34px #fff4a9)}}.star{position:absolute;font-size:16px;animation:twinkle 1.8s infinite alternate}.star.s1{left:13%;top:14%}.star.s2{left:41%;top:8%;animation-delay:.6s}.star.s3{left:75%;top:35%;animation-delay:1s}.star.s4{left:25%;top:39%;animation-delay:.3s}.star.s5{left:61%;top:21%;animation-delay:1.2s}@keyframes twinkle{to{opacity:.3;transform:scale(.7)}}
.wrap{position:relative;z-index:1;max-width:740px;margin:auto;min-height:100svh;padding:clamp(10px,3vw,22px);display:flex;flex-direction:column;align-items:center}.headline{text-align:center}.badge{display:inline-block;border:2px solid #ffffff90;background:#ffffff1c;border-radius:99px;padding:5px 13px;font-size:12px;font-weight:1000;letter-spacing:2px;color:#e9f7ff}.title{font-size:clamp(37px,9vw,60px);line-height:.9;margin:9px 0 7px;color:#fff6a8;text-shadow:0 4px #e8a846,0 7px #10274d;letter-spacing:-1px}.instruction{margin:0 auto;max-width:500px;font-size:clamp(16px,4vw,21px);font-weight:900;color:#fff;text-shadow:0 2px #1b3e67}.scorebar{width:min(100%,540px);display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px auto 0}.jar{flex:1;display:flex;align-items:center;gap:8px;border:3px solid #fff9db;background:#ffffff1b;border-radius:17px;padding:7px 12px;min-width:0}.jar-icon{font-size:28px}.jar-label{font-size:clamp(13px,3.5vw,17px);font-weight:1000;white-space:nowrap}.lights{display:flex;gap:4px;margin-left:auto}.light{font-size:18px;opacity:.25;filter:grayscale(1);transition:.25s}.light.on{opacity:1;filter:none;transform:scale(1.15);animation:catch .35s}@keyframes catch{50%{transform:scale(1.55) rotate(15deg)}}.sound{border:2px solid white;background:#ffffff20;color:white;border-radius:15px;font-size:21px;width:46px;height:46px;cursor:pointer}
pond{display:block;width:min(100%,560px);margin:auto;position:relative}.pond-inner{height:clamp(200px,38vh,290px);min-height:190px;width:100%;position:relative;border-radius:50% 50% 25px 25px/22% 22% 12px 12px;background:linear-gradient(180deg,#40c6c5 0%,#1593a4 48%,#0b627e 100%);border:5px solid #9cedc3;box-shadow:inset 0 12px 25px #d6ffe633,0 -7px #ffffff14,0 10px #093b5b;overflow:hidden}.pond-inner:before,.pond-inner:after{content:"";position:absolute;left:-20%;width:140%;height:34px;border-top:4px solid #b9fff66b;border-radius:50%;animation:ripple 5s ease-in-out infinite}.pond-inner:before{top:32%;}.pond-inner:after{top:65%;animation-delay:-2.5s}@keyframes ripple{50%{transform:translateX(13px) scaleY(.7)}}.reeds{position:absolute;bottom:0;font-size:clamp(37px,9vw,60px);z-index:2;filter:drop-shadow(0 3px #0a5967)}.reeds.left{left:3%}.reeds.right{right:3%;transform:scaleX(-1)}
.path{position:absolute;inset:9% 8%;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:5px;align-items:center;justify-items:center;z-index:3}.pad{position:relative;width:clamp(54px,14vw,79px);height:clamp(46px,12vw,65px);display:grid;place-items:center;font-size:clamp(37px,9vw,56px);filter:drop-shadow(0 5px 2px #073f5266);transition:transform .28s,filter .3s}.pad:nth-child(5),.pad:nth-child(7){transform:translateY(-12px)}.pad.current{filter:drop-shadow(0 0 12px #fff77a) drop-shadow(0 5px 3px #073f52);animation:padPulse .8s ease-in-out infinite alternate}.pad.done{animation:padDone .4s ease-out}.pad .frog{position:absolute;font-size:clamp(33px,8vw,50px);bottom:4px;left:50%;transform:translateX(-50%);z-index:2;filter:drop-shadow(0 3px #06415b)}.pad.done .frog{animation:hop .55s cubic-bezier(.2,.8,.3,1.4)}@keyframes padPulse{to{transform:scale(1.08) translateY(-4px)}}@keyframes hop{0%{transform:translate(-50%,20px) scale(.85)}48%{transform:translate(-50%,-38px) scale(1.15) rotate(-8deg)}78%{transform:translate(-50%,2px) scale(.95) rotate(6deg)}}@keyframes padDone{50%{filter:drop-shadow(0 0 14px #fff28a) drop-shadow(0 5px 2px #073f52)}}
#frog{position:absolute;left:0;top:0;opacity:0}.hop-text{position:absolute;z-index:4;left:50%;top:4%;transform:translate(-50%,-15px) scale(.5);font-size:clamp(20px,5vw,32px);font-weight:1000;color:#fff681;text-shadow:0 3px #b85e31;opacity:0;pointer-events:none}.hop-text.show{animation:boing .7s ease-out}@keyframes boing{0%{opacity:0;transform:translate(-50%,8px) scale(.5) rotate(-8deg)}25%{opacity:1;transform:translate(-50%,-26px) scale(1.2) rotate(5deg)}75%{opacity:1;transform:translate(-50%,-34px) scale(1)}100%{opacity:0;transform:translate(-50%,-42px) scale(.9)}}
.actions{width:min(100%,540px);display:flex;gap:9px;margin:14px auto 0}.go{flex:1;border:0;border-radius:22px;padding:15px 12px;background:linear-gradient(#ffed86,#ffc947);color:#4d3a20;font:1000 clamp(20px,5vw,27px) "Trebuchet MS",system-ui,sans-serif;text-shadow:0 1px white;box-shadow:0 7px #db913b,0 12px 18px #092d4766;cursor:pointer;transition:transform .1s}.go:active{transform:translateY(4px);box-shadow:0 3px #db913b}.go:disabled{filter:saturate(.7)}.reset{border:2px solid white;border-radius:19px;padding:0 15px;background:#ffffff20;color:white;font-size:21px;font-weight:900;cursor:pointer}.hint{text-align:center;font-size:14px;font-weight:900;color:#e7ffef;margin:10px auto 0;text-shadow:0 2px #064158}
.finish{position:fixed;inset:0;z-index:10;background:#102b54db;display:none;place-items:center;padding:18px}.finish.show{display:grid}.card{width:min(100%,430px);background:linear-gradient(#fff8d9,#b6f3da);border:7px solid white;border-radius:34px;text-align:center;color:#164766;padding:24px 19px;box-shadow:0 10px #237a81;animation:finishPop .5s cubic-bezier(.2,1.5,.5,1)}@keyframes finishPop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}.card .crew{font-size:clamp(43px,13vw,68px);white-space:nowrap}.card h2{font-size:clamp(30px,8vw,41px);margin:3px}.card p{font-size:20px;font-weight:900}.card button{border:0;border-radius:18px;background:#ffd651;padding:13px 18px;font:1000 20px inherit;color:#194866;box-shadow:0 5px #d99c2e;cursor:pointer}.party{position:fixed;inset:0;pointer-events:none;z-index:9;overflow:hidden}.confetti{position:absolute;top:-30px;font-size:24px;animation:fall 2.3s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(600deg);opacity:0}}
@media(max-height:680px){.wrap{padding:7px 12px}.title{font-size:36px;margin:5px 0}.scorebar{margin-top:7px}.pond-inner{height:190px;min-height:180px}.actions{margin-top:9px}.instruction{font-size:15px}}
</style></head>
<body>
<div class="sky" aria-hidden="true"><span class="moon">🌙</span><span class="star s1">✨</span><span class="star s2">⭐</span><span class="star s3">✨</span><span class="star s4">⭐</span><span class="star s5">✨</span></div>
<main class="wrap">
<header class="headline"><div class="badge">BRINCADEIRA DE PULAR</div><h1 class="title">Pula, Sapinho!</h1><p class="instruction">Ajude o sapinho a pegar os vaga-lumes do lago!</p></header>
<div class="scorebar"><div class="jar"><span class="jar-icon">🫙</span><span class="jar-label" id="count">0 de 8</span><div class="lights" id="lights" aria-label="Vaga-lumes encontrados"></div></div><button class="sound" id="sound" aria-label="Desligar efeitos sonoros">🔊</button></div>
<pond aria-label="Lago com caminho de vitória-régias"><div class="pond-inner"><span class="reeds left">🌿</span><span class="reeds right">🌿</span><div class="path" id="path"></div><span class="hop-text" id="hopText">BOING!</span></div></pond>
<div class="actions"><button class="go" id="go">🐸 PULA, SAPINHO!</button><button class="reset" id="reset" aria-label="Começar de novo">↻</button></div>
<p class="hint">Toque no botão grandão e veja o sapo saltar! ✨</p>
</main>
<div class="party" id="party"></div>
<div class="finish" id="finish"><div class="card"><div class="crew">🐸 ✨ 🐸 ✨</div><h2>Que salto incrível!</h2><p>O sapinho pegou todos os vaga-lumes. Viva!</p><button id="again">🌟 Pular de novo!</button></div></div>
<script>
const TOTAL=8;let step=0,soundOn=true,audioCtx;
const path=document.querySelector('#path'),go=document.querySelector('#go'),statusCount=document.querySelector('#count'),lights=document.querySelector('#lights'),hopText=document.querySelector('#hopText');
function build(){path.innerHTML='';for(let i=0;i<TOTAL;i++){const pad=document.createElement('div');pad.className='pad'+(i===0?' current':'');pad.id='pad'+i;pad.innerHTML='<span>🪷</span>'+(i===0?'<span class="frog">🐸</span>':'');path.appendChild(pad)}lights.innerHTML='';for(let i=0;i<TOTAL;i++){const dot=document.createElement('span');dot.className='light';dot.textContent='✨';dot.id='light'+i;lights.appendChild(dot)}}
function playTone(freq,duration=.16,type='sine',delay=0){if(!soundOn)return;try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime+delay;o.type=type;o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(freq*1.45,t+duration);o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.095,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+duration);o.start(t);o.stop(t+duration+.02)}catch(e){}}
function jumpSound(){playTone(240,.12,'triangle');playTone(560,.18,'sine',.08);playTone(780,.14,'triangle',.17)}
function celebrate(){[523,659,784,1047].forEach((n,i)=>playTone(n,.24,'triangle',i*.13));const party=document.querySelector('#party');const bits=['✨','⭐','🌟','💚','🎉'];for(let i=0;i<28;i++){const x=document.createElement('span');x.className='confetti';x.textContent=bits[i%bits.length];x.style.left=Math.random()*100+'%';x.style.animationDelay=Math.random()*.7+'s';party.appendChild(x)}setTimeout(()=>party.innerHTML='',3500)}
function hop(){if(step>=TOTAL)return;const old=document.querySelector('#pad'+step);old.classList.remove('current');old.classList.add('done');old.querySelector('span').textContent='✨';setTimeout(()=>old.querySelector('.frog')?.remove(),480);const next=step+1;step++;if(next<TOTAL){const pad=document.querySelector('#pad'+next);pad.classList.add('current');pad.insertAdjacentHTML('beforeend','<span class="frog">🐸</span>')}statusCount.textContent=step+' de '+TOTAL;document.querySelector('#light'+(step-1)).classList.add('on');hopText.classList.remove('show');void hopText.offsetWidth;hopText.classList.add('show');jumpSound();if(step===TOTAL){go.textContent='🎉 CONSEGUIU!';go.disabled=true;setTimeout(()=>{document.querySelector('#finish').classList.add('show');celebrate()},550)}}
function restart(){step=0;go.disabled=false;go.innerHTML='🐸 PULA, SAPINHO!';statusCount.textContent='0 de '+TOTAL;document.querySelector('#finish').classList.remove('show');document.querySelector('#party').innerHTML='';build()}
go.addEventListener('click',hop);document.querySelector('#reset').addEventListener('click',restart);document.querySelector('#again').addEventListener('click',restart);document.querySelector('#sound').addEventListener('click',e=>{soundOn=!soundOn;e.currentTarget.textContent=soundOn?'🔊':'🔇';e.currentTarget.setAttribute('aria-label',soundOn?'Desligar efeitos sonoros':'Ligar efeitos sonoros')});build();
</script></body></html>
