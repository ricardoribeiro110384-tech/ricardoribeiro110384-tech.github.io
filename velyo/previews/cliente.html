2px;font-weight:800}.small-link{display:inline-flex;align-items:center;gap:7px;margin:20px 0;color:#a2afc6;font-size:12px}.showcase-portrait{padding:25px;background:#232f51;border-radius:18px;margin-top:45px;color:#c1cfee}.showcase-portrait .mini-chart{display:flex;align-items:flex-end;gap:12px;height:110px;margin:19px 0}.showcase-portrait .mini-chart i{background:linear-gradient(0deg,#877aff,#4bc9c0);width:25px;border-radius:8px 8px 0 0}.empty{padding:22px;color:#7d8a9f;font-size:13px;line-height:1.7}.split-shortcuts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.shortcut{padding:15px;border:1px solid #e4e8f2;border-radius:12px;background:#f9fafc}.shortcut strong{font-size:14px;display:block;margin-bottom:7px}.shortcut span{font-size:12px;color:#7c8da2}.client-hero{border-radius:20px;padding:26px;color:#fff;background:linear-gradient(120deg,#5554d7,#7274ed 55%,#2698a6);margin:0 0 21px}.client-hero p{font-size:12px;color:#e4e9ff;margin:0 0 12px}.client-hero strong{font-size:48px;letter-spacing:-2px;display:block}.client-hero span{font-size:12px;color:#edf3ff}.chart-bars{display:flex;align-items:flex-end;gap:11px;height:166px;border-bottom:1px solid #dfe4ee;padding:0 6px}.chart-bars>div{flex:1;min-width:0;background:linear-gradient(180deg,#867af5,#6c5fea);border-radius:7px 7px 0 0;min-height:3px}.chart-labels{display:flex;justify-content:space-around;color:#9ba5b5;font-size:10px;margin-top:9px}.side-note{background:#1d2c47;color:#c4d0e4;padding:16px;border-radius:13px;margin-top:auto;font-size:12px;line-height:1.8}.compact-nav{display:flex;gap:8px;flex-wrap:wrap}.compact-nav button{background:white;border:1px solid #e3e7f0;padding:9px 12px;border-radius:10px;color:#62708b;font-weight:750;font-size:12px}.compact-nav button.active{background:#655be5;border-color:#655be5;color:#fff}.mobile-toggle{display:none}.hide{display:none!important}@media(max-width:1080px){.kpis{grid-template-columns:repeat(2,1fr)}.columns{grid-template-columns:1fr}}@media(max-width:790px){.portal{grid-template-columns:1fr}.aside{min-height:auto;padding:16px;display:block}.brand{padding:0}.side-caption{display:none}.aside-nav{display:flex;overflow:auto;margin-top:15px}.aside-nav button{white-space:nowrap;width:auto;padding:10px 13px}.aside-bottom{display:none}.topbar{padding:15px 17px}.content{padding:23px 17px}.login-wrap{grid-template-columns:1fr}.login-side{padding:24px 28px 28px}.login-side h1{margin:27px 0 10px;font-size:31px;line-height:1.2}.login-side p,.login-side .bottom,.showcase-portrait{display:none}.login-form{padding:35px 25px}.headline h1{font-size:25px}.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:span 1}.kpi{padding:16px}.kpi strong{font-size:23px}.client-hero strong{font-size:37px}.mini{display:none}}

@media(max-width:480px){.kpi strong{font-size:21px}.kpi{padding:14px}.aside-nav{gap:4px}.topbar{gap:8px}.topbar b{max-width:100%;font-size:12px}.pill{font-size:9px;padding:7px 9px}}
</style></head><body><main id="app"></main><script>(()=>{'use strict';
const $=(s)=>document.querySelector(s),e=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let page='login',tab='overview';
const customer={name:'Mariana Oliveira',phone:'(89) 9••••-4120',points:385,validUntil:'22/12/2026',rewards:[{name:'Voucher de R$ 15',points:300},{name:'Brinde especial',points:450},{name:'Desconto de R$ 25',points:600}],tx:[['10/11/2026','Compra pontuada','+85 pts'],['31/10/2026','Resgate','-120 pts'],['26/10/2026','Compra pontuada','+220 pts'],['15/10/2026','Compra pontuada','+200 pts']]};
function login(){
 $('#app').innerHTML=`<div class="login-wrap"><section class="login-side"><a class="brand" href="../">velyo<span>.</span></a><h1>Seus pontos.<br><em>Suas vantagens.</em></h1><p>Acompanhe seu saldo, veja as recompensas disponíveis e consulte seu histórico em um só lugar.</p><div class="bottom">Área exclusiva do cliente · Acesso por celular e senha</div></section><section class="login-form"><div class="login-panel"><span class="headtag">ÁREA DO CLIENTE</span><h2>Bem-vindo de volta.</h2><p>Informe seu número de celular para entrar na sua conta.</p><form id="customerLogin"><label class="field">Celular <input name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="(89) 99999-9999" required></label><label class="field">Senha <input name="password" type="password" autocomplete="current-password" placeholder="Sua senha" required></label><button class="btn" type="submit">Entrar na minha conta →</button></form><div id="clientFeedback" role="status"></div><p class="sub"><button id="firstAccess" class="plain-link" style="border:0;background:none;padding:0">Primeiro acesso</button> · <button id="recover" class="plain-link" style="border:0;background:none;padding:0">Esqueci minha senha</button></p><div class="notice"><i>Homologação:</i> o acesso real do cliente ainda está em desenvolvimento. Não informe senhas verdadeiras nesta prévia.</div><button id="clientPreview" class="btn alt">Ver demonstração com dados fictícios</button><a class="small-link" href="../">← Voltar aos portais</a></div></section></div>`;
}
function shell(){
 const nav=[['overview','⌂','Visão geral'],['rewards','✦','Recompensas'],['history','▤','Meu histórico']];
 $('#app').innerHTML=`<div class="portal"><aside class="aside"><a class="brand" href="../">velyo<span>.</span></a><div class="side-caption">PORTAL DO CLIENTE</div><nav class="aside-nav">${nav.map(([id,ico,label])=>`<button data-tab="${id}" class="${tab===id?'active':''}"><span>${ico}</span>${label}</button>`).join('')}</nav><div class="side-note">Cliente de demonstração · Nenhum dado real foi carregado.</div></aside><div class="main"><div class="topbar"><b>Olá, ${e(customer.name.split(' ')[0])}!</b><div style="display:flex;gap:12px;align-items:center"><span class="pill">Prévia com dados fictícios</span><button class="btn alt" id="clientExit">Sair</button></div></div><main class="content" id="clientBody"></main></div></div>`;
 let content='';
 if(tab==='overview')content=`<div class="headline"><div><span class="eyebrow">MINHA CONTA</span><h1>Minhas vantagens</h1><p>Seu programa de relacionamento, sem complicação.</p></div></div><div class="client-hero"><p>SEU SALDO DE PONTOS</p><strong>${customer.points.toLocaleString('pt-BR')} pts</strong><span>Validade do próximo lote de pontos: ${customer.validUntil}</span></div><div class="columns"><div class="card"><header><div><b>Recompensas próximas</b><small>O que já está ao seu alcance</small></div></header><div class="card-body">${customer.rewards.map(x=>`<div class="metric-row"><span>${e(x.name)}</span><b>${x.points} pts ${x.points<=customer.points?'✓':''}</b></div>`).join('')}<p class="mini" style="display:block">Os resgates são confirmados pelo estabelecimento.</p></div></div><div class="card"><header><div><b>Minha conta</b><small>Dados cadastrados</small></div></header><div class="card-body"><div class="metric-row"><span>Nome</span><b>${e(customer.name)}</b></div><div class="metric-row"><span>Celular</span><b>${customer.phone}</b></div><div class="metric-row"><span>Programa</span><b>Loja demonstração</b></div></div></div></div>`;
 if(tab==='rewards')content=`<div class="headline"><div><span class="eyebrow">BENEFÍCIOS</span><h1>Recompensas disponíveis</h1><p>Conheça os benefícios que sua loja oferece.</p></div></div><div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(190px,1fr))">${customer.rewards.map(x=>`<div class="card"><div class="card-body"><span class="tag purple">BENEFÍCIO</span><h3>${e(x.name)}</h3><p>${x.points} pontos</p><button class="btn ${x.points>customer.points?'alt':''}" disabled title="Resgates apenas no balcão">${x.points>customer.points?'Faltam '+(x.points-customer.points)+' pts':'Disponível no balcão'}</button></div></div>`).join('')}</div><div class="notice">A visualização não registra resgates; confirme pessoalmente com a loja.</div>`;
 if(tab==='history')content=`<div class="headline"><div><span class="eyebrow">EXTRATO</span><h1>Meu histórico</h1><p>Créditos e resgates apresentados neste exemplo.</p></div></div><section class="card"><header><b>Últimas movimentações</b></header><div class="table-scroll"><table class="table"><thead><tr><th>Data</th><th>Operação</th><th>Pontos</th></tr></thead><tbody>${customer.tx.map(x=>`<tr>${x.map(v=>`<td>${e(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`;
 $('#clientBody').innerHTML=content;
}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-tab]');if(b){tab=b.dataset.tab;shell();return}if(ev.target.closest('#clientPreview')){page='demo';tab='overview';shell();return}if(ev.target.closest('#clientExit')){page='login';login();return}if(ev.target.closest('#firstAccess,#recover')){const a=$('#clientFeedback');if(a)a.innerHTML='<div class="feedback error">Primeiro acesso e recuperação dependem da autenticação de clientes no Supabase, ainda não ativada.</div>';return}});
document.addEventListener('submit',ev=>{if(ev.target.id==='customerLogin'){ev.preventDefault();$('#clientFeedback').innerHTML='<div class="feedback error">O login real do cliente não está habilitado neste ambiente de homologação. Use a prévia abaixo.</div>';}});
login();
})();</script></body></html>
