<!doctype html><html lang="pt-BR"><head><meta name="robots" content="noindex,nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#151e35"><title>Plataforma — Velyo v0.8 (prévia)</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#1a2943;font-family:'DM Sans',ui-sans-serif,system-ui,-apple-system,sans-serif}button,input{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}
.portal{min-height:100vh;display:grid;grid-template-columns:260px minmax(0,1fr)}.aside{padding:29px 19px;background:#151e35;color:#c6d1e5;display:flex;flex-direction:column;min-height:100vh}.brand{font-size:31px;letter-spacing:-2px;font-weight:900;color:white;padding:0 15px}.brand span{color:#a2a0ff}.side-caption{letter-spacing:1.5px;text-transform:uppercase;font-size:9px;color:#8a9fbf;margin:4px 0 38px;padding:0 15px;font-weight:800}.aside-nav{display:grid;gap:6px}.aside-nav button{border:0;background:none;color:#aebdd5;width:100%;text-align:left;border-radius:11px;font-size:13px;font-weight:750;padding:13px 14px}.aside-nav button.active,.aside-nav button:hover{background:#6759ed;color:white}.aside-nav button span{font-size:18px;margin-right:9px}.aside-bottom{margin-top:auto;background:#1f2d48;padding:16px;border-radius:13px;font-size:11px;line-height:1.65;color:#afbed8}.aside-bottom b{display:block;color:white;margin-bottom:5px}.main{min-width:0}.topbar{padding:18px 35px;background:#fff;border-bottom:1px solid #e9edf4;display:flex;gap:18px;justify-content:space-between;align-items:center}.topbar b{font-size:14px}.mini{font-size:12px;color:#728099}.pill{display:inline-flex;align-items:center;gap:7px;font-size:10px;font-weight:800;padding:8px 11px;border-radius:30px;background:#e1f6ec;color:#098264}.pill.orange{background:#fff1dd;color:#ad6c22}.content{padding:32px 36px 55px;max-width:1410px;margin:auto}.eyebrow{color:#655be2;letter-spacing:1.6px;font-size:10px;font-weight:850;text-transform:uppercase}.headline{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:0 0 25px}.headline h1{font-size:30px;letter-spacing:-1.1px;margin:6px 0}.headline p{font-size:13px;color:#77849a;margin:0;line-height:1.7}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.kpi{background:#fff;border:1px solid #e9edf4;border-radius:17px;padding:22px;box-shadow:0 6px 22px #202d5906;border-top:3px solid #7569ed}.kpi:nth-child(2){border-top-color ter;gap:7px;align-items:center}.btn.alt{background:#e9e7fe;color:#554cd3}.btn.teal{background:#119f89}.btn:hover{filter:brightness(.98)}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.form-grid label,.field{font-size:12px;color:#5c6e86;display:grid;gap:8px;font-weight:750}.form-grid input,.form-grid select,.field input,.field select{padding:12px 13px;border:1px solid #dce4f0;border-radius:10px;font-size:13px;color:#263451;background:white;width:100%;outline:none;min-width:0}.form-grid input:focus,.field input:focus{border-color:#665be9;box-shadow:0 0 0 3px #665be91a}.form-grid .wide{grid-column:span 2}.feedback{background:#e9f9f0;border:1px solid #bee6d0;padding:11px 14px;border-radius:9px;color:#168262;font-size:12px;margin-top:12px}.feedback.error{background:#fff0f0;border-color:#f8c8c8;color:#ae4d50}.login-wrap{min-height:100vh;display:grid;grid-template-columns:1.03fr 1fr}.login-side{padding:clamp(28px,5vw,76px);background:radial-gradient(circle at 15% 80%,#4949ab 0%,transparent 38%),linear-gradient(135deg,#131d35,#273c67);color:white;display:flex;flex-direction:column}.login-side h1{font-size:clamp(36px,3.9vw,62px);letter-spacing:-2.6px;line-height:1.08;margin:auto 0 22px;max-width:580px}.login-side h1 em{font-style:normal;color:#a59dff}.login-side p{color:#c1cce0;font-size:15px;line-height:1.8;max-width:480px;margin:0 0 auto}.login-side .bottom{color:#bdc8df;font-size:12px;margin-top:30px}.login-form{padding:34px;display:flex;justify-content:center;align-items:center}.login-panel{width:min(100%,430px)}.login-panel h2{font-size:33px;letter-spacing:-1.3px;margin:14px 0 10px}.login-panel p{font-size:13px;color:#7c889a;line-height:1.7}.login-panel form{display:grid;gap:15px;margin-top:28px}.login-panel .btn{width:100%;padding:16px}.login-panel .headtag{font-size:11px;letter-spacing:1.7px;color:#655be5;font-weight:850}.login-panel .sub{margin-top:24px;border-top:1px solid #e6e9f2;padding-top:18px}.plain-link{color:#655be5;font-size:12px;font-weight:800}.small-link{display:inline-flex;align-items:center;gap:7px;margin:20px 0;color:#a2afc6;font-size:12px}.showcase-portrait{padding:25px;background:#232f51;border-radius:18px;margin-top:45px;color:#c1cfee}.showcase-portrait .mini-chart{display:flex;align-items:flex-end;gap:12px;height:110px;margin:19px 0}.showcase-portrait .mini-chart i{background:linear-gradient(0deg,#877aff,#4bc9c0);width:25px;border-radius:8px 8px 0 0}.empty{padding:22px;color:#7d8a9f;font-size:13px;line-height:1.7}.split-shortcuts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.shortcut{padding:15px;border:1px solid #e4e8f2;border-radius:12px;background:#f9fafc}.shortcut strong{font-size:14px;display:block;margin-bottom:7px}.shortcut span{font-size:12px;color:#7c8da2}.client-hero{border-radius:20px;padding:26px;color:#fff;background:linear-gradient(120deg,#5554d7,#7274ed 55%,#2698a6);margin:0 0 21px}.client-hero p{font-size:12px;color:#e4e9ff;margin:0 0 12px}.client-hero strong{font-size:48px;letter-spacing:-2px;display:block}.client-hero span{font-size:12px;color:#edf3ff}.chart-bars{display:flex;align-items:flex-end;gap:11px;height:166px;border-bottom:1px solid #dfe4ee;padding:0 6px}.chart-bars>div{flex:1;min-width:0;background:linear-gradient(180deg,#867af5,#6c5fea);border-radius:7px 7px 0 0;min-height:3px}.chart-labels{display:flex;justify-content:space-around;color:#9ba5b5;font-size:10px;margin-top:9px}.side-note{background:#1d2c47;color:#c4d0e4;padding:16px;border-radius:13px;margin-top:auto;font-size:12px;line-height:1.8}.compact-nav{display:flex;gap:8px;flex-wrap:wrap}.compact-nav button{background:white;border:1px solid #e3e7f0;padding:9px 12px;border-radius:10px;color:#62708b;font-weight:750;font-size:12px}.compact-nav button.active{background:#655be5;border-color:#655be5;color:#fff}.mobile-toggle{display:none}.hide{display:none!important}@media(max-width:1080px){.kpis{grid-template-columns:repeat(2,1fr)}.columns{grid-template-columns:1fr}}@media(max-width:790px){.portal{grid-template-columns:1fr}.aside{min-height:auto;padding:16px;display:block}.brand{padding:0}.side-caption{display:none}.aside-nav{display:flex;overflow:auto;margin-top:15px}.aside-nav button{white-space:nowrap;width:auto;padding:10px 13px}.aside-bottom{display:none}.topbar{padding:15px 17px}.content{padding:23px 17px}.login-wrap{grid-template-columns:1fr}.login-side{padding:24px 28px 28px}.login-side h1{margin:27px 0 10px;font-size:31px;line-height:1.2}.login-side p,.login-side .bottom,.showcase-portrait{display:none}.login-form{padding:35px 25px}.headline h1{font-size:25px}.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:span 1}.kpi{padding:16px}.kpi strong{font-size:23px}.client-hero strong{font-size:37px}.mini{display:none}}
@media(max-width:790px){.portal{grid-template-columns:minmax(0,1fr)}.aside{min-width:0;width:100%;overflow:hidden}.aside-nav{max-width:100%;min-width:0}.main{min-width:0;width:100%}.topbar{min-width:0;flex-wrap:wrap}.topbar>div{min-width:0;flex-wrap:wrap}.content{min-width:0;width:100%}.headline{flex-wrap:wrap}.columns{grid-template-columns:minmax(0,1fr)!important}.card{min-width:0}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))!important}.kpi{min-width:0}}
@media(max-width:480px){.kpi strong{font-size:21px}.kpi{padding:14px}.aside-nav{gap:4px}.topbar{gap:8px}.topbar b{max-width:100%;font-size:12px}.pill{font-size:9px;padding:7px 9px}}
</style></head><body><main id="app"></main><script>(()=>{'use strict';
const $=s=>document.querySelector(s);let tab='overview';
const companies=[{name:'Loja Horizonte',plan:'Essencial',status:'Teste',clients:86},{name:'Studio Primavera',plan:'Profissional',status:'Ativa (exemplo)',clients:214},{name:'Café do Centro',plan:'Essencial',status:'Teste',clients:49}];
function login(){ $('#app').innerHTML=`<div class="login-wrap"><section class="login-side"><a class="brand" href="../">velyo<span>.</span></a><h1>Uma plataforma.<br><em>Várias empresas.</em></h1><p>Governança, assinaturas, suporte e operação comercial do Velyo em um único ambiente restrito.</p><div class="showcase-portrait"><b>Governança da plataforma</b><div class="mini-chart">${[24,52,37,72,63,89,75,100].map(n=>`<i style="height:${n}%"></i>`).join('')}</div><span>Visão ilustrativa de crescimento</span></div><div class="bottom">Painel reservado aos administradores da plataforma.</div></section><section class="login-form"><div class="login-panel"><span class="headtag">ACESSO DO PROPRIETÁRIO</span><h2>Gestão da plataforma.</h2><p>Uma área diferente da administração dos estabelecimentos.</p><form id="platformLogin"><label class="field">E-mail corporativo <input type="email" autocomplete="username" required placeholder="contato@velyo.com.br"></label><label class="field">Senha <input type="password" autocomplete="current-password" required placeholder="Sua senha"></label><button class="btn">Entrar na gestão Velyo →</button></form><div id="platformFeedback" role="status"></div><div class="notice" style="margin-top:20px">Por segurança, este painel não aceita o login de gestores de lojas. O acesso real depende de uma autorização global própria, ainda não implantada.</div><button id="platformPreview" class="btn alt">Ver painel ilustrativo</button><a class="small-link" href="../">← Voltar aos portais</a></div></section></div>`}
function shell(){const nav=[['overview','◫','Visão geral'],['tenants','▤','Empresas'],['billing','◈','Assinaturas'],['support','☏','Suporte']];$('#app').innerHTML=`<div class="portal"><aside class="aside"><a href="../" class="brand">velyo<span>.</span></a><div class="side-caption">ADMINISTRAÇÃO DA PLATAFORMA</div><nav class="aside-nav">${nav.map(([id,i,label])=>`<button data-tab="${id}" class="${tab===id?'active':''}"><span>${i}</span>${label}</button>`).join('')}</nav><div class="aside-bottom"><b>Superadmin — prévia</b>Nenhuma empresa real, assinatura ou dado de cobrança foi carregado.</div></aside><div class="main"><header class="topbar"><b>Velyo / Gestão da plataforma</b><div style="display:flex;gap:10px;align-items:center"><span class="pill orange">Números fictícios</span><button class="btn alt" id="platformExit">Sair</button></div></header><main id="platformBody" class="content"></main></div></div>`;let html='';
 if(tab==='overview')html=`<div class="headline"><div><div class="eyebrow">GESTÃO CENTRAL</div><h1>Visão da plataforma</h1><p>Acompanhe empresas, assinaturas e indicadores de operação.</p></div></div><div class="notice">Estes valores são apenas exemplos de layout. Não representam receita ou assinaturas reais do Velyo.</div><div class="kpis"><article class="kpi"><span>Empresas cadastradas</span><strong>3</strong><small>Exemplos de teste</small></article><article class="kpi"><span>Assinaturas ativas</span><strong>1</strong><small>Exemplo visual</small></article><article class="kpi"><span>MRR demonstrativo</span><strong>R$ 149</strong><small>Sem integração de cobrança</small></article><article class="kpi"><span>Chamados abertos</span><strong>2</strong><small>Atendimentos fictícios</small></article></div><div class="columns"><section class="card"><header><div><b>Empresas cadastradas</b><small>Exemplo de carteira de clientes SaaS</small></div></header>${tenantTable()}</section><section class="card"><header><b>Próximas prioridades</b></header><div class="card-body"><div class="metric-row"><span>Autorização global do proprietário</span><span class="tag warn">Pendente</span></div><div class="metric-row"><span>Faturamento recorrente</span><span class="tag warn">Pendente</span></div><div class="metric-row"><span>Suporte e chamados</span><span class="tag warn">Pendente</span></div></div></section></div>`;
 if(tab==='tenants')html=`<div class="headline"><div><div class="eyebrow">CLIENTES DO SAAS</div><h1>Empresas</h1><p>Cadastro e acompanhamento dos estabelecimentos contratantes.</p></div></div><div class="notice">Novas empresas só serão criadas mediante autenticação global segura, validação e consentimento comercial.</div><section class="card"><header><b>Contas demonstrativas</b></header>${tenantTable()}</section>`;
 if(tab==='billing')html=`<div class="headline"><div><div class="eyebrow">FINANCEIRO</div><h1>Assinaturas</h1><p>Informações comerciais da plataforma, não das lojas.</p></div></div><div class="kpis"><article class="kpi"><span>MRR demonstrativo</span><strong>R$ 149</strong><small>Sem pagamento associado</small></article><article class="kpi"><span>Planos ativos</span><strong>1</strong><small>Exemplo de layout</small></article></div><section class="card" style="margin-top:20px"><header><b>Integração de cobrança</b></header><div class="card-body"><p>Gateway, webhooks, conciliação de pagamentos e gestão de inadimplência serão implementados em etapa posterior. Não há cobrança nesta prévia.</p></div></section>`;
 if(tab==='support')html=`<div class="headline"><div><div class="eyebrow">ATENDIMENTO</div><h1>Suporte</h1><p>Central de chamados dos assinantes.</p></div></div><section class="card"><header><b>Exemplos de solicitações</b></header><div class="table-scroll"><table class="table"><thead><tr><th>Empresa</th><th>Assunto</th><th>Status</th></tr></thead><tbody><tr><td>Loja Horizonte</td><td>Dúvida sobre campanha</td><td><span class="tag warn">Pendente</span></td></tr><tr><td>Studio Primavera</td><td>Como cadastrar recompensa</td><td><span class="tag purple">Em análise</span></td></tr></tbody></table></div></section>`;
 $('#platformBody').innerHTML=html;
}
function tenantTable(){return `<div class="table-scroll"><table class="table"><thead><tr><th>Estabelecimento</th><th>Plano</th><th>Clientes</th><th>Situação</th></tr></thead><tbody>${companies.map(x=>`<tr><td><b>${x.name}</b></td><td>${x.plan}</td><td>${x.clients}</td><td><span class="tag">${x.status}</span></td></tr>`).join('')}</tbody></table></div>`}
document.addEventListener('click',ev=>{const a=ev.target.closest('[data-tab]');if(a){tab=a.dataset.tab;shell();return}if(ev.target.closest('#platformPreview')){tab='overview';shell();return}if(ev.target.closest('#platformExit'))login()});document.addEventListener('submit',ev=>{if(ev.target.id==='platformLogin'){ev.preventDefault();$('#platformFeedback').innerHTML='<div class="feedback error">A autenticação de Superadmin ainda não está ativada. Use a prévia para conhecer o painel.</div>';}});login();
})();</script></body></html>
