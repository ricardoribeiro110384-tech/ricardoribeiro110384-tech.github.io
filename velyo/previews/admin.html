<!doctype html><html lang="pt-BR"><head><meta name="robots" content="noindex,nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#151e35"><title>Administração — Velyo v0.8 (prévia)</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#1a2943;font-family:'DM Sans',ui-sans-serif,system-ui,-apple-system,sans-serif}button,input{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}

ter;gap:7px;align-items:center}.btn.alt{background:#e9e7fe;color:#554cd3}.btn.teal{background:#119f89}.btn:hover{filter:brightness(.98)}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.form-grid label,.field{font-size:12px;color:#5c6e86;display:grid;gap:8px;font-weight:750}.form-grid input,.form-grid select,.field input,.field select{padding:12px 13px;border:1px solid #dce4f0;border-radius:10px;font-size:13px;color:#263451;background:white;width:100%;outline:none;min-width:0}.form-grid input:focus,.field input:focus{border-color:#665be9;box-shadow:0 0 0 3px #665be91a}.form-grid .wide{grid-column:span 2}.feedback{background:#e9f9f0;border:1px solid #bee6d0;padding:11px 14px;border-radius:9px;color:#168262;font-size:12px;margin-top:12px}.feedback.error{background:#fff0f0;border-color:#f8c8c8;color:#ae4d50}.login-wrap{min-height:100vh;display:grid;grid-template-columns:1.03fr 1fr}.login-side{padding:clamp(28px,5vw,76px);background:radial-gradient(circle at 15% 80%,#4949ab 0%,transparent 38%),linear-gradient(135deg,#131d35,#273c67);color:white;display:flex;flex-direction:column}.login-side h1{font-size:clamp(36px,3.9vw,62px);letter-spacing:-2.6px;line-height:1.08;margin:auto 0 22px;max-width:580px}.login-side h1 em{font-style:normal;color:#a59dff}.login-side p{color:#c1cce0;font-size:15px;line-height:1.8;max-width:480px;margin:0 0 auto}.login-side .bottom{color:#bdc8df;font-size:12px;margin-top:30px}.login-form{padding:34px;display:flex;justify-content:center;align-items:center}.login-panel{width:min(100%,430px)}.login-panel h2{font-size:33px;letter-spacing:-1.3px;margin:14px 0 10px}.login-panel p{font-size:13px;color:#7c889a;line-height:1.7}.login-panel form{display:grid;gap:15px;margin-top:28px}.login-panel .btn{width:100%;padding:16px}.login-panel .headtag{font-size:11px;letter-spacing:1.7px;color:#655be5;font-weight:850}.login-panel .sub{margin-top:24px;border-top:1px solid #e6e9f2;padding-top:18px}.plain-link{color:#655be5;font-size:12px;font-weight:800}.small-link{display:inline-flex;align-items:center;gap:7px;margin:20px 0;color:#a2afc6;font-size:12px}.showcase-portrait{padding:25px;background:#232f51;border-radius:18px;margin-top:45px;color:#c1cfee}.showcase-portrait .mini-chart{display:flex;align-items:flex-end;gap:12px;height:110px;margin:19px 0}.showcase-portrait .mini-chart i{background:linear-gradient(0deg,#877aff,#4bc9c0);width:25px;border-radius:8px 8px 0 0}.empty{padding:22px;color:#7d8a9f;font-size:13px;line-height:1.7}.split-shortcuts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.shortcut{padding:15px;border:1px solid #e4e8f2;border-radius:12px;background:#f9fafc}.shortcut strong{font-size:14px;display:block;margin-bottom:7px}.shortcut span{font-size:12px;color:#7c8da2}.client-hero{border-radius:20px;padding:26px;color:#fff;background:linear-gradient(120deg,#5554d7,#7274ed 55%,#2698a6);margin:0 0 21px}.client-hero p{font-size:12px;color:#e4e9ff;margin:0 0 12px}.client-hero strong{font-size:48px;letter-spacing:-2px;display:block}.client-hero span{font-size:12px;color:#edf3ff}.chart-bars{display:flex;align-items:flex-end;gap:11px;height:166px;border-bottom:1px solid #dfe4ee;padding:0 6px}.chart-bars>div{flex:1;min-width:0;background:linear-gradient(180deg,#867af5,#6c5fea);border-radius:7px 7px 0 0;min-height:3px}.chart-labels{display:flex;justify-content:space-around;color:#9ba5b5;font-size:10px;margin-top:9px}.side-note{background:#1d2c47;color:#c4d0e4;padding:16px;border-radius:13px;margin-top:auto;font-size:12px;line-height:1.8}.compact-nav{display:flex;gap:8px;flex-wrap:wrap}.compact-nav button{background:white;border:1px solid #e3e7f0;padding:9px 12px;border-radius:10px;color:#62708b;font-weight:750;font-size:12px}.compact-nav button.active{background:#655be5;border-color:#655be5;color:#fff}.mobile-toggle{display:none}.hide{display:none!important}@media(max-width:1080px){.kpis{grid-template-columns:repeat(2,1fr)}.columns{grid-template-columns:1fr}}@media(max-width:790px){.portal{grid-template-columns:1fr}.aside{min-height:auto;padding:16px;display:block}.brand{padding:0}.side-caption{display:none}.aside-nav{display:flex;overflow:auto;margin-top:15px}.aside-nav button{white-space:nowrap;width:auto;padding:10px 13px}.aside-bottom{display:none}.topbar{padding:15px 17px}.content{padding:23px 17px}.login-wrap{grid-template-columns:1fr}.login-side{padding:24px 28px 28px}.login-side h1{margin:27px 0 10px;font-size:31px;line-height:1.2}.login-side p,.login-side .bottom,.showcase-portrait{display:none}.login-form{padding:35px 25px}.headline h1{font-size:25px}.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:span 1}.kpi{padding:16px}.kpi strong{font-size:23px}.client-hero strong{font-size:37px}.mini{display:none}}
@media(max-width:790px){.portal{grid-template-columns:minmax(0,1fr)}.aside{min-width:0;width:100%;overflow:hidden}.aside-nav{max-width:100%;min-width:0}.main{min-width:0;width:100%}.topbar{min-width:0;flex-wrap:wrap}.topbar>div{min-width:0;flex-wrap:wrap}.content{min-width:0;width:100%}.headline{flex-wrap:wrap}.columns{grid-template-columns:minmax(0,1fr)!important}.card{min-width:0}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))!important}.kpi{min-width:0}}
@media(max-width:480px){.kpi strong{font-size:21px}.kpi{padding:14px}.aside-nav{gap:4px}.topbar{gap:8px}.topbar b{max-width:100%;font-size:12px}.pill{font-size:9px;padding:7px 9px}}
</style></head><body><main id="app"></main><script>(()=>{'use strict';
const $=s=>document.querySelector(s),q=s=>document.querySelectorAll(s);let tab='overview',period=30;const names={overview:'Visão geral',reports:'Relatórios gerenciais',customers:'Clientes',rewards:'Recompensas',messages:'Mensagens'};
const customers=[{name:'Ana Carvalho',phone:'(89) 9••••-9182',points:420,visits:6,risk:false},{name:'Lucas Mendes',phone:'(89) 9••••-3518',points:185,visits:4,risk:false},{name:'Marina Costa',phone:'(89) 9••••-2704',points:320,visits:3,risk:true},{name:'Pedro Alves',phone:'(89) 9••••-6290',points:95,visits:2,risk:true}];
function page(){
  const nav=[['overview','◫','Visão geral'],['reports','▥','Relatórios'],['customers','♧','Clientes'],['rewards','✦','Recompensas'],['messages','✉','Mensagens']];
  $('#app').innerHTML=`<div class="portal"><aside class="aside"><a class="brand" href="#">velyo<span>.</span></a><p class="side-caption">ADMINISTRAÇÃO DA EMPRESA</p><nav class="aside-nav">${nav.map(([id,icon,label])=>`<button data-tab="${id}" class="${tab===id?'active':''}"><span>${icon}</span>${label}</button>`).join('')}</nav><div class="aside-bottom"><b>Painel do gestor</b>Relatórios, clientes, recompensas e mensagens. Operações de balcão ficam em outra página.</div></aside><div class="main"><div class="topbar"><b>Loja Horizonte <span style="font-weight:400;color:#9aa5b8">/ ${names[tab]}</span></b><div style="display:flex;gap:10px;align-items:center"><span class="pill orange">Dados fictícios</span><span class="mini">Gestor</span></div></div><main class="content" id="bodyContent"></main></div></div>`;
  let view='';let periodInput=`<label class="field" style="min-width:125px">Período <select id="period">${[7,30,90].map(n=>`<option ${period===n?'selected':''} value="${n}">${n} dias</option>`).join('')}</select></label>`;
  const faux=period===7?[18,21,26,33,29,35,42]:period===30?[15,22,17,31,26,43,52]:[12,19,25,28,34,45,58];
  if(tab==='overview')view=`<div class="headline"><div><span class="eyebrow">GESTÃO DE RELACIONAMENTO</span><h1>Bom dia, gestor.</h1><p>Entenda sua base de clientes e tome decisões melhores.</p></div>${periodInput}</div><div class="notice"><i>Demonstração:</i> os números desta tela são exemplos para avaliar o layout. Não refletem resultados de empresas reais.</div><div class="kpis"><article class="kpi"><span>Clientes cadastrados</span><strong>248</strong><small>Base de demonstração</small></article><article class="kpi"><span>Vendas pontuadas</span><strong>R$ 18.420</strong><small>Valor ilustrativo</small></article><article class="kpi"><span>Recompra observada</span><strong>36,4%</strong><small>Exemplo no período</small></article><article class="kpi"><span>Clientes em risco</span><strong>27</strong><small>Exemplo: sem retorno há 30 dias</small></article></div><div class="columns"><section class="card"><header><div><b>Atividade de compras pontuadas</b><small>Evolução ilustrativa por semana</small></div><span class="tag purple">Últimos ${period} dias</span></header><div class="card-body"><div class="chart-bars">${faux.map(v=>`<div style="height:${v*1.5}%"></div>`).join('')}</div><div class="chart-labels"><span>Início</span><span>Meio</span><span>Atual</span></div></div></section><section class="card"><header><div><b>Oportunidades do mês</b><small>Ações gerenciais recomendadas</small></div></header><div class="card-body"><div class="metric-row"><span>Clientes com baixa recorrência</span><b>27</b></div><div class="track"><i style="width:54%"></i></div><div class="metric-row"><span>Clientes com 2+ compras</span><b>68</b></div><div class="track"><i style="width:64%;background:#17af93"></i></div><div class="metric-row"><span>Custo conhecido dos resgates</span><b>R$ 218</b></div><p class="mini" style="display:block">Nunca confundir compras pontuadas com faturamento total ou lucro.</p></div></section></div><section class="card"><header><div><b>Clientes que merecem atenção</b><small>Exemplos de frequência reduzida</small></div><button class="btn alt" data-tab="reports">Abrir análise →</button></header>${table(['Cliente','Compras registradas','Situação'],customers.filter(c=>c.risk).map(c=>`<tr><td>${c.name}</td><td>${c.visits}</td><td><span class="tag warn">Verificar retorno</span></td></tr>`).join(''))}</section>`;
  if(tab==='reports')view=`<div class="headline"><div><span class="eyebrow">INDICADORES GERENCIAIS</span><h1>Relatórios</h1><p>Três indicadores prioritários, sem excesso de métricas.</p></div>${periodInput}</div><div class="notice">Exemplo visual: na operação real, os números serão calculados apenas a partir de compras registradas com valor e data válidos.</div><div class="kpis" style="grid-template-columns:repeat(3,minmax(0,1fr))"><article class="kpi"><span>Recompra</span><strong>36,4%</strong><small>Compradores com ≥2 compras no período</small></article><article class="kpi"><span>Clientes em risco</span><strong>27</strong><small>Exemplo com 30 dias sem retorno</small></article><article class="kpi"><span>Custo conhecido</span><strong>R$ 218</strong><small>Não representa custo total ou lucro</small></article></div><div class="columns"><section class="card"><header><b>Comportamento de recompra</b></header><div class="card-body"><div class="metric-row"><span>Compradores que retornaram</span><b>36,4%</b></div><div class="track"><i style="width:36.4%"></i></div><p class="mini" style="display:block">O indicador real exclui histórico sem valor e transações canceladas.</p></div></section><section class="card"><header><b>Custo das recompensas</b></header><div class="card-body"><div class="metric-row"><span>Voucher de R$ 10</span><b>R$ 80</b></div><div class="metric-row"><span>Brinde</span><b>R$ 138</b></div><div class="metric-row"><span>Itens sem custo cadastrado</span><b>2</b></div><p style="font-size:11px;color:#b17b31">Custo parcial — existem informações pendentes.</p></div></section></div><section class="card"><header><b>Clientes em risco — exemplo</b></header>${table(['Cliente','Compras','Saldo','Situação'],customers.filter(c=>c.risk).map(c=>`<tr><td>${c.name}</td><td>${c.visits}</td><td>${c.points} pts</td><td><span class="tag warn">Analisar</span></td></tr>`).join(''))}</section>`;
  if(tab==='customers')view=`<div class="headline"><div><span class="eyebrow">RELACIONAMENTO</span><h1>Clientes</h1><p>Cadastro, pontos e histórico de relacionamento.</p></div></div><div class="card"><header><div><b>Base de clientes</b><small>Dados ilustrativos, telefones ocultos</small></div><input type="search" id="clientSearch" placeholder="Pesquisar cliente" style="padding:10px 12px;border:1px solid #e4e8f2;border-radius:9px"></header><div id="customerTable">${customerTable('')}</div></div>`;
  if(tab==='rewards')view=`<div class="headline"><div><span class="eyebrow">BENEFÍCIOS</span><h1>Recompensas</h1><p>Controle do catálogo e do custo informado por benefício.</p></div></div><section class="card"><header><b>Catálogo de demonstração</b></header>${table(['Recompensa','Pontos','Custo informado','Situação'],[['Voucher R$ 10','300','R$ 10,00','Ativa'],['Brinde especial','450','R$ 8,50','Ativa'],['Desconto R$ 25','600','Não informado','Pendente']].map(x=>`<tr>${x.map(v=>`<td>${v}</td>`).join('')}</tr>`).join(''))}</section><div class="notice">Os custos reais precisam ser informados pela empresa. O sistema não deve inventar margens financeiras.</div>`;
  if(tab==='messages')view=`<div class="headline"><div><span class="eyebrow">COMUNICAÇÃO</span><h1>Mensagens</h1><p>Organize campanhas e acompanhe a comunicação com clientes.</p></div></div><div class="notice">Envio real não ativado. Modelos e histórico abaixo são apenas demonstrativos. Mensagens exigem consentimento, provedor autorizado e registro de entrega.</div><div class="columns"><section class="card"><header><div><b>Campanhas sugeridas</b><small>Modelos de texto aprovados pelo gestor</small></div></header><div class="card-body"><div class="metric-row"><span>Boas-vindas</span><button class="btn alt" data-template="welcome">Ver modelo</button></div><div class="metric-row"><span>Cliente sem comprar há 30 dias</span><button class="btn alt" data-template="return">Ver modelo</button></div><div class="metric-row"><span>Aniversário</span><button class="btn alt" data-template="birthday">Ver modelo</button></div></div></section><section class="card"><header><b>Visualização da mensagem</b></header><div class="card-body"><p id="templateText" style="line-height:1.7;color:#4d607d;font-size:13px">Selecione um modelo para visualizar o conteúdo. Nenhuma mensagem será enviada.</p><span class="tag warn">Envio desativado</span></div></section></div>`;
 $('#bodyContent').innerHTML=view;
}
function table(cols,rows){return `<div class="table-scroll"><table class="table"><thead><tr>${cols.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;}
function customerTable(search){return table(['Nome','Telefone','Pontos','Compras'],customers.filter(c=>c.name.toLowerCase().includes(search.toLowerCase())).map(c=>`<tr><td><b>${c.name}</b></td><td>${c.phone}</td><td>${c.points} pts</td><td>${c.visits}</td></tr>`).join(''));}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-tab]');if(b){tab=b.dataset.tab;page();return}const t=ev.target.closest('[data-template]');if(t){const s={welcome:'Olá! Seja bem-vindo ao nosso programa de relacionamento. Consulte suas vantagens pelo portal do cliente.',return:'Olá! Faz tempo que não vemos você. Quando puder, venha conhecer as novidades da nossa loja.',birthday:'Feliz aniversário! Desejamos um dia especial e muitas alegrias.'};$('#templateText').textContent=s[t.dataset.template];}});
document.addEventListener('change',ev=>{if(ev.target.id==='period'){period=Number(ev.target.value);page();}});document.addEventListener('input',ev=>{if(ev.target.id==='clientSearch')$('#customerTable').innerHTML=customerTable(ev.target.value)});
page();
})();</script></body></html>
