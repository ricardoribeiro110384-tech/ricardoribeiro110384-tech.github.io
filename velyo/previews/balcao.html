:#15ae90}.kpi:nth-child(3){border-top-color:#e6a044}.kpi:nth-child(4){border-top-color:#ec738d}.kpi span{font-size:12px;color:#707f96}.kpi strong{display:block;font-size:27px;letter-spacing:-1.1px;margin:13px 0 8px}.kpi small{font-size:11px;color:#93a0b2}.columns{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;margin-top:19px}.card{background:#fff;border:1px solid #e9edf4;border-radius:17px;overflow:hidden;box-shadow:0 6px 22px #202d5906;margin-bottom:18px}.card header{padding:20px 21px 17px;border-bottom:1px solid #edf0f5;display:flex;justify-content:space-between;align-items:center;gap:12px}.card header b{font-size:15px}.card header small{display:block;color:#929fb1;font-size:11px;margin-top:5px;line-height:1.45}.card-body{padding:21px}.metric-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;color:#697c98;font-size:12px}.metric-row b{color:#1e2b42}.track{height:8px;background:#edf1f8;border-radius:9px;margin:4px 0 15px;overflow:hidden}.track>i{height:100%;background:linear-gradient(90deg,#786ef5,#29baa4);display:block;border-radius:9px}.notice{background:#eeeaff;border:1px solid #e0dafb;color:#6058af;font-size:12px;line-height:1.65;padding:14px 17px;border-radius:12px;margin-bottom:20px}.notice i{font-style:normal;font-weight:800}.table-scroll{overflow:auto}.table{border-collapse:collapse;width:100%;min-width:430px;font-size:12px}.table th{background:#f9fafc;text-align:left;text-transform:uppercase;color:#90a0b8;font-size:10px;letter-spacing:.5px}.table th,.table td{padding:14px 19px;border-bottom:1px solid #eff1f5}.table tr:last-child td{border-bottom:0}.table td b{color:#29374f}.tag{font-size:10px;font-weight:750;padding:5px 9px;background:#edf8f3;border-radius:20px;color:#138d70;white-space:nowrap}.tag.warn{color:#b37729;background:#fff3e3}.tag.purple{background:#f0eeff;color:#665cd8}.btn{padding:12px 18px;background:#665be9;border:0;color:white;font-size:12px;font-weight:800;border-radius:10px;display:inline-flex;justify-content:center;gap:7px;align-items:center}.btn.alt{background:#e9e7fe;color:#554cd3}.btn.teal{background:#119f89}.btn:hover{filter:brightness(.98)}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.form-grid label,.field{font-size:12px;color:#5c6e86;display:grid;gap:8px;font-weight:750}.form-grid input,.form-grid select,.field input,.field select{padding:12px 13px;border:1px solid #dce4f0;border-radius:10px;font-size:13px;color:#263451;background:white;width:100%;outline:none;min-width:0}.form-grid input:focus,.field input:focus{border-color:#665be9;box-shadow:0 0 0 3px #665be91a}.form-grid .wide{grid-column:span 2}.feedback{background:#e9f9f0;border:1px solid #bee6d0;padding:11px 14px;border-radius:9px;color:#168262;font-size:12px;margin-top:12px}.feedback.error{background:#fff0f0;border-color:#f8c8c8;color:#ae4d50}.login-wrap{min-height:100vh;display:grid;grid-template-columns:1.03fr 1fr}.login-side{padding:clamp(28px,5vw,76px);background:radial-gradient(circle at 15% 80%,#4949ab 0%,transparent 38%),linear-gradient(135deg,#131d35,#273c67);color:white;display:flex;flex-direction:column}.login-side h1{font-size:clamp(36px,3.9vw,62px);letter-spacing:-2.6px;line-height:1.08;margin:auto 0 22px;max-width:580px}.login-side h1 em{font-style:normal;color:#a59dff}.login-side p{color:#c1cce0;font-size:15px;line-height:1.8;max-width:480px;margin:0 0 auto}.login-side .bottom{color:#bdc8df;font-size:12px;margin-top:30px}.login-form{padding:34px;display:flex;justify-content:center;align-items:center}.login-panel{width:min(100%,430px)}.login-panel h2{font-size:33px;letter-spacing:-1.3px;margin:14px 0 10px}.login-panel p{font-size:13px;color:#7c889a;line-height:1.7}.login-panel form{display:grid;gap:15px;margin-top:28px}.login-panel .btn{width:100%;padding:16px}.login-panel .headtag{font-size:11px;letter-spacing:1.7px;color:#655be5;font-weight:850}.login-panel .sub{margin-top:24px;border-top:1px solid #e6e9f2;padding-top:18px}.plain-link{color:#655be5;font-size:12px;font-weight:800}.small-link{display:inline-flex;align-items:center;gap:7px;margin:20px 0;color:#a2afc6;font-size:12px}.showcase-portrait{padding:25px;background:#232f51;border-radius:18px;margin-top:45px;color:#c1cfee}.showcase-portrait .mini-chart{display:flex;align-items:flex-end;gap:12px;height:110px;margin:19px 0}.showcase-portrait .mini-chart i{background:linear-gradient(0deg,#877aff,#4bc9c0);width:25px;border-radius:8px 8px 0 0}.empty{padding:22px;color:#7d8a9f;font-size:13px;line-height:1.7}.split-shortcuts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.shortcut{padding:15px;border:1px solid #e4e8f2;border-radius:12px;background:#f9fafc}.shortcut strong{font-size:14px;display:block;margin-bottom:7px}.shortcut span{font-size:12px;color:#7c8da2}.client-hero{border-radius:20px;padding:26px;color:#fff;background:linear-gradient(120deg,#5554d7,#7274ed 55%,#2698a6);margin:0 0 21px}.client-hero p{font-size:12px;color:#e4e9ff;margin:0 0 12px}.client-hero strong{font-size:48px;letter-spacing:-2px;display:block}.client-hero span{font-size:12px;color:#edf3ff}.chart-bars{display:flex;align-items:flex-end;gap:11px;height:166px;border-bottom:1px solid #dfe4ee;padding:0 6px}.chart-bars>div{flex:1;min-width:0;background:linear-gradient(180deg,#867af5,#6c5fea);border-radius:7px 7px 0 0;min-height:3px}.chart-labels{display:flex;justify-content:space-around;color:#9ba5b5;font-size:10px;margin-top:9px}.side-note{background:#1d2c47;color:#c4d0e4;padding:16px;border-radius:13px;margin-top:auto;font-size:12px;line-height:1.8}.compact-nav{display:flex;gap:8px;flex-wrap:wrap}.compact-nav button{background:white;border:1px solid #e3e7f0;padding:9px 12px;border-radius:10px;color:#62708b;font-weight:750;font-size:12px}.compact-nav button.active{background:#655be5;border-color:#655be5;color:#fff}.mobile-toggle{display:none}.hide{display:none!important}@media(max-width:1080px){.kpis{grid-template-columns:repeat(2,1fr)}.columns{grid-template-columns:1fr}}@media(max-width:790px){.portal{grid-template-columns:1fr}.aside{min-height:auto;padding:16px;display:block}.brand{padding:0}.side-caption{display:none}.aside-nav{display:flex;overflow:auto;margin-top:15px}.aside-nav button{white-space:nowrap;width:auto;padding:10px 13px}.aside-bottom{display:none}.topbar{padding:15px 17px}.content{padding:23px 17px}.login-wrap{grid-template-columns:1fr}.login-side{padding:24px 28px 28px}.login-side h1{margin:27px 0 10px;font-size:31px;line-height:1.2}.login-side p,.login-side .bottom,.showcase-portrait{display:none}.login-form{padding:35px 25px}.headline h1{font-size:25px}.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:span 1}.kpi{padding:16px}.kpi strong{font-size:23px}.client-hero strong{font-size:37px}.mini{display:none}}
@media(max-width:790px){.portal{grid-template-columns:minmax(0,1fr)}.aside{min-width:0;width:100%;overflow:hidden}.aside-nav{max-width:100%;min-width:0}.main{min-width:0;width:100%}.topbar{min-width:0;flex-wrap:wrap}.topbar>div{min-width:0;flex-wrap:wrap}.content{min-width:0;width:100%}.headline{flex-wrap:wrap}.columns{grid-template-columns:minmax(0,1fr)!important}.card{min-width:0}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))!important}.kpi{min-width:0}}
@media(max-width:480px){.kpi strong{font-size:21px}.kpi{padding:14px}.aside-nav{gap:4px}.topbar{gap:8px}.topbar b{max-width:100%;font-size:12px}.pill{font-size:9px;padding:7px 9px}}
</style></head><body><main id="app"></main><script>(()=>{'use strict';
const $=s=>document.querySelector(s),cur=x=>(Number(x)/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});let tab='counter';let customers=[{id:1,name:'Ana Carvalho',phone:'(89) 9••••-9182',points:420},{id:2,name:'Lucas Mendes',phone:'(89) 9••••-3518',points:185},{id:3,name:'Marina Costa',phone:'(89) 9••••-2704',points:320}];const rewards=[{id:1,name:'Voucher R$ 10',points:300},{id:2,name:'Brinde especial',points:450}];let history=[];
function options(items){return items.map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}
function shell(){
 $('#app').innerHTML=`<div class="portal"><aside class="aside"><a href="#" class="brand">velyo<span>.</span></a><p class="side-caption">OPERAÇÃO DO BALCÃO</p><nav class="aside-nav"><button data-tab="counter" class="${tab==='counter'?'active':''}"><span>⇄</span>Pontuar e resgatar</button><button data-tab="new" class="${tab==='new'?'active':''}"><span>♧</span>Cadastro rápido</button></nav><div class="aside-bottom"><b>Balcão independente</b>Sem relatórios gerenciais, configurações ou assinaturas de outras empresas.</div></aside><div class="main"><header class="topbar"><b>Loja Horizonte / Balcão</b><span class="pill orange">Operação simulada</span></header><main class="content"><div class="headline"><div><span class="eyebrow">ATENDIMENTO</span><h1>${tab==='counter'?'Pontos e resgates':'Cadastrar cliente'}</h1><p>Atendimento simples e direto para o operador.</p></div></div><div class="notice"><i>Prévia isolada:</i> este balcão usa clientes e pontos fictícios. Nada é gravado no Supabase.</div><div id="bodyContent"></div></main></div></div>`;
 if(tab==='counter')$('#bodyContent').innerHTML=`<div class="columns" style="grid-template-columns:1fr 1fr"><section class="card"><header><div><b>Creditar compra</b><small>Pontuação demonstrativa: 1 ponto por R$ 1</small></div></header><div class="card-body"><form id="creditForm" class="form-grid" style="grid-template-columns:1fr"><label>Cliente <select name="customer" required>${options(customers)}</select></label><label>Valor da compra (R$) <input name="amount" placeholder="75,90" inputmode="decimal" required></label><button class="btn" type="submit">Creditar pontos</button></form><div id="creditFeedback" role="status"></div></div></section><section class="card"><header><div><b>Resgatar recompensa</b><small>Saldo suficiente e confirmação do operador</small></div></header><div class="card-body"><form id="redeemForm" class="form-grid" style="grid-template-columns:1fr"><label>Cliente <select id="redeemCustomer" name="customer" required>${options(customers)}</select></label><label>Recompensa <select name="reward" required>${options(rewards)}</select></label><div class="metric-row"><span>Saldo disponível</span><b id="balancePreview">${customers[0].points} pts</b></div><button class="btn teal" type="submit">Confirmar resgate</button></form><div id="redeemFeedback" role="status"></div></div></section></div><section class="card"><header><b>Operações desta sessão</b><small>Histórico fictício do teste</small></header>${table()}</section>`;
 else $('#bodyContent').innerHTML=`<section class="card" style="max-width:630px"><header><div><b>Cadastro rápido</b><small>Identificação pelo telefone no balcão</small></div></header><div class="card-body"><form id="newCustomer" class="form-grid"><label>Nome do cliente <input name="name" required minlength="2" maxlength="120" placeholder="Nome completo"></label><label>Celular <input name="phone" required placeholder="(89) 99999-9999"></label><button class="btn wide">Cadastrar cliente</button></form><div id="newFeedback" role="status"></div></div></section>`;
}
function table(){return `<div class="table-scroll"><table class="table"><thead><tr><th>Cliente</th><th>Operação</th><th>Pontos</th></tr></thead><tbody>${history.map(t=>`<tr><td>${t[0]}</td><td>${t[1]}</td><td>${t[2]} pts</td></tr>`).join('')||'<tr><td colspan="3" class="empty">Nenhuma operação simulada nesta sessão.</td></tr>'}</tbody></table></div>`}
function msg(id,message,ok=true){$('#'+id).innerHTML=`<div class="feedback ${ok?'':'error'}">${message}</div>`}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-tab]');if(b){tab=b.dataset.tab;shell()}});
document.addEventListener('change',ev=>{if(ev.target.id==='redeemCustomer')$('#balancePreview').textContent=customers.find(c=>c.id===Number(ev.target.value)).points+' pts'});
document.addEventListener('submit',ev=>{const form=ev.target;ev.preventDefault();const fd=new FormData(form);if(form.id==='creditForm'){let s=String(fd.get('amount')).replace(/\s/g,'');if(!/^\d+(?:,\d{1,2})?$/.test(s))return msg('creditFeedback','Informe um valor como 75,90.',false);const amount=Math.round(Number(s.replace(',','.'))*100);if(amount<100||amount>100000000)return msg('creditFeedback','Informe valor válido (mínimo R$ 1).',false);const c=customers.find(c=>c.id===Number(fd.get('customer')));const p=Math.floor(amount/100);c.points+=p;history.unshift([c.name,'Crédito',`+${p}`]);shell();msg('creditFeedback',`${p} pontos adicionados ao saldo fictício de ${c.name}.`);return}
if(form.id==='redeemForm'){const c=customers.find(c=>c.id===Number(fd.get('customer'))),r=rewards.find(x=>x.id===Number(fd.get('reward')));if(c.points<r.points)return msg('redeemFeedback',`Saldo insuficiente: ${c.points} pts para resgatar ${r.points} pts.`,false);c.points-=r.points;history.unshift([c.name,'Resgate',`-${r.points}`]);shell();msg('redeemFeedback',`Resgate de ${r.name} registrado somente nesta prévia.`);return}
if(form.id==='newCustomer'){const name=String(fd.get('name')).trim(),phone=String(fd.get('phone')).trim();if(name.length<2||phone.length<10)return msg('newFeedback','Preencha o nome e telefone corretamente.',false);customers.push({id:Math.max(...customers.map(c=>c.id))+1,name:name.replace(/[<>]/g,''),phone:phone.replace(/[<>]/g,''),points:0});msg('newFeedback',`Cliente ${name.replace(/[<>]/g,'')} criado na sessão de teste.`);form.reset();}}
);shell();
})();</script></body></html>
